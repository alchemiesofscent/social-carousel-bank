- id: digest-of-justinian-book-34-chapter-2-paragraph-21-section-1-d-34-2-21-1--iustinianus-digesta-iustiniani-1-50-the-digest-of-justinian
  record_type: ancient_passage
  source_layer: ancient
  container_id: digest-of-justinian-book-34-chapter-2-paragraph-21-section-1-d-34-2-21-1

  text_original: 'πρὸς ἕκαστον δὲ τῶν μύρων

    ἐμβάλλουσι τὰ πρόσφορα τῶν ἀρωμάτων, οἷον εἰς μὲν

    τὴν κύπρον καρδάμωμον, ἀσπάλαθον ἀναφυράσαντες

    τῷ εὐώδει. εἰς δὲ τὸ ῥόδινον σχοῖνον, ἀσπάλαθον,

    κάλαμον· ἡ δ'' ἀναφύρασις ὁμοίως. καὶ τοῖς ἄλ-

    λοις ἀεὶ τὰ ἁρμόττοντα. τῷ ῥοδίνῳ δ'' ἐμβάλλονται

    καὶ ἅλες πολλοὶ καὶ τοῦτ'' ἴδιον παρὰ τἆλλα, διὸ καὶ

    πλείστη ἀπουσία γίνεται· μίγνυται γὰρ εἰς τὸν ἀμφορέα

    δύο μέδιμνοι.

    τῆς δὲ κύπρου ἡ μὲν ἐργασία

    παραπλησία τῇ τοῦ ῥοδίνου· πλὴν ἀλλ'' ἐάν τις μὴ τα-

    χέως ἐξαίρῃ καὶ ἀποθλίβῃ σῆψις ἐγγινομένη φθείρει

    τὰ μύρα διὰ τὴν δυσωδίαν· ποιεῖ γὰρ σῆψιν ἀνυγραι-

    νομένη. παραπλησία δ'' ἐργασία καὶ τοῦ μηλίνου·

    προστυφέντος γὰρ ἐλαίου καὶ τὰ μῆλα ἐμβάλλουσιν

    εἰς ψυχρὸν, εἶτ'' ἐξαιροῦσι πάλιν πρὸ τοῦ μελαίνεσθαι

    κατὰ πάσας τὰς ἐμβολάς· μελαινομένων γὰρ σῆψις διὰ

    τὸ ἀνυγραίνεσθαι καθάπερ καὶ ἐπὶ τῆς κύπρου.

    ἅπαντα δὲ συντίθενται τὰ μύρα τὰ μὲν

    ἀπ'' ἀνθῶν τὰ δὲ ἀπὸ φύλλων τὰ δὲ ἀπὸ κλωνὸς τὰ δ''

    ἀπὸ ῥίζης τὰ δ'' ἀπὸ ξύλων τὰ δ'' ἀπὸ καρποῦ τὰ δ''

    ἀπὸ δακρύων. μικτὰ δὲ πάνθ'' ὡς εἰπεῖν. ἀπ'' ἀν-

    θῶν μὲν οἷον τὸ ῥόδινον καὶ τὸ λευκόϊνον. καὶ τὸ

    σούσινον· καὶ γὰρ τοῦτο ἐκ τῶν κρίνων· ἔτι δὲ τὸ σι-

    σύμβρινον καὶ τὸ ἑρπύλλινον καὶ ἡ κύπρος καὶ πρὸς

    τούτοις τὸ κρόκινον· βέλτιστος δ'' ἐν αἰγίνῃ καὶ κιλι-

    κίᾳ. ἀπὸ δὲ τῶν φύλλων οἷον τό τε μύρρινον καὶ τὸ

    οἰνάνθινον· αὕτη δ'' ἐν κύπρῳ φύεται ὀρεινὴ καὶ πο-

    λύοδμος· ἀπὸ δὲ τῆς ἐν τῇ ἑλλάδι οὐ γίνεται διὰ τὸ

    ἄοδμον.

    ἀπὸ ῥιζῶν δὲ τό τε ἴρινον καὶ τὸ νάρ-

    δινον καὶ τὸ ἀμαράκινον ἐκ τοῦ κόστου· τοῦτο γὰρ

    ὀνομάζουσι τὴν ῥίζαν. τὸ δὲ χρίσμα τὸ ἐρετρικὸν

    ἐκ τοῦ κυπείρου. κομίζεται δὲ ἀπὸ τῶν κυκλάδων

    τὸ κύπειρον. ἀπὸ ξύλου δὲ ὁ φοίνιξ καλούμενος·

    ἐμβάλλουσι γὰρ τὴν ὀνομαζομένην σπάθην ξηράναντες.

    ἀπὸ καρπῶν δὲ τό τε μήλινον καὶ τὸ μύρτινον καὶ τὸ

    δάφνινον· τὸ δ'' αἰγύπτιον ἐκ πλειόνων ἔκ τε τοῦ κινα-

    μώμου καὶ ἐκ σμύρνης καὶ ἐξ ἄλλων.

    ἔτι δ'' ἐκ

    πλειόνων τούτου τὸ μεγαλεῖον· καὶ γὰρ ἐκ κιναμώμου

    ... καὶ ἐκ τῆς σμύρνης κοπτομένης ἔλαιον ῥεῖ· στακτὴ

    γὰρ καλεῖται διὰ τὸ κατὰ μικρὸν στάζειν. ὃ δὴ

    μόνον τινές φασιν ἁπλοῦν εἶναι καὶ ἀσύνθετον τῶν μύ-

    ρων τὰ δ'' ἄλλα πάντα σύνθετα, πλὴν τὰ μὲν ἐκ

    πλειόνων τὰ δ'' ἐξ ἐλαττόνων, ἐξ ἐλαχίστων δὲ τὸ ἴρι-

    νον. οἱ μὲν οὖν οὕτω λέγουσιν, οἱ δὲ τὴν ἐργασίαν

    τῆς στακτῆς εἶναι τοιάνδε· τὴν σμύρναν ὅταν κόψωσι

    καὶ διατήξωσι ἐν ἐλαίῳ βαλανίνῳ πυρὶ μαλακῷ ὕδωρ

    ἐπιχεῖν θερμόν· συνιζάνειν δ'' εἰς βυθὸν τὴν σμύρναν

    καὶ τοὔλαιον καθάπερ ἰλύν· ὅταν δὲ τοῦτο συμβῇ τὸ

    μὲν ὕδωρ ἀπηθεῖν τὴν δ'' ὑπόστασιν ἀποθλίβειν ὀργά-

    νοις.

    τὸ δὲ μεγαλεῖον ἐκ ῥητίνης κεκαυμένης

    συντίθεσθαι καὶ ἐλαίου βαλανίνου· μίγνυσθαι δὲ κα-

    σίαν, κινάμωμον, σμύρναν. πλείστην δὲ πραγματείαν

    περὶ τὸ μεγαλεῖον καὶ τὸ αἰγύπτιον εἶναι, πλείστων

    γὰρ μίξιν καὶ πολυτελεστάτων. τῷ δὲ μεγαλείῳ

    καὶ τὸ ἔλαιον ἕψεσθαι δέχ'' ἡμέρας καὶ δέκα νύκτας,

    εἶτα οὕτως τὴν ῥητίνην ἐμβάλλεσθαι καὶ τἆλλα· δεκ-

    τικώτερον γὰρ ἀφεψηθέν. τὸ δ'' ἀμαράκινον τὸ χρη-

    στὸν ἐκ τῶν βελτίστων ἀρωμάτων συντίθεσθαι χωρὶς

    ἀμαράκου· τούτῳ δ'' οὐ χρῆσθαι μόνῳ τῶν ἀρωμάτων

    τοὺς μυρεψοὺς οὐδ'' εἰς ἓν μύρον, ἀλλὰ ψευδώνυμός

    τις ἡ ἐπίκλησις.

    ποιοῦσι δὲ καὶ τὰ μὲν ἀχρω-

    μάτιστα τὰ δὲ κεχρωματισμένα. χρωματίζουσι δὲ

    ἀμαράκινον, ῥόδινον, μεγαλεῖον, ἀχρωμάτιστα δὲ τῶν

    μὲν πολυτελῶν αἰγύπτιον, μήλινον, κύπρος, τὰ δ'' εὐ-

    τελῆ πάντα· ταῦτα δὲ ἀχρωμάτιστα διότι τὸ μὲν αἰ-

    γύπτιον καὶ τὴν κύπρον λευκὰ εἶναι βούλονται, τῷ δὲ

    μηλίνῳ τὴν τῶν μήλων χρόαν, τοῖς δ'' εὐτελέσιν οὐ

    λυσιτελεῖ τὸ χρῶμα προστιθέναι. χρωματίζουσι δὲ

    τὰ μὲν ἐρυθρὰ τῇ ἀγχούσῃ, τὸ δ'' ἀμαράκινον τῷ κα-

    λουμένῳ χρώματι· τοῦτο δ'' ἐστὶ ῥιζίον ὃ ἄγουσιν ἐκ

    τῆς συρίας.

    συνεργεῖν δὲ δοκοῦσι πρὸς τὰς γεύσεις

    οὐχ αἱ ὀδμαὶ μόνον ἀλλὰ καὶ αἱ δριμύτητες καὶ αἱ

    θερμότητες ἐνίων, διὸ καὶ τῶν οἴνων τισὶ τὰ τοιαῦτα

    μιγνύντες ὥσπερ κέντρον ἐμποιοῦσιν. ἔστι δὲ ἡ

    μὲν σμύρνη θερμὴ καὶ δηκτικὴ μετὰ στύψεως, ἔχει δὲ

    καὶ πικρίαν. τὸ δὲ κινάμωμον δριμύτητά τινα με-

    τρίαν μετὰ θερμότητος. παραπλησίως δὲ καὶ τὸ

    κόστον. ἡ δὲ κασία τούτων ὑπερβάλλει θερμότητι

    καὶ δριμύτητι καὶ στύψει. θερμὴ δὲ καὶ στυπτικὴ

    καὶ ἡ ἴρις, καθ'' ὑπερβολὴν δὲ καὶ πικρὰ νέα οὖσα καὶ

    τὸν χρῶτα τῶν ἐργαζομένων ἀφελκοῖ. δηκτικὸν δὲ

    καὶ τὸ καρδάμωμον μετὰ θερμότητος. τοῦ δὲ βαλ-

    σάμου ὁ μὲν ὀπὸς καὶ τὸ καρπίον ἀνδρικώτερα πρὸς

    ἀμφότερα ταῦτα τὸ δὲ ξύλον ἀσθενέστερον. παρα-

    πλησίαν δ'' ἔχει τούτῳ δύναμιν καὶ τὸ ἄμωμον.'

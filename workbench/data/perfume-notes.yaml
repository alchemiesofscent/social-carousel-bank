  text_original: "Salben. Die gewöhnlichsten Bezeichnungen für die kosmetischen S. sind μύρον, unguentum.\
    \ Nach Athen. XV 688c stammt μύρον von σμύρνη, das bei den Äolern statt μύρρα gebräuchlich gewesen\
    \ sei, weil die meisten S. mittels Myrrhe bereitet wurden. Zuerst findet sich μύρον bei Archilochos\
    \ (Athen. a. a. O. = frg. 31, 30 ἐσμιρισμένας Bergk). Wahrscheinlich ist μύρον ein semitisches Lehnwort\
    \ (hebr. mör, aram. mûrâ, arab. murr). Das υ von σμύρνη ist wohl nur Zusatz nach Analogie von σμικρός\
    \ u. a. (Kühner-Blass I² 76; Schrader Reallex. 566f.). Das lat. unguentum ist verwandt mit ai. anákti\
    \ (salbt, bestreicht, schmückt), añjanam (Salbe), ahd. ancho (Butter), mhd. anke, nhd. (schwäb. alem.)\
    \ Anke (Walde Lat. Etym. W.² 851). Der gemeine Mann bediente sich in der ältesten Zeit, bevor Öl und\
    \ ausländische Parfüme bekannt waren, der Butter zum Salben, wie Hekataios von den thrakischen Paionern\
    \ erwähnt (Athen. X 447d), ein Gebrauch, den Sidonius Apollinaris XII 7 noch bei den Burgundionen\
    \ vorfand (Schrader 121, 567). Die Römer nannten die eigentlichen Parfümerien zuerst unguenta exotica\
    \ (Plin. XIII 24). Andere Bezeichnungen sind ἄλειμμα (vgl. Corp. gloss. lat. II 211, 2. 225, 5), χρῖμα,\
    \ χρῖσμα (Diosc. I 19, 2 Wellm.), μύρωμα (Arist. Eccl. 1117), doch werden sie, wie auch unguentum,\
    \ für die verschiedenen Öle, Fette und Essenzen gebraucht. Χρῖμα bezeichnet sehr oft die medizinische\
    \ Salbe (vgl. Diosc. I 8, 3. 21. 66, 3; Aristid. XLIX 21ff. Keil). Im Gegensatz zu μύρον steht es\
    \ Xen. anab. IV 4, 13, wo es Fett bedeutet. Sich salben heißt bald ἀλείφεσθαι, μυρίζειν (Lukian. Luc.\
    \ 31), bald χρίεσθαι (ebd. 12). Zum Unterschied von den flüssigen Ölen στακτά (Arist. Plut. 529) oder\
    \ ψακτά werden die S. παχέα, odores genannt (Athen. II 46a, Theophr. de odor. 39, Plin. XIII 7; vgl.\
    \ Sprengel zu Diosc. 367), während μύρον und unguentum beide Begriffe umfassen. Bei Diosc. I 43, 3\
    \ u. ö. steht μύρον für ἔλαιον (Blümner Technol. I² 359).\nAuch die Soldaten Xenophons benutzten nur\
    \ im Notfalle Fette und S. statt des Olivenöls (Xen. anab. IV 4, 13). Gesetzgeber, wie Solon und Lykurg,\
    \ verboten den Verkauf der S. (Athen. XIII 612a. XV 687f), und die Lakedaimonier verwiesen die S.-Bereiter\
    \ des Landes (ebd. 686f. Sen. nat. quaest. IV 13, 8). Noch Sokrates hielt eine strenge Strafrede gegen\
    \ das Parfümieren (Xen. symp. II 3), und Chrysipps Definition von μύρον beweist ebenfalls seine Geringschätzung\
    \ der Wohlgerüche (Athen. 686f). Trotzdem fand man die Parfüme so angenehm, daß Aristipp sich beklagt,\
    \ daß die Verweichlichten sie so in Mißkredit gebracht haben (Sen. de benef. VII 25, 1).\nSo heißt\
    \ es auch in den Acta arval. vom 27. Mai 218: post epulas ... unguenta et coronas acceperunt. Philonides\
    \ περὶ μύρων καὶ στεφάνων gab als Grund für den Gebrauch der S. beim Symposion die Abkühlung des erhitzten\
    \ Kopfes an. Anfangs habe man das Haupt eingefettet, mit der Steigerung des Wohllebens habe man zu\
    \ den S. gegriffen. Man solle nur solche gebrauchen, die den Kopf am wenigsten beschweren (Athen.\
    \ XV 692 a).\nDer Gebrauch der S. wurde von Lebenden auch auf die Toten ausgedehnt (Plin. XIII 3).\
    \ Schon bei Homer wird die Leiche des Patroklos mit Öl gesalbt und seine Wunden mit Tierfett gefüllt\
    \ (Hom. Il. XVIII 350). Achilleus legt auf den Scheiterhaufen große Krüge mit Honig und ἄλειφαρ (Il.\
    \ XXIII 170; vgl. Hehn Kulturpflanzen⁶ 105). Die Salbung der Leichen geschieht Erwähnung bei Arist.\
    \ frg. 445 a D. Schol. Plat. Hipp. min. 368c. Nach Lukian de luctu 11 salbte man die Leiche mit der\
    \ besten S., um ihre Zersetzung zu verhindern oder zu verlangsamen. In Athen stellte man neben den\
    \ ausgestellten Toten S.-Gefäße, λήκυθοι (Arist. Eccl. 538. 1032). Bei den Römern wurden die Leichen\
    \ ebenfalls nach der Waschung gesalbt (Stat. Silv. II 1, 160. Pers. III 104 und Schol. Ovid. ex Pont.\
    \ I 9, 52f. Serv. Aen. VI 219. Apul. Florid. 19. Plin. ep. V 16, 7. Val. Max. VII 7, 4. Ammian. Marc.\
    \ XIX 1, 10). Das besorgte ein weibliches Mitglied der Familie oder die Dienerschaft oder der pollinctor\
    \ (s. d.). Als Parfüme für die Bestattung werden amomum (Ovid. ex Pont. I 9, 52), myrrha und casia\
    \ (Mart. X 97, 2. XI 54, 1) genannt. Trimalchio bestimmte zum voraus die S. für seine Leiche (Petron.\
    \ 77). Selbst der Scheiterhaufen wurde mit S. und Spezereien reichlich überschüttet (Stat. Silv. III\
    \ 3, 131), so daß sogar Diebstähle dabei vorkamen (Mart. XI 54, 1ff.). Bei der Bestattung der Annia\
    \ Priscilla erfüllten Safran, Myrrhe und Balsam die Luft (Stat. Silv. V 1, 210ff.). Auch Iuven. IV\
    \ 109 weist auf die Verschwendung von S. bei Leichenfeiern hin. Um den Toten oder dessen Familie zu\
    \ ehren, sandte man auch Wohlgerüche zur Bestattung (Plut. Cat. min. 11; vgl. Friedländer Sittengesch.⁸\
    \ 131. Blümner Röm. Privataltert. 484f.). Nach Dig. XI 7, 37 sind in den Leichenkosten auch die S.\
    \ inbegriffen. Man legte S.-Fläschchen in die Grabkammern (s. o. Bd. III S. 358, 45). Solche kleine\
    \ Glasgefäße, früher Lacrimatorien genannt, fand man in Gräbern aufgehängt (Marquardt Privatl. d.\
    \ Römer 368, 4. Blümner Röm. Privataltert. 501, 15. Mau Pomp. in Leben und Kunst² 449). Man ließ auch\
    \ Kränze und S.-Fläschchen auf Grabdenkmälern anbringen (Petron. 71). Nicht aus Luxus, sondern aus\
    \ religiösen Gründen brachten die Griechen am Jahrestag der Schlacht von Plataiai unter andern Totenspenden\
    \ auch S. zu den Begräbnisplätzen, mit denen der Archon die Grabstelen bestrich (Plut. Aristid. 21).\n\
    Die S. der Alten entsprechen zum größten Teil nicht denjenigen, die in unseren Apotheken bereitet\
    \ werden. Zwar verstand man es auch, tierische Fette von festerer Konsistenz zu parfümieren und so\
    \ unseren Pomaden ähnliche Präparate herzustellen. Meistens wurden jedoch zu den parfümierten Gemischen\
    \ der Alten Pflanzenöle genommen (Sigismund 73). Eine Vorschrift, tierische Fette zur Aufnahme aromatischer\
    \ Stoffe geeignet zu machen, gibt Dioscorides II 76ff. Wellm. Man reinigte Rinderfett, Hirschfett\
    \ und das Mark der Tiere von allen Häuten, schmolz es in einem neuen Gefäß mit ein wenig Salz. Dann\
    \ wusch man dieses Gemisch durch Reiben mit den Händen in reinem Wasser aus, unter öfterer Erneuerung\
    \ des Wassers. Darauf kochte man es mit gleichen Teilen wohlriechenden Weines und ließ es eine Nacht\
    \ zusammenstehen. Am nächsten Tage folgte erneutes Kochen mit wohlriechendem Wein, was man so lange\
    \ wiederholte, bis das Fett allen unangenehmen Geruch verloren hatte und man es mit wohlriechenden\
    \ Stoffen vereinigen konnte. Ähnliche Vorschriften, das Fett von Vögeln, besonders Gänsen, durch Zusatz\
    \ von Aromaten wohlriechend zu machen, gibt Diosc. a. a. O. II 76, 13ff. Wellm. Aus Gänsefett und\
    \ Aromaten wurde das Commagenum, das zugleich Parfüm und Heilmittel war, hergestellt (Plin. XXIX 55.\
    \ XXXVII 204). Sonst unterschied man bei der Herstellung der S. das aus den Pflanzen gewonnene ätherische\
    \ Öl, sucus, und das Fett, corpus, das meistens aus Früchten ausgepreßt war, wie Oliven-, Nuß-, Mandelöl\
    \ (Plin. XIII 7). Dieses Fett bildete den Körper der S. und hieß bei den Griechen στῦμμα, στυπτικόν\
    \ und das Verfahren στῦψις (Diosc. I 6. 19, 5. 20, 1. 2 u. 3. Theophr. de od. 21. 32. 60 u. ö.). Die\
    \ flüchtigen Pflanzenöle, die mit jenen Stoffen verbunden wurden und den S. den Wohlgeruch verliehen,\
    \ hießen ἡδύσματα (Plut. Ant. 24. Hippocr. II 866. Plin. XIII 7). Zu den Hauptbestandteilen der S.,\
    \ corpus und sucus, kamen oft noch Färbemittel hinzu, wie Zinnober, Safran, Ochsenzunge (s. o. Bd.\
    \ II S. 2111), flos salis (Plin. XIII 1, 9. 10. XXXI 91). Nach Theophr. de od. 31 wurden die Amarakus-,\
    \ Rosen- und Megalium-S. gefärbt. Von den kostbaren blieben ungefärbt die ägyptischen, die Kypros-\
    \ und Quitten-S. Die beiden ersten sollten weiß sein, die letztere die Farbe der Quitten haben. Außerdem\
    \ färbte man die wohlfeilen nicht, weil das Zusetzen von Farbe sich nicht gelohnt hätte. Um das Öl\
    \ zu konservieren, fügte man Salz hinzu (Diosc. I 43, 3. Plin. XIII 7). Oliven- und Mandelöl wurden\
    \ nämlich leicht ranzig und verdarben die Wohlgerüche. Hingegen hat das bei der S.-Bereitung geschätzte\
    \ Benöl (s. o. Bd. V S. 2070) die wertvolle Eigenschaft, nicht ranzig zu werden. Gummi und Harz wurden\
    \ bei der S.-Bereitung verwendet, um den Geruch, der sich schnell verflüchtigte, festzuhalten (Plin.\
    \ XIII 7). Denn die Alten scheinen sich noch nicht darauf verstanden zu haben, reine ätherische Öle\
    \ aus den betreffenden Pflanzenteilen auszuziehen, da sie unser Destillationsverfahren nicht kannten;\
    \ sie standen aber dieser Erkenntnis sehr nahe (Blümner Technol. I² 360, 2). Nach Diosc. I 58, 3 geschah\
    \ die Zumischung von Harz oder Gummi der Farbe und Verdickung wegen, und zwar wurden gebrannte Harze\
    \ dazu benützt (I 71, 6).\nEine Haupttätigkeit bei der S.-Bereitung war das Kochen, das bei der Herstellung\
    \ des corpus, bei der στῦψις, dem ὑποστύφειν, immer stattfand (Theophr. de od. 22), während die Öle\
    \ auf kaltem Wege hergestellt wurden (ψυχροβαφῆ) oder auf heißem (θερμοβαφῆ). Dieses Kochen mußte\
    \ im Wasserbade stattfinden, d. h. man setzte die Stoffe nicht unmittelbar dem Feuer aus, da der Verlust\
    \ dabei zu groß gewesen wäre und weil alles einen brenzlichen Geruch erhalten hätte, sondern man setzte\
    \ diese Gefäße in andere, die Wasser enthielten. Vorschriften über S.-Bereitung geben Theophrast de\
    \ od. 23ff., Plin. XIII 8ff., Diosc. I 43ff. Aus der Haupttätigkeit bei der S.-Bereitung, dem Kochen,\
    \ μύρον ἕψειν (Arist. Lysistr. 946 und sehr oft bei Diosc. u. a.), μυρεψεῖν (Aesop. fab. 122), ergaben\
    \ sich bei den Griechen als Benennungen dieses Gewerbes: μυρεψία (Arist. de insomn. II 13 p. 460a,\
    \ 27), μυρεψική (Theodos. gramm. 53, 28 Göttl. Athen. XIII 611f. Plut. quaest. conviv. IV 1, 2 p.\
    \ 661 C μυρεψικὰ φάρμακα), μυρεψός (Poll. VII 177. Plut. Pericl. 1. Theophr. hist. pl. IV 2, 6; caus.\
    \ pl. VI 11, 19, 3; de odor. 8 u. ö. Vgl. Cramer Anecd. Oxon. IV 248, 17), μυροποιός (Athen. XIII\
    \ 608 a. Poll. VII 177).\nHäufiger sind die den Handel mit S. ausdrückenden Bezeichnungen, wie μυροπωλεῖν\
    \ (Poll. VII 177), μυροπώλης (Xen. conviv. II 4. Athen. XII 552 f. XIII 612e. Poll. VII 177. Etym.\
    \ M. 595, 32), μυρόπωλις (Arist. Eccl. 841. Anth. Pal. V 180, 10), myropola (Plaut. Cas. 226; Trin.\
    \ 408. Naev. b. Fulgent. 565, 17), μυροπωλεῖον (Ps.-Demosth. XXV 52 p. 786. Lys. XXIV 20), μυροπώλιον\
    \ (Plut. Timol. 14. Poll. VII 177), myropolium (Plaut. Amph. 1011; Epid. 199).\nDas Gewerbe der S.-Fabrikanten\
    \ und -Händler war bei den Griechen und Römern verachtet (Theod. gramm. p. 53, 28 Göttl. μικροτεχνία\
    \ ἡ μυρεψική). Lysias wirft dem Sokratiker Aischines die μυρεψία als eines Philosophen unwürdig vor\
    \ (Athen. XIII 612a). Solon verbot den Männern das μυροπωλεῖν (Athen. XV 687a), und die Spartaner\
    \ vertrieben die S.-Händler als Ölverderber (Sen. nat. quaest. IV 13, 8). Man freute sich an den Wohlgerüchen,\
    \ verachtete aber das Gewerbe (Plut. Pericl. 1). Cic. de off. I 150 rechnet es unter die sordidae\
    \ artes und stellt die unguentarii den cetarii, lanii, coqui gleich. Ähnlich drückt sich Sen. ep.\
    \ LXXXVIII 18 aus (vgl. Plaut. Trin. 408. Horat. sat. II 3, 228). Die S.-Läden waren ähnlich wie die\
    \ Barbierstuben beliebte Sammelplätze für die attischen Müßiggänger (Athen. XIII 612a. Lys. XXIV 20.\
    \ Plaut. Amph. 1011; Epid. 199). Der jüngere Dionysos trieb sich nach seiner Vertreibung in den Garküchen\
    \ Korinths herum oder saß in der S.-Bude (Plut. Timol. 14). Bei Petron. 74 ist der unguentarius herae\
    \ proximae wohl ein Freigelassener oder Sklave, der von seiner Herrin als institor einer S.-Bude eingesetzt\
    \ war. Es scheint danach, daß die unguentarii sich oft mit Vermittlung von Heiraten abgaben, da in\
    \ ihren Läden vorzugsweise Frauen verkehrten (vgl. Friedländer z. St. S. 348). Die S.-Händlerinnen\
    \ standen nicht im besten Rufe (Arist. Eccl. 841. Anth. Pal. V 180, 10). Sie werden auch auf Inschriften\
    \ erwähnt (CIL VI 10006. X 1965).\nAuf die Aufbewahrungsart scheint man viel Gewicht gelegt zu haben.\
    \ Die S.-Händler suchten dicht beschattete Räume zu Wohnungen aus, damit nicht die Sonnenhitze die\
    \ Wohlgerüche zerstöre (Theophr. de od. 40). Aus demselben Grund wählte man zu S.-Gefäßen solche aus\
    \ Blei (ebd. 41. Mart. VI 55, 3; s. o. Bd. III S. 562, 45) und Alabaster (Plin. XIII 19). Besonders\
    \ wurde der Alabastrites (s. o. Bd. I S. 1271f.; Blümner Röm. Privataltert. 154; Sigismund 80ff.),\
    \ der echte orientalische Alabaster und eine Varietät davon, Onyxmarmor, von den Alten Onyx (s. d.)\
    \ genannt, verwendet, der sich nach Plin. XXXVI 60 besonders gut für S. eignete. Daher erhielten die\
    \ S.-Gefäße den Namen alabastrum (s. o. Bd. I S. 1272, 57ff.) und onyx — der letztere ist bei den\
    \ Dichtern beliebt (Catull. LXVIII 83; Horat. carm. IV 12, 17; Prop. III 5, 14 [II 13, 30]; IV 9 [III\
    \ 10], 22; Mart. VII 94; XI 50, 6) — obwohl sie nicht immer aus diesem Material bestanden. Man dachte\
    \ eben mehr an die Form und an die Bestimmung als an den Stoff. Es gab auch solche aus Glas und Ton.\
    \ Gläserne S.-Fläschchen mit weißen Streifenornamenten auf bernsteinfarbigem Grunde fanden sich in\
    \ etruskischen Gräbern. Sie scheinen nicht geblasen, sondern in einer Form gegossen zu sein (Marquardt\
    \ Privatl. d. Römer 748, 5; 786, 2; s. o. Bd. VII S. 1386, 11; 1384, 48; 1388, 9). Auch in Pompeii\
    \ wurden S.- und Ölgefäße gefunden (Overbeck-Mau 451 Fig. 250,5. 452f. Fig. 251. 252 h) aus Glas,\
    \ Ton und Elfenbein. Goldene alabastra erwähnen Theokr. XV 114; Plut. Alex. 20. Bei Athen. IV 86c\
    \ werden Alabastergefäße neben goldenen S.-Gefäßen genannt. Für köstliche S. scheint man überhaupt\
    \ kostbare, kunstreich geformte Gefäße bestimmt zu haben. Beim Festzug des Antiochos wurden Wohlgerüche\
    \ aus goldenen Krügen, καλπίδες, gesprengt (Athen. V 195b; vgl. Polyb. XXXI 3, 17), und nachher salbten\
    \ sich die Teilnehmer an den Wettkämpfen aus goldenen Gefäßen, ὀλκίαι (a. a. O. 195d). Goldene und\
    \ silberne λήκυθοι schenkt Karanos seinen Gästen (Athen. IV 129b). Auch das Gefäß, aus dem Jesus gesalbt\
    \ wurde, heißt alabastron (Ev. Matth. XXVI 7; Luc. VII 37). Nach Ev. Marc. XIV 3 wurde es zuerst zerbrochen\
    \ und dann die S. auf das Haupt gegossen. Als S.-Gefäß wird bisweilen auch die ampulla (Mart. III\
    \ 82, 26; XIV 110), griech. λήκυθος (s. d.), die sonst Ölgefäße waren, verwendet (Arist. Plut. 810;\
    \ Eccles. 1101; Poll. VI 105; X 119; Athen. IV 129a). Bei Lucian. Luc. 12 stehen die S.-Büchsen in\
    \ einem Kästchen. Sehr kostbar war der S.-Schrein des Darius, der mit Edelsteinen, Perlen und Gold\
    \ geziert war (Plin. VII 108; XIII 3). Abbildungen von S.-Flaschen: Stackelberg Gräber der Hellenen\
    \ Taf. 38 = Múzik-Perschinka Kunst und Leben I. A. 136, 4; Gerhard Ant. Bildw. 27, 2 = Roscher Myth.\
    \ Lex. II 2455; Overbeck-Mau a. a. O.; Daremberg-Saglio I² 177; Sigismund Aromata 85 Fig. c—e. Fig.\
    \ e; Guhl-Koner⁶ 345f. Fig. 425–427.\nΒακκάρινον s. o. Bd. II S. 2686.\nΒρένθειον Athen. XV 690 d;\
    \ Etym. M. s. v. (s. o. Bd. III S. 2808, 37).\nCrocinum, Safran-S. (s. o. Bd. VII S. 796, 26ff. 818,\
    \ 58. Plin. XIII 5, 10. Paul. Aeg. VII 20 s. v. Diosc. I 54, 42. 63). Nur dem Namen nach waren das\
    \ ὀνύχινον, βουτύρινον, στυράκινον verschieden, die sonst ihrer Bereitung und Wirkung nach der Safran-S.\
    \ gleichkamen (Diosc. I 54, 2). Auch das crocomagma wurde medizinisch verwendet (Diosc. I 27. Plin.\
    \ XX 139).\nCyprinum (Diosc. I 55, 49. Plin. XIII 5, 12), aus den Blüten des κύπρος, Lawsonia inermis\
    \ L., bereitet (s. o. Bd. VII S. 805, 14ff.).\nΔάφνινον, aus den Früchten des Lorbeers bereitet (Theophr.\
    \ od. 28), war billig und erregte Kopfweh (ebd. 42), bei Diosc. I 40. Plin. XIII 86 als Öl erwähnt.\n\
    Ἐλάτινον (Diosc. I 44), aus der ἐλάτη, der Palmfrucht (vgl. ebd. 109, 5). Die jungen Triebe der Palmen\
    \ wurden von den S.-Bereitern zur στύψις der S. verwendet (ebd. 109, 4). Plin. XII 134 versteht unter\
    \ elate fälschlich eine bestimmte Palmengattung, die Stoff zur S. liefert (Blümner Maximaltarif VI\
    \ 40).\nἙρπύλλινον, aus den Blüten des Quendels (Theophr. od. 27 = Athen. XV 689d. XII 553d).\nἩδύχρουν,\
    \ auf Kos bereitet, an Wirkung und Zubereitung der Majoran-S. gleich, aber noch wohlriechender als\
    \ diese (Diosc. I 58, 3. Gal. XIV 52. 306. 262). Bei Cic. Tusc. III 46 ist es ein Räucherwerk.\nIrinum,\
    \ aus der Wurzel der iris (s. o. Bd. VII S. 825, 46ff.), auch eine gute Arznei, sehr dauerhaft, deren\
    \ Wohlgeruch sich nicht rasch verflüchtigte (Theophr. od. 24. 28. 36. 38). Das beste wurde nach Diosc.\
    \ I 56, 3 in Perge und Elis gemacht, nach Plin. XXI 42 ehedem auf Leukas und in Elis, zu seiner Zeit\
    \ aber in Pamphylien und Kilikien; lange Zeit war das korinthische sehr beliebt (Plin. XIII 5 = Athen.\
    \ XV 688e). Nach Theophr. h. pl. IX 7, 3 war die iris, und zwar die illyrische, die einzige zu Aromaten\
    \ brauchbare Pflanze, Plin. XIII 18 erwähnt noch daneben die gallische Narde (vgl. Theophr. h. pl.\
    \ IX 7, 2. Athen. V 195d. XII 553a. Plin. XIII 14. Aet. I s.v. ἔλαιον ἴρινον = Nic. M. XVI 30. Paul.\
    \ Aeg. VII 20 s.v.).\nΛευκόϊον (Theophr. od. 27 = Athen. XV 689), aus den Blüten des λευκόινον (s.\
    \ o. Bd. VII S. 788f.), auch Essenz zum Trinken (Athen. XV 689e).\nΛιβανώτινον herzustellen war nur\
    \ einem einzigen Fabrikanten in Pergamon gelungen (Athen. XV 689a).\nDas Megalium, μεγαλείον, μεγάλλειον,\
    \ wurde nach seinem Erfinder Μέγαλλος, einem Sizilier oder Athener, genannt (Athen. XV 690f.) und\
    \ erfreute sich hohen Ansehens, daher auch die Schriften des Erfinders vielfach erwähnt. Das berühmteste\
    \ kam von Ephesus (ebd. 689a). Plin. XIII 13 leitet den Namen von dem großen Ruf ab, den es genoß.\
    \ Nach Diosc. I 58, 3 zeichnete es sich durch einen starken Harzzusatz aus, seine Herstellung erforderte\
    \ 10 Tage und Nächte und kostbare Aromate (Theophr. od. 30. 35. 42. 55).\nΜυρσίνεον, Öl aus den Blättern\
    \ der Myrte (Diosc. I 39. Plin. XV 27. XXIII 87), das mit andern Aromaten zu einer S. wurde (Diosc.\
    \ a. a. O. Theophr. 27. 28).\nOenanthinum, von den Blättern der οἰνάνθη (s. o. Bd. VII S. 798, 1.\
    \ Theophr. od. 27. Diosc. I 46. Plin. XII 132). Als die beste Art zur Salbenbereitung galt die kyprische\
    \ (Athen. XV 689d. Plin. XII 133), die in Griechenland zu wenig aromatisch war. Als ausgezeichnet\
    \ galt das oenanthinum von Adramyttion wegen der Vorliebe, die des Eumenes Gattin Stratonike dafür\
    \ hatte (Athen. XV 689a), und das kyprische (Plin. XIII 5).\nΦοινίκινον wird von Antiphanes (Athen.\
    \ XII 553d) unter andern S. erwähnt.\nΠλαγγόνιον, eine in Elis gebräuchliche Salbe, benannt nach dem\
    \ Erfinder Πλάγγων (Athen. XV 690e).\nEine ägyptische S. war Ράγδα (Athen. XV 690e) oder Σάγδα (ebd.\
    \ 691c).\nRosensalbe wurde aus dem Saft der Rosenblätter und verschiedenen Aromaten gewonnen (Diosc.\
    \ I 43, 3. Plin. XIII 9. Theophr. od. 25). Sie wurde mit Ochsenzunge gefärbt (Theophr. 33). Die Eigenschaften\
    \ des ῥόδινον erwähnt Theophr. 35. 42. 45. 48. 51. 55. Was Diosc. I 43, 1f. als Rosensalbe bezeichnet,\
    \ bestand nur aus Olivenöl, das mit σχοῖνος zusammengekocht worden war, und dem Safte der Rosenblätter\
    \ (s. o. Bd. VII S. 774. 817. Sigismund Aromata 77). Berühmt war die Rosensalbe von Phaselis, später\
    \ die von Neapel, Capua und Praeneste (Plin. XIII 3).\nSisymbrinum (s. o. Bd. VII S. 790, 67ff.),\
    \ aus den Blüten des σισύμβριον (Theophr. 27. Athen. XV 689d. XII 553e).\nSusinum, aus einer Lilienart\
    \ (s. o. Bd. VII S. 792, 51ff.), daher auch κρίνινον (Diosc. III 102. Galen. XIX 119) und λείριον\
    \ (Diosc. I 52) genannt. Σοῦσον soll das persische Wort für κρίνον sein (Athen. XII 513f.). Nach Plin.\
    \ XIII 11 war es die dünnste Salbe (vgl. XXI 22. XXIII 95), deren Aroma bald verflog (Theophr. od.\
    \ 22. 27. Athen. XV 689d).\nDas von Diosc. I 54, 2 genannte Στυράκινον soll gleich dem ὀνύχινον und\
    \ βουτύρινον der Safransalbe ähnlich gewesen sein.\nDas Verfahren bei der Bereitung des ὠκίμινον,\
    \ das seinen Namen von der Pflanze ὤκιμον, Basilienkraut, hat, war ähnlich wie beim rhodinum (Diosc.\
    \ I 49).\nWeit verbreitet war die Salbenfabrikation in Kleinasien, so in Kilikien (Theophr. od. 27),\
    \ besonders in Soloi (Athen. XV 688d) und Tarsus (Plin. XIII 6), in Perge (Diosc. I 56, 3), Ephesus\
    \ (Athen. XV 689a), Pergamum (ebd.), Adramyttion (XV 688e. 689a), Kyzikos (XV 688e. Plin. XIII 5.\
    \ 14). Von den Inseln wurden genannt Rhodus (Arist. Lys. 944 und Schol. Hesych. s. ῥόδιον. Suid. s.\
    \ Ῥόδια μύρα. Plin. XIII 5. Athen. XV 688e), Cypern (Theophr. od. 27. Plin. XIII 5. 10. Athen. XV\
    \ 688f.), Delos (Plin. XIII 4), Kos (Plin. XIII 5. Athen. XV 688e. Diosc. I 58, 3), Lesbos vertreten\
    \ durch Mytilene (Plin. XIII 10).\nÜber die Salben schrieben der Herophileer Apollonios (s. o. Bd.\
    \ II S. 149 Nr. 103) in seinem Buche περὶ μύρων (Athen. XV 688e ff.), Hikesios (s. o. Bd. VIII S.\
    \ 1393 Nr. 5) in seinem Werke περὶ ὕλης (Athen. XV 689c), der Arzt Philonides in περὶ μύρων καὶ στεφάνων\
    \ (Athen. XV 675 a–676e. 691f–692b), Apollodoros in einer gleichnamigen Schrift (Athen. 675e), der\
    \ kaiserliche Leibarzt Kriton, der im 2. Buche seiner Kosmetik 25 verschiedene Salben und Essenzen\
    \ aufzählt (Fabricius Bibl. Graec. XII 690). Hauptstellen über Salben finden sich bei Theophr. de\
    \ od., Dioscorides de materia medica I 4–68 (Wellmann, vgl. die Ausg. von Sprengel mit Kommentar),\
    \ Athen. XII 553. XV 685–692, Plin. XII 102ff. XIII 4–5. Phot. bibl. 279, p. 532 Bekker. Poll. VI\
    \ 104ff. VII 177. X 115. Isid. IV 12.\nUnguents. The most common designations for cosmetic unguents\
    \ are μύρον (myron) and unguentum. According to Athenaeus (XV 688c), μύρον comes from σμύρνη (smyrna,\
    \ myrrh), a term that was customary among the Aeolians instead of μύρρα, because most unguents were\
    \ prepared using myrrh. The word μύρον is first found in Archilochos (Athen. loc. cit. = frg. 31,\
    \ 30 ἐσμιρισμένας Bergk). Μύρον is likely a Semitic loanword (Hebr. mör, Aram. mûrâ, Arab. murr).\
    \ The upsilon (υ) in σμύρνη is probably an addition by analogy with σμικρός (smikros, small) and others\
    \ (Kühner-Blass I² 76; Schrader Reallex. 566f.). The Latin unguentum is related to Old Indic anákti\
    \ (anoints, spreads on, adorns), añjanam (ointment), Old High German ancho (butter), Middle High German\
    \ anke, and New High German (Swabian, Alemannic) Anke (Walde Lat. Etym. W.² 851). In the earliest\
    \ times, before oil and foreign perfumes were known, the common man used butter for anointing, as\
    \ Hecataeus mentions regarding the Thracian Paeonians (Athen. X 447d), a practice that Sidonius Apollinaris\
    \ (XII 7) still found among the Burgundians (Schrader 121, 567). The Romans initially called the actual\
    \ perfumeries unguenta exotica (foreign unguents) (Plin. XIII 24). Other designations are ἄλειμμα\
    \ (aleimma; cf. Corp. gloss. lat. II 211, 2. 225, 5), χρῖμα (chrima), χρῖσμα (chrisma) (Diosc. I 19,\
    \ 2 Wellm.), and μύρωμα (myroma) (Arist. Eccl. 1117), though these, like unguentum, are used for various\
    \ oils, fats, and essences. Χρῖμα very often refers to medicinal ointment (cf. Diosc. I 8, 3. 21.\
    \ 66, 3; Aristid. XLIX 21ff. Keil). In contrast to μύρον, it appears in Xen. anab. IV 4, 13, where\
    \ it means fat. To anoint oneself is sometimes ἀλείφεσθαι (aleiphesthai), μυρίζειν (myrizein) (Lucian.\
    \ Luc. 31), or χρίεσθαι (chriesthai) (ibid. 12). In contrast to the liquid oils, στακτά (stakta) (Arist.\
    \ Plut. 529) or ψακτά (psakta), the unguents are called παχέα (pachea, thick) or odores (fragrances)\
    \ (Athen. II 46a, Theophr. de odor. 39, Plin. XIII 7; cf. Sprengel on Diosc. 367), while μύρον and\
    \ unguentum encompass both concepts. In Diosc. I 43, 3 and elsewhere, μύρον stands for ἔλαιον (elaion,\
    \ oil) (Blümner Technol. I² 359).\nXenophon's soldiers also used fats and unguents instead of olive\
    \ oil only in emergencies (Xen. anab. IV 4, 13). Lawgivers like Solon and Lycurgus forbade the sale\
    \ of unguents (Athen. XIII 612a. XV 687f), and the Lacedaemonians expelled the unguent-makers from\
    \ the country (ibid. 686f. Sen. nat. quaest. IV 13, 8). Socrates still delivered a stern tirade against\
    \ perfuming (Xen. symp. II 3), and Chrysippus's definition of μύρον also shows his disdain for fragrances\
    \ (Athen. 686f). Nevertheless, perfumes were found so pleasant that Aristippus complained that the\
    \ effeminate had brought them into such disrepute (Sen. de benef. VII 25, 1).\nIt is also stated in\
    \ the Acta Arvalia of May 27, 218: post epulas ... unguenta et coronas acceperunt (after the feast\
    \ ... they received unguents and crowns). Philonides, in his work περὶ μύρων καὶ στεφάνων (On Unguents\
    \ and Garlands), gave the cooling of the heated head as the reason for the use of unguents at the\
    \ symposium. Initially, he said, the head was greased; with the increase of luxury, people resorted\
    \ to unguents. One should only use those that least weigh down the head (Athen. XV 692a).\nThe use\
    \ of unguents was extended from the living to the dead (Plin. XIII 3). Already in Homer, the body\
    \ of Patroclus is anointed with oil and his wounds are filled with animal fat (Hom. Il. XVIII 350).\
    \ Achilles places large jars of honey and ἄλειφαρ (aleiphar, fat/oil) on the pyre (Il. XXIII 170;\
    \ cf. Hehn Kulturpflanzen⁶ 105). The anointing of corpses is mentioned by Arist. frg. 445 a D. Schol.\
    \ Plat. Hipp. min. 368c. According to Lucian (de luctu 11), the corpse was anointed with the best\
    \ unguent to prevent or slow its decomposition. In Athens, unguent vessels, λήκυθοι (lekythoi), were\
    \ placed next to the displayed dead (Arist. Eccl. 538. 1032). Among the Romans, the corpses were also\
    \ anointed after being washed (Stat. Silv. II 1, 160. Pers. III 104 and Schol. Ovid. ex Pont. I 9,\
    \ 52f. Serv. Aen. VI 219. Apul. Florid. 19. Plin. ep. V 16, 7. Val. Max. VII 7, 4. Ammian. Marc. XIX\
    \ 1, 10). This was done by a female member of the family, the servants, or the pollinctor (s.v.).\
    \ As perfumes for burial, amomum (Ovid. ex Pont. I 9, 52), myrrha, and casia (Mart. X 97, 2. XI 54,\
    \ 1) are mentioned. Trimalchio predetermined the unguents for his own corpse (Petron. 77). Even the\
    \ pyre was lavishly showered with unguents and spices (Stat. Silv. III 3, 131), so that even thefts\
    \ occurred (Mart. XI 54, 1ff.). At the burial of Annia Priscilla, saffron, myrrh, and balsam filled\
    \ the air (Stat. Silv. V 1, 210ff.). Juvenal (IV 109) also points to the waste of unguents at funeral\
    \ ceremonies. To honor the deceased or their family, fragrances were also sent for the burial (Plut.\
    \ Cat. min. 11; cf. Friedländer Sittengesch.⁸ 131. Blümner Röm. Privataltert. 484f.). According to\
    \ Dig. XI 7, 37, unguents are also included in the funeral costs. Unguent flasks were placed in the\
    \ burial chambers (see above Vol. III, col. 358, 45). Such small glass vessels, formerly called lacrimatoria\
    \ (tear-catchers), were found hanging in graves (Marquardt Privatl. d. Römer 368, 4. Blümner Röm.\
    \ Privataltert. 501, 15. Mau Pomp. in Leben und Kunst² 449). Garlands and unguent flasks were also\
    \ attached to grave monuments (Petron. 71). Not out of luxury, but for religious reasons, the Greeks,\
    \ on the anniversary of the Battle of Plataea, brought unguents among other offerings for the dead\
    \ to the burial sites, with which the archon anointed the grave steles (Plut. Aristid. 21).\nThe unguents\
    \ of the ancients do not for the most part correspond to those prepared in our pharmacies. While they\
    \ did know how to perfume animal fats of a firmer consistency and thus produce preparations similar\
    \ to our pomades, for the most part, plant oils were used for the perfumed mixtures of the ancients\
    \ (Sigismund 73). A recipe for making animal fats suitable for absorbing aromatic substances is given\
    \ by Dioscorides (II 76ff. Wellm.). Beef fat, deer fat, and the marrow of animals were cleaned of\
    \ all membranes, melted in a new vessel with a little salt. This mixture was then washed by rubbing\
    \ it with the hands in pure water, with frequent renewal of the water. It was then boiled with equal\
    \ parts of fragrant wine and left to stand together for a night. The next day, renewed boiling with\
    \ fragrant wine followed, which was repeated until the fat had lost all unpleasant odor and could\
    \ be combined with fragrant substances. Similar instructions for making the fat of birds, especially\
    \ geese, fragrant by adding aromatics are given by Diosc. (loc. cit. II 76, 13ff. Wellm.). From goose\
    \ fat and aromatics, commagenum was made, which was both a perfume and a remedy (Plin. XXIX 55. XXXVII\
    \ 204). Otherwise, in the production of unguents, a distinction was made between the essential oil\
    \ extracted from plants, the sucus, and the fat, the corpus, which was mostly pressed from fruits\
    \ like olives, nuts, and almonds (Plin. XIII 7). This fat formed the body of the unguent and was called\
    \ στῦμμα (stymma), στυπτικόν (styptikon) by the Greeks, and the process στῦψις (stypsis) (Diosc. I\
    \ 6. 19, 5. 20, 1. 2 u. 3. Theophr. de od. 21. 32. 60 et al.). The volatile plant oils, which were\
    \ combined with these substances and gave the unguents their fragrance, were called ἡδύσματα (hedysmata)\
    \ (Plut. Ant. 24. Hippocr. II 866. Plin. XIII 7). To the main components of the unguents, corpus and\
    \ sucus, coloring agents were often added, such as cinnabar, saffron, alkanet (see above Vol. II,\
    \ col. 2111), and flos salis (flower of salt) (Plin. XIII 1, 9. 10. XXXI 91). According to Theophr.\
    \ (de od. 31), the amarakus, rose, and megalium unguents were dyed. The expensive ones, like the Egyptian,\
    \ the Cyprus, and the quince unguents, remained undyed. The first two were supposed to be white, the\
    \ latter the color of quinces. In addition, the cheap ones were not dyed because the addition of color\
    \ would not have been worthwhile. To preserve the oil, salt was added (Diosc. I 43, 3. Plin. XIII\
    \ 7). Olive and almond oil became rancid easily and spoiled the fragrances. In contrast, the ben oil\
    \ valued in unguent-making (see above Vol. V, col. 2070) has the valuable property of not becoming\
    \ rancid. Gum and resin were used in unguent-making to fix the fragrance, which evaporated quickly\
    \ (Plin. XIII 7). For the ancients do not seem to have yet understood how to extract pure essential\
    \ oils from the respective plant parts, as they did not know our distillation process; but they were\
    \ very close to this knowledge (Blümner Technol. I² 360, 2). According to Diosc. I 58, 3, the addition\
    \ of resin or gum was for the sake of color and thickening, and for this,\t.\nA main activity in unguent-making\
    \ was cooking, which always took place in the production of the corpus, the στῦψις, the ὑποστύφειν\
    \ (Theophr. de od. 22), while the oils were prepared by a cold process (ψυχροβαφῆ) or a hot one (θερμοβαφῆ).\
    \ This cooking had to take place in a water bath, i.e., the substances were not exposed directly to\
    \ the fire, as the loss would have been too great and everything would have acquired a burnt smell;\
    \ instead, these vessels were placed in others that contained water. Instructions on unguent-making\
    \ are given by Theophrast (de od. 23ff.), Pliny (XIII 8ff.), and Dioscorides (I 43ff.). From the main\
    \ activity in unguent-making, the cooking, μύρον ἕψειν (myron hepsein, to cook unguent) (Arist. Lysistr.\
    \ 946 and very often in Diosc. et al.), μυρεψεῖν (myrepsein) (Aesop. fab. 122), the Greeks derived\
    \ the following names for this trade: μυρεψία (myrepsia) (Arist. de insomn. II 13 p. 460a, 27), μυρεψική\
    \ (myrepsikē) (Theodos. gramm. 53, 28 Göttl. Athen. XIII 611f. Plut. quaest. conviv. IV 1, 2 p. 661\
    \ C μυρεψικὰ φάρμακα), μυρεψός (myrepsos) (Poll. VII 177. Plut. Pericl. 1. Theophr. hist. pl. IV 2,\
    \ 6; caus. pl. VI 11, 19, 3; de odor. 8 et al. cf. Cramer Anecd. Oxon. IV 248, 17), μυροποιός (myropoios)\
    \ (Athen. XIII 608 a. Poll. VII 177).\nMore common are the designations expressing the trade in unguents,\
    \ such as μυροπωλεῖν (myropōlein) (Poll. VII 177), μυροπώλης (myropōlēs) (Xen. conviv. II 4. Athen.\
    \ XII 552f. XIII 612e. Poll. VII 177. Etym. M. 595, 32), μυρόπωλις (myropōlis) (Arist. Eccl. 841.\
    \ Anth. Pal. V 180, 10), myropola (Plaut. Cas. 226; Trin. 408. Naev. b. Fulgent. 565, 17), μυροπωλεῖον\
    \ (myropōleion) (Ps.-Demosth. XXV 52 p. 786. Lys. XXIV 20), μυροπώλιον (myropōlion) (Plut. Timol.\
    \ 14. Poll. VII 177), myropolium (Plaut. Amph. 1011; Epid. 199).\nThe trade of unguent-makers and\
    \ -dealers was despised among the Greeks and Romans (Theod. gramm. p. 53, 28 Göttl. μικροτεχνία ἡ\
    \ μυρεψική [the art of unguent-making is a petty craft]). Lysias accuses the Socratic Aeschines of\
    \ μυρεψία as being unworthy of a philosopher (Athen. XIII 612a). Solon forbade men from dealing in\
    \ unguents (μυροπωλεῖν) (Athen. XV 687a), and the Spartans expelled unguent-dealers as spoilers of\
    \ oil (Sen. nat. quaest. IV 13, 8). People enjoyed the fragrances but despised the trade (Plut. Pericl.\
    \ 1). Cicero (de off. I 150) counts it among the \"sordid arts\" (sordidae artes) and equates the\
    \ unguentarii with fishmongers, butchers, and cooks. Seneca expresses himself similarly (ep. LXXXVIII\
    \ 18) (cf. Plaut. Trin. 408. Horat. sat. II 3, 228). The unguent shops were, like barbershops, popular\
    \ gathering places for the idle of Athens (Athen. XIII 612a. Lys. XXIV 20. Plaut. Amph. 1011; Epid.\
    \ 199). The younger Dionysius, after his expulsion, loitered in the cookshops of Corinth or sat in\
    \ the unguent booth (Plut. Timol. 14). In Petronius (74), the unguentarius herae proximae is probably\
    \ a freedman or slave, appointed by his mistress as the manager (institor) of an unguent booth. It\
    \ seems that the unguentarii often engaged in matchmaking, as women were the primary clientele in\
    \ their shops (cf. Friedländer loc. cit. p. 348). The female unguent-dealers did not have the best\
    \ reputation (Arist. Eccl. 841. Anth. Pal. V 180, 10). They are also mentioned in inscriptions (CIL\
    \ VI 10006. X 1965).\nGreat importance seems to have been placed on the method of storage. The unguent-dealers\
    \ sought out densely shaded rooms for their dwellings so that the sun's heat would not destroy the\
    \ fragrances (Theophr. de od. 40). For the same reason, vessels made of lead (ibid. 41. Mart. VI 55,\
    \ 3; see above Vol. III, col. 562, 45) and alabaster (Plin. XIII 19) were chosen for unguents. Especially\
    \ the alabastrites (see above Vol. I, col. 1271f.; Blümner Röm. Privataltert. 154; Sigismund 80ff.),\
    \ the true oriental alabaster and a variety thereof, onyx marble, called Onyx by the ancients (s.v.),\
    \ was used, which according to Pliny (XXXVI 60) was particularly suitable for unguents. Therefore,\
    \ the unguent vessels were given the name alabastrum (see above Vol. I, col. 1272, 57ff.) and onyx—the\
    \ latter is popular with the poets (Catull. LXVIII 83; Horat. carm. IV 12, 17; Prop. III 5, 14 [II\
    \ 13, 30]; IV 9 [III 10], 22; Mart. VII 94; XI 50, 6)—although they were not always made of this material.\
    \ The form and purpose were considered more important than the material. There were also those made\
    \ of glass and clay. Glass unguent flasks with white stripe-ornaments on an amber-colored ground have\
    \ been found in Etruscan graves. They do not seem to be blown, but rather cast in a mold (Marquardt\
    \ Privatl. d. Römer 748, 5; 786, 2; see above Vol. VII, col. 1386, 11; 1384, 48; 1388, 9). In Pompeii,\
    \ too, unguent and oil vessels were found (Overbeck-Mau 451 Fig. 250,5. 452f. Fig. 251. 252h) made\
    \ of glass, clay, and ivory. Golden alabastra are mentioned by Theocr. XV 114; Plut. Alex. 20. In\
    \ Athen. IV 86c, alabaster vessels are mentioned alongside golden unguent vessels. For exquisite unguents,\
    \ it seems that precious, artistically shaped vessels were generally intended. At the procession of\
    \ Antiochus, fragrances were sprinkled from golden jars, καλπίδες (kalpides) (Athen. V 195b; cf. Polyb.\
    \ XXXI 3, 17), and afterwards the participants in the competitions anointed themselves from golden\
    \ vessels, ὀλκίαι (olkiai) (loc. cit. 195d). Caranus gives his guests golden and silver λήκυθοι (lekythoi)\
    \ (Athen. IV 129b). The vessel from which Jesus was anointed is also called an alabastron (Ev. Matth.\
    \ XXVI 7; Luc. VII 37). According to Ev. Marc. XIV 3, it was first broken and then the unguent was\
    \ poured on his head. The ampulla (Mart. III 82, 26; XIV 110), Greek λήκυθος (lekythos) (s.v.), which\
    \ was otherwise an oil flask, is also sometimes used as an unguent vessel (Arist. Plut. 810; Eccles.\
    \ 1101; Poll. VI 105; X 119; Athen. IV 129a). In Lucian (Luc. 12), the unguent boxes are in a small\
    \ chest. The unguent shrine of Darius, adorned with precious stones, pearls, and gold, was very costly\
    \ (Plin. VII 108; XIII 3). Illustrations of unguent flasks: Stackelberg Gräber der Hellenen Taf. 38\
    \ = Múzik-Perschinka Kunst und Leben I. A. 136, 4; Gerhard Ant. Bildw. 27, 2 = Roscher Myth. Lex.\
    \ II 2455; Overbeck-Mau loc. cit.; Daremberg-Saglio I² 177; Sigismund Aromata 85 Fig. c—e. Fig. e;\
    \ Guhl-Koner⁶ 345f. Fig. 425–427.\nΒακκάρινον (Bakkarinon), see above Vol. II, col. 2686.\nΒρένθειον\
    \ (Brentheion) Athen. XV 690 d; Etym. M. s.v. (see above Vol. III, col. 2808, 37).\nCrocinum, saffron\
    \ unguent (see above Vol. VII, col. 796, 26ff. 818, 58. Plin. XIII 5, 10. Paul. Aeg. VII 20 s.v. Diosc.\
    \ I 54, 42. 63). Only in name were ὀνύχινον, βουτύρινον, and στυράκινον different, which were otherwise\
    \ identical to the saffron unguent in their preparation and effect (Diosc. I 54, 2). The crocomagma\
    \ was also used medicinally (Diosc. I 27. Plin. XX 139).\nCyprinum (Diosc. I 55, 49. Plin. XIII 5,\
    \ 12), prepared from the blossoms of the κύπρος, Lawsonia inermis L. (see above Vol. VII, col. 805,\
    \ 14ff.).\nΔάφνινον (Daphninon), prepared from the fruits of the laurel (Theophr. od. 28), was cheap\
    \ and caused headaches (ibid. 42), mentioned as an oil in Diosc. I 40. Plin. XIII 86.\nἘλάτινον (Elatinon)\
    \ (Diosc. I 44), from the ἐλάτη (elatē), the palm fruit (cf. ibid. 109, 5). The young shoots of the\
    \ palms were used by the unguent-makers for the στύψις (stypsis, astringent base) of the unguent (ibid.\
    \ 109, 4). Pliny (XII 134) mistakenly understands elate as a specific type of palm that provides material\
    \ for unguents (Blümner Maximaltarif VI 40).\nἙρπύλλινον (Herpyllinon), from the blossoms of the wild\
    \ thyme (Theophr. od. 27 = Athen. XV 689d. XII 553d).\nἩδύχρουν (Hēdychroun), prepared on Cos, similar\
    \ in effect and preparation to the marjoram unguent, but even more fragrant (Diosc. I 58, 3. Gal.\
    \ XIV 52. 306. 262). In Cic. Tusc. III 46 it is an incense.\nIrinum, from the root of the iris (see\
    \ above Vol. VII, col. 825, 46ff.), also a good medicine, very durable, whose fragrance did not evaporate\
    \ quickly (Theophr. od. 24. 28. 36. 38). The best was made in Perge and Elis according to Diosc. I\
    \ 56, 3; according to Plin. XXI 42 formerly on Leukas and in Elis, but in his time in Pamphylia and\
    \ Cilicia; for a long time the Corinthian was very popular (Plin. XIII 5 = Athen. XV 688e). According\
    \ to Theophr. (h. pl. IX 7, 3), the iris, specifically the Illyrian iris, was the only plant usable\
    \ for aromatics. Pliny (XIII 18) also mentions the Gallic nard (cf. Theophr. h. pl. IX 7, 2. Athen.\
    \ V 195d. XII 553a. Plin. XIII 14. Aet. I s.v. ἔλαιον ἴρινον = Nic. M. XVI 30. Paul. Aeg. VII 20 s.v.).\n\
    Λευκόϊον (Leukoion) (Theophr. od. 27 = Athen. XV 689), from the blossoms of the λευκόινον (leukoinon,\
    \ white violet) (see above Vol. VII, col. 788f.), also an essence for drinking (Athen. XV 689e).\n\
    Λιβανώτινον (Libanōtinon) could only be successfully produced by a single manufacturer in Pergamon\
    \ (Athen. XV 689a).\nThe Megalium, μεγαλείον, μεγάλλειον, was named after its inventor, Megallos,\
    \ a Sicilian or Athenian (Athen. XV 690f.), and enjoyed high esteem, hence the inventor's writings\
    \ were frequently mentioned. The most famous came from Ephesus (ibid. 689a). Pliny (XIII 13) derives\
    \ the name from the great reputation (Ruf) it enjoyed. According to Diosc. I 58, 3, it was characterized\
    \ by a strong resin additive; its production required 10 days and nights and costly aromatics (Theophr.\
    \ od. 30. 35. 42. 55).\nΜυρσίνεον (Myrsineon), oil from the leaves of the myrtle (Diosc. I 39. Plin.\
    \ XV 27. XXIII 87), which became an unguent with other aromatics (Diosc. loc. cit. Theophr. 27. 28).\n\
    Oenanthinum, from the leaves of the οἰνάνθη (oinanthē, wild vine) (see above Vol. VII, col. 798, 1.\
    \ Theophr. od. 27. Diosc. I 46. Plin. XII 132). The Cypriot variety was considered the best for unguent\
    \ preparation (Athen. XV 689d. Plin. XII 133), but it was not very aromatic in Greece. The oenanthinum\
    \ from Adramyttion was considered excellent because of the preference that Eumenes' wife Stratonice\
    \ had for it (Athen. XV 689a), as was the Cypriot one (Plin. XIII 5).\nΦοινίκινον (Phoinikinon) is\
    \ mentioned by Antiphanes (Athen. XII 553d) among other unguents.\nΠλαγγόνιον (Plangonion), an unguent\
    \ common in Elis, named after its inventor Plangon (Athen. XV 690e).\nAn Egyptian unguent was Ράγδα\
    \ (Rhagda) (Athen. XV 690e) or Σάγδα (Sagda) (ibid. 691c).\nRose unguent was obtained from the juice\
    \ of rose petals and various aromatics (Diosc. I 43, 3. Plin. XIII 9. Theophr. od. 25). It was dyed\
    \ with alkanet (Theophr. 33). The properties of the ῥόδινον (rhodinon) are mentioned by Theophrastus\
    \ (35. 42. 45. 48. 51. 55). What Dioscorides (I 43, 1f.) describes as rose unguent consisted only\
    \ of olive oil boiled with sweet rush (σχοῖνος) and the juice of rose petals (see above Vol. VII,\
    \ col. 774. 817. Sigismund Aromata 77). The rose unguent from Phaselis was famous, later that from\
    \ Naples, Capua, and Praeneste (Plin. XIII 3).\nSisymbrinum (see above Vol. VII, col. 790, 67ff.),\
    \ from the blossoms of the σισύμβριον (sisymbrion, wild mint) (Theophr. 27. Athen. XV 689d. XII 553e).\n\
    Susinum, from a type of lily (see above Vol. VII, col. 792, 51ff.), hence also called κρίνινον (krininon)\
    \ (Diosc. III 102. Galen. XIX 119) and λείρινον (leirinon) (Diosc. I 52). Σοῦσον (Souson) is said\
    \ to be the Persian word for κρίνον (krinon, lily) (Athen. XII 513f.). According to Plin. XIII 11,\
    \ it was the thinnest unguent (cf. XXI 22. XXIII 95), whose aroma quickly faded (Theophr. od. 22.\
    \ 27. Athen. XV 689d).\nThe Στυράκινον (Styrakinon) mentioned by Diosc. I 54, 2 is said to have been\
    \ similar to the ὀνύχινον and βουτύρινον of the saffron unguents.\nThe process for preparing ὠκίμινον\
    \ (ōkiminon), which takes its name from the plant ὤκιμον (ōkimon, basil), was similar to that for\
    \ rhodinum (Diosc. I 49).\nThe unguent industry was widespread in Asia Minor, for instance in Cilicia\
    \ (Theophr. od. 27), especially in Soloi (Athen. XV 688d) and Tarsus (Plin. XIII 6), in Perge (Diosc.\
    \ I 56, 3), Ephesus (Athen. XV 689a), Pergamum (ibid.), Adramyttion (XV 688e. 689a), and Cyzicus (XV\
    \ 688e. Plin. XIII 5. 14). Of the islands, Rhodes was mentioned (Arist. Lys. 944 and Schol. Hesych.\
    \ s. ῥόδιον. Suid. s. Ῥόδια μύρα. Plin. XIII 5. Athen. XV 688e), Cyprus (Theophr. od. 27. Plin. XIII\
    \ 5. 10. Athen. XV 688f.), Delos (Plin. XIII 4), Cos (Plin. XIII 5. Athen. XV 688e. Diosc. I 58, 3),\
    \ and Lesbos represented by Mytilene (Plin. XIII 10).\nOn the subject of unguents, wrote the Herophilean\
    \ Apollonios (see above Vol. II, col. 149 No. 103) in his book περὶ μύρων (On Unguents) (Athen. XV\
    \ 688e ff.); Hikesios (see above Vol. VIII, col. 1393 No. 5) in his work περὶ ὕλης (On Matter) (Athen.\
    \ XV 689c); the physician Philonides in περὶ μύρων καὶ στεφάνων (On Unguents and Garlands) (Athen.\
    \ XV 675a–676e. 691f–692b); Apollodoros in a work of the same name (Athen. 675e); the imperial physician\
    \ Kriton, who in the 2nd book of his Kosmetik lists 25 different unguents and essences (Fabricius\
    \ Bibl. Graec. XII 690). Main sources on unguents can be found in Theophr. de od., Dioscorides de\
    \ materia medica I 4–68 (Wellmann, cf. the edition by Sprengel with commentary), Athen. XII 553. XV\
    \ 685–692, Plin. XII 102ff. XIII 4–5. Phot. bibl. 279, p. 532 Bekker. Poll. VI 104ff. VII 177. X 115.\
    \ Isid. IV 12."
  translation: "Die alten Völker liebten es, den Körper mit allerlei Ölen und S. einzufetten. Da diese\
    \ Sitte bei den südlichen Völkern besonders beobachtet wird, mußte ein gewisses Bedürfnis danach vorliegen\
    \ (vgl. Sigismund Aromata 57). Jedenfalls hielt man das S. mit Öl für gesund (Plin. XIV 150. XXII\
    \ 114 intus mulso, foris oleo). Nach Athen. I 24d salbte man sich, damit die Leiber nicht, nachdem\
    \ das Wasser des Bades vertrocknet war, zu sehr verhärteten. Wohlriechende S. zu verwenden, ist orientalische\
    \ Sitte. Das Morgenland ist die Heimat der aromatischen Pflanzen. Dort gelang es zuerst, den flüchtigen\
    \ Wohlgeruch an Fette und Öle zu binden und duftende S. zu bereiten. Sie dienten dazu, den unangenehmen\
    \ Geruch der starken Ausdünstung, die durch die große Hitze bedingt war, zu beseitigen (vgl. Plin.\
    \ XIII 3). Je mehr diese Wohlgerüche gefielen, um so zahlreicher wurden ihre Arten, um so verbreiteter\
    \ ihr Gebrauch. Daß die Babylonier sie schon üppig zur Salbung des ganzen Körpers gebrauchten, bezeugt\
    \ Herodot I 195. Ob sie die S. selbst erfanden oder ihre Bereitung von den Ägyptern lernten, wird\
    \ kaum zu entscheiden sein. Sigismund 61. 65 hält die Ägypter für die Erfinder. Bei ihnen lernten\
    \ wahrscheinlich die Israeliten die S. kennen, von denen sie im Kultus (Exod. XXX 25) — Moses ließ\
    \ auf Gottes Geheiß durch S.-Mischer aus verschiedenen Aromaten ein heiliges Salböl bereiten — und\
    \ im täglichen Leben reichlich Gebrauch machten (vgl. das Hohelied Vulg. I 2. 3. IV 10. 14. Vulg.\
    \ Ecclesiast. XXIV 20ff. Ev. Luc. VII 37f. Matth. XXVI 7ff. Joh. XII 3). Auch die Lydier waren als\
    \ S.-Liebhaber bekannt, was zu ihrer Weichlichkeit paßte (Athen. XV 690b). Demnach waren nicht die\
    \ Perser die Erfinder der Wohlgerüche, wie Plin. XIII 3 meint (vgl. Hor. carm. I 38, 1), sondern sie\
    \ fanden sie bei der Eroberung Babylons vor und bildeten sie zur höchsten Üppigkeit aus. Nach dem\
    \ Buche Esther II 12 wurden die für den König bestimmten Jungfrauen sechs Monate mit Myrrhenöl gesalbt\
    \ und sechs andere Monate mit allerlei S. und Spezereien behandelt, bevor sie zu ihm kommen durften.\
    \ Artaxerxes schickte dem Antalkidas über Tafel den eigenen Kranz, den er in die köstlichsten S. getaucht\
    \ hatte, eine Gunstbezeigung, die jeden in Erstaunen setzte (Plut. Artax. 22, Athen. II 48e). Bei\
    \ der Eroberung von Damaskus fanden sich, wie Parmenio dem Alexander berichtete, vierzig S.-Bereiter\
    \ unter dem gefangenen Trosse des Großkönigs (Athen. XIII 608a). Ebenso erbeutete Alexander im Lager\
    \ des Dareios bei Issus eine kostbare Kassette mit S. (Diog. L. IX 1. Plin. XIII 3. VII 108). Im Badezimmer\
    \ traf er goldene S.-Flaschen, und das Gemach duftete von Aromaten (Plut. Alex. 20). S. fanden auch\
    \ die Zehntausend auf ihrem Rückzug in Armenien (Xen. anab. IV 4, 13).\nAus dem Morgenland kam mit\
    \ dem Namen auch der Gebrauch von Parfümen zu den Griechen. Schon Homer hatte Kenntnis davon, obwohl\
    \ man sich sonst zu seiner Zeit mit Öl salbte (Athen. XV 688d). Aphrodite salbt Hektors Leiche mit\
    \ duftendem Rosenöl (Hom. Il. XXIII 186) und Hera sich selbst mit einem wohlriechenden Öl (Il. XIV\
    \ 172). Zur Zeit des Archilochos und Alkaios war das S. bereits im Schwang (Athen. XV 688c. 687d =\
    \ Alk. frg. 36 B.), ebenso rühmt es Anakreon (ebd. 687c = frg. 9). Zwar war es als Mittel zur Verweichlichung\
    \ vielfach verachtet, während der Gebrauch des Öles, das man in den Gymnasien verwendete, als Zeichen\
    \ der Männlichkeit galt (Xen. sympos. II 3). Darum stellt Sophokles die Aphrodite und Athene einander\
    \ gegenüber, die eine der S., die andere des Öles sich bedienend (Athen. XV 687c = frg. 334 N.).\n\
    Ähnlich ging es bei den Makedoniern, die in Persien mit dem S.-Luxus bekannt wurden und sich ihm bald\
    \ ergaben, obwohl Alexander die Seinen tadelte, die zum Einreiben und zum Bade S. statt Öl benutzten,\
    \ und Verweichlichung davon fürchtete (Plut. Alex. 40). In der Folgezeit wurde die S.-Verschwendung\
    \ in Griechenland und Makedonien nur um so ärger, da sich übrigens schon früh Verteidiger gefunden\
    \ hatten, die die S. anregend für die Tätigkeit des Hirnes und Herzens nannten (Athen. XV 687d ff.).\n\
    In Athen ließen sich die Schwelger fast jeden Körperteil mit einer besonderen S. einreiben, mit ägyptischer\
    \ Füße und Schenkel, mit phönizischer Kinnbacken und Brust, mit sisymbrischer den Arm, mit Amarakus-S.\
    \ Haar und Augenbrauen, mit Serpyllon-S. Knie und Nacken (Athen. XV 689e), und ein Vers rühmt das\
    \ angenehme Gefühl, das das S. durch schöne, weiche Hände hervorbringe (Athen. XII 553e). Man hielt\
    \ es für reizend, von S. zu glänzen. Um verführerischer auszusehen, färbte sich Demetrios Phalereus\
    \ das Haupthaar gelb und salbte das Gesicht und den ganzen Körper (Athen. XII 542d). Bei seinen Gastmählern\
    \ wurden die Gäste von der Decke her mit Wohlgerüchen besprengt (ebd. 542c). Ebenso wurden am syrischen\
    \ Hofe die Kränze der Gäste vor dem Trinkgelage durch herumgehende Diener aus kleinen Schläuchen mit\
    \ babylonischer S. benetzt (Athen. XV 692c). Bei dem Hochzeitsmahl des Makedoniers Karanos erhielt\
    \ jeder der zwanzig Teilnehmer nach jedem Gang ein silbernes und ein goldenes Gefäß mit S., eine Kotyle\
    \ (ca. ¼ l) enthaltend, zum Geschenke (Athen. IV 129a ff.). Bei dem prunkvollen Aufzug des Antiochos\
    \ Epiphanes zogen auch zweihundert Frauen mit, die aus goldenen Gefäßen Wohlgerüche sprengten (Athen.\
    \ V 195b). Darauf wurden im Gymnasium fünf Tage lang alle aus fünfzehn großen goldenen Gefäßen mit\
    \ Krokus-S. und aus ebenso vielen mit Zimt- und Narden-S. eingerieben. Ähnlich wurden an den folgenden\
    \ Tagen andere S. gebraucht (Athen. ebd. 195d). Welchen Luxus man mit den Parfümen trieb und wie sehr\
    \ man darauf erpicht war, zeigt die Anekdote von dem König Antiochos Epiphanes (Athen. ebd. 196b).\n\
    Wann die S. zu den Römern kamen, weiß Plinius nicht zu berichten, nur daß im J. 565 d. St. nach dem\
    \ Kriege mit Antiochos die Censoren den Verkauf der unguenta exotica verboten (Plin. XIII 24. Sol.\
    \ XLVI 2), was auf eine schon ziemliche Verbreitung schließen läßt. Jedenfalls waren sie nicht erst\
    \ mit dem übrigen asiatischen Luxus nach Italien gekommen, sondern schon vorher in Großgriechenland\
    \ und Capua Mode gewesen. Aus den Rosen der campanischen Ebene bereitete man in Neapel und Capua ein\
    \ ausgezeichnetes Öl (Athen. XV 688e). Letztere Stadt war besonders durch ihre Parfüme berühmt (s.\
    \ o. Bd. III S. 1558, 32ff.); dorthin wurden orientalische Spezereien eingeführt (Plaut. Rud. 630f.).\
    \ Das Verbot der Censoren nützte in Rom nichts. Das Parfümieren wurde in den höheren Ständen als ein\
    \ tägliches Bedürfnis empfunden und gehörte zum guten Tone (Plin. XIII 3). Nach Sen. ep. LXXXVI 13\
    \ salbte man sich bisweilen mehrmals am Tage, damit der Wohlgeruch nicht ausging. Man brauchte S.\
    \ voluptatis causa et valetudinis (Dig. XXXIV 2, 21 § 1. XV 3, 3 § 6 ad luxuriae materiem).\nDie Römerinnen\
    \ wandten Wohlgerüche so reichlich an, daß eine vorübergehende Frau durch die ausströmenden Düfte\
    \ sich auch denen bemerkbar machte, deren Aufmerksamkeit anderweitig in Anspruch genommen war (Plin.\
    \ XIII 20). Ähnlich sagt Lukian Amor. 10 von den Frauen, daß sie den Reichtum der Männer für ihr Haar\
    \ verschwenden, und ganz Arabien dufte aus ihren Haaren. Nach Mart. XIV 59 liebten Männer und Frauen\
    \ Parfümerien, erstere besonders Balsam und Zimt (Iuven. II 41. Mart. III 55, 4). Der Günstling Domitians,\
    \ Crispinus, duftete schon am Morgen stärker als zwei Leichenbegängnisse (vgl. Friedländer Sittengesch.\
    \ III⁶ 89). Plutarch berichtet ebenfalls von der S.-Verschwendung, die er als unmännlich verurteilt,\
    \ und bemerkt, die Männer wollten nicht einmal bei ihren Frauen schlafen, wenn sie nicht von S. dufteten\
    \ (Moral. 99l = Teubn. VI 94). Derselbe erzählt einen Vorgang, der selbst in dem schwelgerischen Rom\
    \ Aufsehen erregte (Galb. 19): Otho habe bei einem Gastmahl zu Ehren Neros die Gäste aus goldenen\
    \ und silbernen Röhren mit den kostbarsten S. übergießen lassen. Plinius sah selbst Fußsohlen einsalben,\
    \ was Otho dem Nero gezeigt habe (XIII 22). Petron. 70 bezeichnet es als unerhört, daß Trimalchio\
    \ seinen Gästen die Füße salben und bekränzen ließ. Von demselben unguentum wurde dann ein Teil in\
    \ das Weingefäß und in die Lampen gegossen. Caligula gebrauchte zum Bade kalte und warme Parfüme (Suet.\
    \ Calig. XXXV 1) und ließ die Badwanne mit Balsam besprengen (Plin. XIII 22), was ihm ein Sklave Neros\
    \ nachmachte, damit solches nicht bloß als Vorrecht der Fürsten erscheine. Privatleute besprengten\
    \ sogar die Wände der Badestuben mit Wohlgerüchen (Plin. a. a. O.). Beim Gastmahl des Trimalchio steigt\
    \ von der Decke ein gewaltiger Reifen mit goldenen Kränzen und S.-Flaschen herab als apophoreta für\
    \ die Gäste (Petron. 60). Es gab sogar Kuchen und Früchte, die mit Safranessenz gefüllt waren und\
    \ sie beim leisesten Drucke ausspritzten (ebd.). Ernste Männer, wie Scipio Africanus min., verurteilten\
    \ das tägliche Parfümieren (Gell. VI 12, 5) vor dem Spiegel. Er enthielt sich des S. (Sen. ep. LXXXVI\
    \ 11), wie auch Seneca (ep. CVIII 16), der sich aufs schärfste dagegen wendet (ep. LXXXVI 13. CXXII\
    \ 33; dial. VII 7, 3). Auch Cicero macht sich lustig über die Stutzer, die von S. glänzten (Catil.\
    \ II 5) und troffen (in Pis. 25f.).\nReichliche Verwendung fanden die S. bei der comissatio. Zu ihrer\
    \ Eröffnung gehörte nebst anderem das Verteilen von Kränzen und S. (Athen. IX 408e. X 409e. XV 665c).\
    \ Später leiteten Kränze und S. auch den Nachtisch ein (Athen. XV 685c. Nep. Ages. 8). Die Römer übernahmen\
    \ die griechische Sitte (Catull. XIII 11ff.), daher die häufige Erwähnung der S. bei den Dichtern,\
    \ besonders bei Horaz carm. II 3, 13. 7, 7. 22, 11, 16f. III 1, 44. 29, 4. IV 12, 17; epod. XIII 8;\
    \ ars poet. 375; vgl. Mart. III 12, 4. IV 19, 20. Iuven. XI 122. Cic. Tusc. V 62. Auch bei den Mahlzeiten\
    \ der Arvalbrüder wurden S. und Kränze verteilt (Acta fr. Arval. 27V. 218. 171V. 241. S. Henzen 13.\
    \ 27. 39). Bei Petron. 60 wird vor dem Nachtisch ein Ring mit Kränzen und S.-Fläschchen von der Decke\
    \ heruntergelassen, letztere als apophoreta. Nach dem Nachtisch tragen Sklaven S. herein und salben\
    \ die Füße der Gäste (Petron. 70). Beim Hochzeitsmahl des Karanos findet wiederholt Verteilung von\
    \ S. statt. Zu Anfang des Mahles bringen rhodische Tänzerinnen jedem Gaste je eine silberne und goldene\
    \ S.-Flasche (Athen. IV 129a); solche erhalten die Gäste noch zweimal (ebd. 129c), das drittemal beim\
    \ Übergang zur comissatio (129e). Hohe Gastgeber pflegten den Gästen auch Kränze und S. zuzusenden\
    \ (Plut. Artax. 22. Sen. IV 33, 4 von Caligula). Am syrischen Hofe kamen nach der Verteilung der Kränze\
    \ Diener herein und besprengten aus kleinen Schläuchen die Kränze der Zecher (Athen. XV 692c). Eine\
    \ noch raffiniertere Art, die Gäste mit S. zu benetzen, wird bei Athen. XV 691d erzählt. Man ließ\
    \ Tauben in Essenzen tauchen und nachher im Saal herumfliegen. Bestimmt waren die S. bei Tische für\
    \ die Haare. So kommt Habinnas von einem Gelage mit Kränzen beladen, während S. über seine Stirne\
    \ läuft (Petron. 65). Auch Christi Haupt wurde beim Mahle gesalbt (Ev. Matth. XXVI 7. Marc. XIV 3),\
    \ sogar seine Füße (Ev. Joan. XII 3. Luc. VII 38), was sonst als etwas Außergewöhnliches galt (Petron.\
    \ 70. Plin. XIII 22). Wenn etwa S.-Flaschen den Gästen als apophoreta gegeben wurden (Petron. 60),\
    \ so sollten sie zunächst bei der bald beginnenden comissatio dienen und zeigen, daß das Mahl sich\
    \ dem Ende nähere.\nZur Toilette salbte man mit Vorliebe die Haare, teils des Wohlgeruchs halber,\
    \ teils um ihnen ein glänzendes Aussehen zu geben (Horat. carm. II 7, 8. Cic. Catil. II 5. Mart. XII\
    \ 38, 3). Wie reichlich man die Parfüme dabei verwendete, zeigt der Umstand, daß oft vom Triefen der\
    \ Haare die Rede ist (Cic. in Pis. 25. Tibull. I 7, 51. Ovid. her. XX 161. 166). Hetären salbten sich,\
    \ um zu gefallen (Plaut. Truc. 288ff.), sogar ergraute Liebhaber taten dies, was ihnen zum Vorwurf\
    \ gereichte (Plaut. Cas. 226ff.), denn von alten Leuten nahm man an, daß sie sich nicht salben (Athen.\
    \ XV 688c = Archiloch. frg. 31 B.). Eher begreiflich ist, daß sich der Bräutigam zur Hochzeit salbte\
    \ (Catull. LXI 142). In römischer Zeit brauchte man sogar S., um sich die Glatze zu bemalen (Mart.\
    \ VI 57, 1ff. 74, 2) oder die Haare zu färben (s. o. Bd. VII S. 90, 31ff.). Bei Mart. III 62, 28 heißt\
    \ Haar-S. capillare (vgl. Blümner Röm. Privataltert. 275, 8). Aristoteles schrieb dem regelmäßigen\
    \ Parfümieren der Haare das Weißwerden zu, weil S. die Haare austrockneten (Athen. XV 692b). Empfohlen\
    \ wurde schon von Alkaios frg. 36 B. und Anakreon frg. 9 das S. der Brust, als Sitz des Herzens und\
    \ der Seele, um diese zu beleben (Athen. XV 687c). Haare und Brust werden bei Archilochos, der zuerst\
    \ die S. nennt, erwähnt (ebd. 688c). Daß Weichlinge übrigens den ganzen Körper (Lukian. Lexiph. 8\
    \ und Schol.) salbten und für die einzelnen Teile verschiedene S. als besonders zuträglich bezeichneten,\
    \ wurde bereits gesagt (Athen. XII 553c. XV 689e ff.). Auch nach dem Bade verwendete man S. (ebd.\
    \ XV 690c), teilte den Baderäumen (Plin. XIII 22) und dem Badewasser (Schol. Iuven. VIII 83) und der\
    \ Wäsche Wohlgerüche mit (Mart. VII 3, 10. Clem. Alex. Paedag. II 8, 207 Pott.). Vom S. der Nase spricht\
    \ Prop. III 10, 21.\nNicht bloß äußerlich, auch innerlich wollte man die S. genießen (Plin. XIII 25).\
    \ Wie man Aromate dem Wein zusetzte, so auch S., um den Geschmack zu erhöhen (Theophr. de od. 9. 67).\
    \ Den Speisen konnte man sie nicht wohl zufügen, ohne sie bitter zu machen (ebd. 10). Bei Athen. XV\
    \ 689e werden verschiedene Parfüme als geeigneter Zusatz zum Getränk oder als gut für den Magen und\
    \ die Verdauung erwähnt. Mehrfach sprechen die Schriftsteller der Kaiserzeit von der Unsitte, dem\
    \ Wein S. beizumischen (Plut. moral. 149B. Plin. XIII 25. Petron. 70. Lukian. Nigrin. 31). Iuven.\
    \ VI 303 brandmarkt dies als Üppigkeit und Ausschweifung. Daß man in der römischen Welt mit S. sogar\
    \ die Speisen verdarb, beweist ein Vorfall aus dem Leben Caesars, dem ein Freund in Mediolanum Spargel\
    \ vorsetzen ließ, der statt mit Öl mit S. zubereitet war und natürlich sehr unangenehm zu genießen\
    \ war (Plut. Caes. 17).\nWie die Israeliten S. zu religiösen Zwecken verwendeten (s. o.), so gebot\
    \ in Rom der Kultus, Götterbilder zu salben (Marquardt–Mommsen St. V. III 334. 434. Lipsius Excurs.\
    \ ad Tac. ann. I 124. Marini Atti II 394). Nach Plin. XXXIII 112 rührte es von einer anderen alten\
    \ nannten religiösen Sitte her, beim Triumphschmaus die S. mit Mennig zu vermischen. In den Akten\
    \ der Arvalbrüder ist ebenfalls von der Salbung der Götterbilder die Rede (s. o. Bd. II S. 1475ff.).\
    \ Über das Zeremoniell der Arvalbrüder vgl. CIL VI 2104. Henzen Acta 10ff. Roscher Myth. Lex. I 970ff.\
    \ In Segesta salbten Frauen und Jungfrauen das Bild der Diana (Cic. Verr. II 4, 77). Plin. XIII 23\
    \ wundert sich, daß sogar die Adler und Feldzeichen an festlichen Tagen gesalbt wurden. Die Salbung\
    \ mit Öl und Wohlgerüchen war eben von jeher eine Ehrung (Sigismund Aromata 58. 73). Auch zu abergläubischen\
    \ Zwecken dienten S. Lukian Luc. 12 weiß von einer Hexen-S. zu berichten, wodurch sich die Hexe in\
    \ einen Nachtraben verwandelt. Wahrscheinlich liegt auch Aberglaube zu Grunde, wenn ein Liebhaber\
    \ die Türe seiner Geliebten salbt, um letztere zu versöhnen (s. o. Bd. I S. 1728, 21).\nDoch bezeichnen\
    \ diese Ausdrücke manchmal den Fabrikanten. Das ist besonders im Lateinischen der Fall, wo unguentarius\
    \ (Cic. de off. I 150; ad Att. XIII 46, 2. Horat. sat. II 3, 228. Plin. XXXI 91. CIL IV 609. 2184.\
    \ VI 845. 999ff. 1974. 5638. 5681. 9998–10005. 10007 institor unguentarius. IX 171. 5905. X 3968.\
    \ 3974. 3975. 3979. 3982. 8264. XI 5839. XII 1594. XIII 2602) sowohl den Fabrikanten als auch den\
    \ Verkäufer, und unguentaria sowohl die Technik (ars) (Plaut. Poen. 708. Apul. de dogm. Plat. II 9)\
    \ als den Verkaufsladen (taberna) bedeutet (Varro de l. l. VIII 55. Suet. Aug. IV 2. Sen. ep. CVIII\
    \ 4); vgl. Blümner Technol. I² 361; Röm. Privataltert. 436, 4. Marquardt Privatl. d. Römer 782).\n\
    Auch die pigmentarii (s. d.) verkauften neben Farbstoffen odores und unguenta und die im ganzen Reich\
    \ verbreiteten seplasiarii (s. d.). Mit den Wohlgerüchen trieben die S.-Händler viel Fälschung. Da\
    \ die morgenländischen Aromata sehr teuer waren, suchte man sie durch billigere Stoffe zu ersetzen.\
    \ Kniffe der S.-Händler erwähnt Theophr. de od. 45, 53 (Plin. XIII 19). Über die Verfälschung des\
    \ Balsams s. o. Bd. II S. 2838, 29ff.\nBei den hohen Preisen der S. lohnte sich allerdings das Fälschen.\
    \ Auch sonst muß bei dem großen Verbrauch das Gewerbe der unguentarii einträglich gewesen sein. Nach\
    \ Athen. XV 691a wurde in Athen die Kotyle (≈ 0,274 l) S. sehr teuer verkauft, für 5–10 Minen. Die\
    \ Evangelien bestätigen diese Angabe. Das Pfund Narde, womit Jesus gesalbt wurde, wurde auf 300 Denare\
    \ (1 Den. = 0,87 Mark, s. o. Bd. V S. 209, 63) veranschlagt (Ev. Joh. XII 3f. Marc. XIV 3ff.). Ein\
    \ hoher Preis, wenn nach Ev. Marc. VI 37 die Jünger 200 Denare für hinreichend halten, für mehrere\
    \ tausend Menschen Brot zu kaufen. Martial XII 65 überlegt, ob er seiner Phyllis zehn Gelbe aus der\
    \ Münze des Kaisers — 210 Mark — oder ein Pfund aus den Läden des Cosmus oder Niceros schenken sollte\
    \ (vgl. Mart. XI 27, 9). Von der Narde kostete das Blatt 40–75 Denare das Pfund, und die öhricht 100\
    \ Denare das Pfund (Plin. XII 43ff.). Daher gehörte die Narden-S., das foliatum und spicatum, zu den\
    \ kostbarsten, 35–300 Denare das Pfund (ebd. XIII 15). Ein römisches Pfund Malabathrumöl kostete bis\
    \ 400 Denare (ebd. XII 129), Zimtsaft bis 1500 Denare (ebd. XII 99).\nDie Bereitung der S. geschah\
    \ mit ausgesuchter Kunst, um sie möglichst pikant zu machen (Cic. de orat. III 99 = Plin. XIII 21;\
    \ vgl. Theophr. de od. 8, 25). Sie erhielten Schärfe durch costus und amomum, wurden dicker und angenehmer\
    \ durch Myrrhe, für die Medizin brauchbar durch crocus. Einige Fabrikanten begnügten sich, von den\
    \ teuren Stoffen nur etwas hinzuzuspritzen, nachdem das übrige abgekocht war, was natürlich Kraft\
    \ und Wert der S. herabminderte (Plin. XIII 16). Fälschung war ja nach Plin. XIII 17 an der Tagesordnung\
    \ (vgl. Theophr. 30). Die Namen der S. sind zahlreich. Sie rühren nach Plin. XIII 4 von ihrer Heimat\
    \ oder von den Bestandteilen und Pflanzen, oder sonstigen Umständen her. Bald waren diese, bald jene\
    \ S. in Mode, je nach den verschiedenen Stoffen und ihrer eigentümlichen Mischung, in der man erfinderisch\
    \ war. Auch gediehen die nötigen Aromata bald da, bald dort besser, bald schlugen sie aus der Art.\
    \ Theophr. 37 sagt, die Witterung, die richtige Zeit des Einsammelns oder Gewinnung und die Beobachtung\
    \ der Vollkraft der Pflanzen nach ihrer Gewinnung sei von großem Einfluss bei der Bereitung der S.\
    \ (vgl. ebd. 34). Manchmal erhielten die S. ihren Namen von dem Bestandteil, der ihnen den vorwiegenden\
    \ Geruch gab. Jedoch war das nicht immer der Fall (Diosc. I 42, 3). Von den Wohlgerüchen herrschte\
    \ der zuletzt beigemischte vor, und die S. wurden durch das Alter besser (Plin. XIII 19; Theophr.\
    \ 17).\nZu den haltbarsten gehörte die ägyptische S., das irinum, die Majoran- und Narden-S., und\
    \ vor allem die Stakte. Ein S.-Händler soll ägyptische S. von 8, und irinum von 20 Jahren gehabt haben\
    \ (Theophr. 38). Die S. wurden nach Theophr. hist. plant. IX 7, 3 aus den Blüten und Blättern, den\
    \ Sprösslingen und Wurzeln, dem Holze, den Früchten und dem Harze der wohlriechenden Pflanzen bereitet,\
    \ wofür er einzelne Beispiele anführt, ausgenommen für Harz und für die Sprösslinge. Am schwächsten\
    \ und wenigsten haltbar waren die aus den Blüten, die nach zwei Monaten am besten sind, nach einem\
    \ Jahr aber verderben (39. 67f.); zu den stärksten gehörten die ägyptische und Majoran-S. und das\
    \ megalium (55). Eine S. für sich, ohne weitere Zusammensetzung, war die Stakte (29), die anderen\
    \ waren mehr oder weniger zusammengesetzt. Eine der ersten und einfachsten bestand nach Plin. XIII\
    \ 8, ohne dass er ihren eigentlichen Namen angibt, aus bryon und Behenöl (vgl. Diosc. I 21). Die am\
    \ meisten erwähnten kosmetischen S., die auch zu Heilzwecken verwendet wurden, sind:\nDie ägyptische\
    \ S., die aus mehreren Stoffen bestand, von denen Theophr. 28 Zimt und Myrrhe nennt, und zu den kostbarsten\
    \ (30) gehörte, nicht gefärbt war, weil man ihre weiße Farbe erhalten wollte (31), und sehr dauerhaft\
    \ war (38). Von ihrer Verwendung spricht Athen. II 66c. XII 553d.\nDie Majoran-S., amaracinum, s.\
    \ o. Bd. I S. 789, 31f.\nAmomumbalsamum (Ovid. ex Pont. I 9, 52. Pers. III 101. Mart. V 64, 3), sonst\
    \ wurde Amomum (s. o. Bd. I S. 1873, 46ff.) den köstlichsten S. beigemischt (Diosc. I 15, 2).\nDas\
    \ Anethinum wurde aus Dill (s. o. Bd. I S. 641, 9) und Olivenöl bereitet (Isid. IV 12, 10. Diosc.\
    \ I 51).\nBalsaninum s. o. Bd. V S. 2970.\nBalsam. S. s. o. Bd. II S. 2838. Der minderwertige Holzbalsam\
    \ wurde mit unter die S. gekocht (ebd. Z. 22ff. = Plin. XII 118).\nCinnamominum nach Plin. XIII 15\
    \ die dickste S.; das Pfund kostete 35–300 Denare (Diosc. I 61). Beide Zimtarten (s. o. Bd. III S.\
    \ 1637) wurden mit andern Substanzen zu verschiedenen S. verwendet (ebd. S. 1648, 50ff.), namentlich\
    \ zu kostbaren (Diosc. I 14, 4. Theophr. od. 28, 29).\nCommagenum Plin. XXIX 55f., aus der Kommagene\
    \ genannten Pflanze, vielleicht Nardus Syriaca, und Gänsefett, Zimt und weißem Pfeffer (Dig. XXXIV\
    \ 2, 21 § 1).\nCostum, selten costus, eine kostbare S. aus der Wurzel des gleichnamigen indischen\
    \ Strauches, Costus arabicus L. (Plin. XII 41. Cels. III 21. Horat. carm. III 1, 44. Prop. IV 6, 5.\
    \ Lucan. IX 917). Die Wurzel wurde auch zur Majoran-S. verwendet (Theophr. od. 28).\nCrinon (Dig.\
    \ XXXIV 2, 21 § 1) oder susinum (Cels. V 21, 1; Plin. XIII 11), hauptsächlich aus den Blüten der Lilie\
    \ (s. o. Bd. VII S. 793, 8ff.).\nGlaucinum (Mart. IX 26, 2), nach Dig. XXXIV 2, 21 § 1 kosmetische\
    \ und medizinische S., aus dem Safte des glaucion, Chelidonium glaucium L., großblütiges Schöllkraut\
    \ (vgl. Plin. XX 206. XXVII 83).\nGleucinum, nach Diosc. I 37 aus Öl von unreifen Oliven und verschiedenen\
    \ Aromaten und Most, nach Colum. V 22, 1. Plin. XV 29 ein Öl, dem aber auch zuweilen kostbare Wohlgerüche\
    \ beigemischt wurden.\nDie Könige-S., schon von Krates und Sappho erwähnt (Athen. XV 690d e), war\
    \ die ausgezeichnetste und kostbarste S.; sie wurde nach Plin. XIII 18 für die Partherkönige fabriziert\
    \ und bestand aus 24 Wohlgerüchen nebst Honig und Wein.\nMalobathrum (Diosc. I 63), von Plin. XIII\
    \ 14 unter die solidiora unguenta gerechnet, aus dem wohlriechenden Blatte der Laurus Cassia (Plin.\
    \ XII 129. XXIII 98; vgl. Kiessling zu Horat. carm. II 7, 7. Sidon. carm. V 415. Cels. V 23. Cael.\
    \ Aurel. acut. III 3, 24; chron. VI, 12). In Rom zahlte man für das Pfund Öl 300 Denare (Plin. XII\
    \ 129).\nMelinum, Öl aus Quitten (Diosc. I 45. Plin. XIII 11. XXIII 108), das durch aromatische Zutaten\
    \ zu einer S. wurde (Theophr. od. 26. 28. 31. Plin. a. a. O.); das beste lieferte Kos (Plin. XIII\
    \ 5).\nMendesium (Diosc. I 59, 3. Plin. XIII 5, 8. Athen. XV 688f.) lieferte Ägypten am besten, wie\
    \ auch\ndas Metopium, das hauptsächlich aus dem Öl bitterer Mandeln nebst verschiedenen andern Zutaten\
    \ bestand (Plin. XIII 8, 5. Athen. XV 688f.). Der Name soll von einem metopon (Gummi Ammoniacum) genannten\
    \ Baume (Plin. XII 107) herstammen, dessen Harz ein Bestandteil dieser S. war (Diosc. I 59).\nMyrobalanum\
    \ s. Balaninum.\nDas Narcissinum (Diosc. I 53) wurde aus den Blättern der Narzisse (vgl. o. Bd. VII\
    \ S. 794f.) bereitet; später wurde seine Erzeugung aufgegeben (Plin. XIII 6).\nDas Nardinum (Theophr.\
    \ 28. 33. 38. 42) gehörte zu den vorzüglichsten (Athen. XV 691) und teuersten S. (Plin. XII 43ff.).\
    \ Nach Galen. XII 429. 601 unterschied man das foliatum (Mart. XI 27, 9), das bei den römischen Frauen\
    \ sehr beliebt war, und das spicatum. Die Zusammensetzung des ersteren findet sich bei Plin. XIII\
    \ 15. Diosc. I 62. Bei Iuven. VI 465 bezeichnet foliatum wahrscheinlich eine trinkbare Essenz. Mit\
    \ echter Narde wurde Jesus gesalbt (Ev. Marc. XIV 3. Joa. XII 3; vgl. Hieron. hom. in cant. I 4. Ambros.\
    \ in Luc. VI 34).\nDas Panathenaicum behauptete sich stets in Athen (Athen. XV 688f. Plin. XIII 6).\n\
    In Vergessenheit war das Pardalium geraten, das ehemals in Tarsus heimisch war (Plin. XIII 6).\nSampsuchinum,\
    \ s. o. Amaracinum (Diosc. I 48. Plin. XIII 10. XXI 163. Athen. XV 689c).\nStacte, der flüssige Teil\
    \ des Myrrhenharzes, galt als natürliche Salbe und war sehr teuer (Diosc. I 60. Plin. XIII 17. Theophr.\
    \ 29. 44. Athen. XV 688d. 689b ff.).\nÜber das Telinum, s. o. Bd. III S. 581, 30ff. Vorzügliches telinum\
    \ lieferte Syrien (Athen. XV 689a, d). Zur Zeit des Komikers Menander in Gebrauch, wurde diese Salbe\
    \ nachher vom megalium übertroffen (Plin. XIII 13; vgl. Diosc. I 47. Tertull. pall. 4. Isid. IV 12,\
    \ 7).\nDie Fabrikation der Salben und der damit schwunghaft betriebene Handel gingen, wie schon erwähnt,\
    \ vom Morgenlande aus. Von jeher waren Syrien (Athen. XV 689a) und Ägypten durch ihre Salben berühmt\
    \ (XV 688f.), besonders Mendes (Plin. XIII 4) und Alexandrien, wo Arsinoë und Berenike durch ihre\
    \ Vorliebe für Wohlgerüche den Salbenhandel zur Blüte brachten (Athen. XV 689a). Dazu zählt Kyrene\
    \ (Ath. XV 689 a).\nTheophr. h. pl. VI 6, 5; c. pl. VI 18, 3. Von Phönikien (Plin. XIII 6) wird Sidon\
    \ (Athen. XV 688f.) eigens hervorgehoben.\nIm griechischen Mutterlande lieferten Athen (Athen. XV\
    \ 688e f. Plin. XIII 6), Korinth (Plin. XIII 5), Elis (Diosc. I 56, 3. Athen. XV 688e), Aigina (Theophr.\
    \ od. 27. Athen. XIII 14). In Italien war Kampanien das Hauptgebiet der Salbenproduktion, von deren\
    \ Umfang das Sprichwort Plus apud Campanos unguenti quam apud ceteros olei fieri (Plin. XVIII 111)\
    \ eine Vorstellung gibt, besonders Capua, Neapel, Praeneste (Athen. XV 688e. Plin. XIII 3). In Rom\
    \ waren zu Iuvenals und Martials Zeit Cosmus (Iuven. VIII 86 u. Schol. Mart. I 87, 2. III 55, 1. 82,\
    \ 26. IX 26, 2 u. ö.) und Niceros (VI 55, 3. X 38, 3. XII 65, 4) die bekanntesten Salben- und Essenzenhändler.\n\
    Vgl. Büchsenschütz, Hauptstadt des Gewerbfleißes 94ff.; Blümner, Gewerbliche Tätigkeit, Register unter\
    \ Salbenfabrikation.\nLiteratur: Culmann Salben im Morgen- und Abendland, Leipzig 1877. Sigismund\
    \ Aromata. [Haug.]\nThe ancient peoples loved to grease the body with all sorts of oils and unguents.\
    \ Since this custom is particularly observed among southern peoples, a certain need for it must have\
    \ existed (cf. Sigismund Aromata 57). In any case, it was considered healthy to use unguents with\
    \ oil (Plin. XIV 150. XXII 114 intus mulso, foris oleo [mead wine inside, oil outside]). According\
    \ to Athen. I 24d, people anointed themselves so that their bodies would not become too hard after\
    \ the water from the bath had dried. The use of fragrant unguents is an oriental custom. The Orient\
    \ is the home of aromatic plants. It was there that they first succeeded in binding fleeting fragrances\
    \ to fats and oils and in preparing scented unguents. They served to eliminate the unpleasant odor\
    \ of strong perspiration caused by the great heat (cf. Plin. XIII 3). The more these fragrances pleased,\
    \ the more numerous their varieties became, and the more widespread their use. Herodotus (I 195) attests\
    \ that the Babylonians already used them lavishly for anointing the entire body. Whether they invented\
    \ the unguents themselves or learned their preparation from the Egyptians is difficult to decide.\
    \ Sigismund (61. 65) considers the Egyptians the inventors. The Israelites probably learned about\
    \ unguents from them, making ample use of them in their cult—Moses, at God's command, had a holy anointing\
    \ oil prepared from various aromatics (Exod. XXX 25)—and in daily life (cf. the Song of Solomon Vulg.\
    \ I 2. 3. IV 10. 14. Vulg. Ecclesiast. XXIV 20ff. Ev. Luc. VII 37f. Matth. XXVI 7ff. Joh. XII 3).\
    \ The Lydians were also known as lovers of unguents, which suited their effeminacy (Athen. XV 690b).\
    \ Consequently, the Persians were not the inventors of fragrances, as Pliny (XIII 3) claims (cf. Hor.\
    \ carm. I 38, 1), but rather they found them upon conquering Babylon and developed them to the highest\
    \ degree of lavishness. According to the Book of Esther (II 12), the virgins destined for the king\
    \ were anointed for six months with oil of myrrh and for another six months with all sorts of unguents\
    \ and spices before they were allowed to come to him. Artaxerxes sent Antalcidas his own crown from\
    \ the table, which he had dipped in the most exquisite unguents, a gesture of favor that astonished\
    \ everyone (Plut. Artax. 22, Athen. II 48e). During the conquest of Damascus, as Parmenio reported\
    \ to Alexander, forty unguent-makers were found among the captured retinue of the Great King (Athen.\
    \ XIII 608a). Likewise, Alexander captured a precious casket of unguents in the camp of Darius at\
    \ Issus (Diog. L. IX 1. Plin. XIII 3. VII 108). In the bathroom, he found golden unguent flasks, and\
    \ the chamber was fragrant with aromatics (Plut. Alex. 20). The Ten Thousand also found unguents on\
    \ their retreat in Armenia (Xen. anab. IV 4, 13).\nFrom the Orient, the use of perfumes also came\
    \ to the Greeks, along with the name. Homer already had knowledge of it, although in his time people\
    \ generally anointed themselves with oil (Athen. XV 688d). Aphrodite anoints Hector's body with fragrant\
    \ rose oil (Hom. Il. XXIII 186), and Hera anoints herself with a fragrant oil (Il. XIV 172). By the\
    \ time of Archilochos and Alcaeus, unguents were already in vogue (Athen. XV 688c. 687d = Alk. frg.\
    \ 36 B.), and Anacreon also praises them (ibid. 687c = frg. 9). While it was often disdained as a\
    \ means of effeminacy, the use of oil in the gymnasia was considered a sign of masculinity (Xen. sympos.\
    \ II 3). Therefore, Sophocles contrasts Aphrodite and Athena, one using unguents, the other oil (Athen.\
    \ XV 687c = frg. 334 N.).\nIt was similar with the Macedonians, who became acquainted with the luxury\
    \ of unguents in Persia and soon succumbed to it, although Alexander rebuked his men for using unguents\
    \ instead of oil for rubbing and bathing, fearing it would lead to effeminacy (Plut. Alex. 40). Subsequently,\
    \ the extravagance with unguents in Greece and Macedonia only grew more intense, especially since\
    \ defenders had been found early on who called unguents stimulating for the activity of the brain\
    \ and heart (Athen. XV 687d ff.).\nIn Athens, hedonists had almost every part of their body rubbed\
    \ with a special unguent: Egyptian for the feet and legs, Phoenician for the jaw and chest, sisymbrium\
    \ for the arm, amarakus for the hair and eyebrows, and serpyllum for the knees and neck (Athen. XV\
    \ 689e), and a verse praises the pleasant feeling that unguents produce through beautiful, soft hands\
    \ (Athen. XII 553e). It was considered charming to glisten with unguents. To look more seductive,\
    \ Demetrius Phalereus dyed his hair yellow and anointed his face and entire body (Athen. XII 542d).\
    \ At his banquets, the guests were sprinkled with fragrances from the ceiling (ibid. 542c). Similarly,\
    \ at the Syrian court, the garlands of the guests were sprinkled with Babylonian unguent by servants\
    \ walking around with small flasks before the drinking began (Athen. XV 692c). At the wedding feast\
    \ of the Macedonian Caranus, each of the twenty participants received a silver and a golden vessel\
    \ with unguent after each course, containing a kotyle (ca. ¼ liter), as a gift (Athen. IV 129a ff.).\
    \ In the magnificent procession of Antiochus Epiphanes, two hundred women also marched along, sprinkling\
    \ fragrances from golden vessels (Athen. V 195b). Afterward, in the gymnasium, everyone was anointed\
    \ for five days from fifteen large golden vessels with crocus unguent and from just as many with cinnamon\
    \ and nard unguent. Similarly, other unguents were used on the following days (Athen. ibid. 195d).\
    \ The anecdote of King Antiochus Epiphanes shows what luxury was practiced with perfumes and how much\
    \ people coveted them (Athen. ibid. 196b).\nPliny does not know when unguents came to the Romans,\
    \ only that in the year 565 AUC, after the war with Antiochus, the censors forbade the sale of unguenta\
    \ exotica (Plin. XIII 24. Sol. XLVI 2), which suggests a fairly widespread use already. In any case,\
    \ they had not first come to Italy with the rest of Asian luxury but had already been in fashion in\
    \ Magna Graecia and Capua. From the roses of the Campanian plain, an excellent oil was prepared in\
    \ Naples and Capua (Athen. XV 688e). The latter city was particularly famous for its perfumes (see\
    \ above Vol. III, col. 1558, 32ff.); oriental spices were imported there (Plaut. Rud. 630f.). The\
    \ censors' ban was of no use in Rome. Perfuming became perceived as a daily necessity in the upper\
    \ classes and was part of good manners (guten Tone) (Plin. XIII 3). According to Sen. ep. LXXXVI 13,\
    \ people sometimes anointed themselves several times a day so that the fragrance would not fade. Unguents\
    \ were used \"for the sake of pleasure and health\" (voluptatis causa et valetudinis) (Dig. XXXIV\
    \ 2, 21 § 1. XV 3, 3 § 6 ad luxuriae materiem [as material for luxury]).\nRoman women used fragrances\
    \ so lavishly that a passing woman made herself noticeable even to those whose attention was otherwise\
    \ occupied (Plin. XIII 20). Similarly, Lucian (Amor. 10) says of women that they squander the wealth\
    \ of men on their hair, and that all of Arabia seems to emanate from it. According to Mart. XIV 59,\
    \ men and women loved perfumes, the former especially balsam and cinnamon (Iuven. II 41. Mart. III\
    \ 55, 4). The favorite of Domitian, Crispinus, already smelled stronger in the morning than two funeral\
    \ processions (cf. Friedländer Sittengesch. III⁶ 89). Plutarch also reports on the extravagance with\
    \ unguents, which he condemns as unmanly, and notes that men did not even want to sleep with their\
    \ wives if they did not smell of unguents (Moral. 99l = Teubn. VI 94). He recounts an incident that\
    \ caused a stir even in prodigal Rome (Galb. 19): Otho, at a banquet in honor of Nero, had the guests\
    \ showered with the most precious unguents from golden and silver pipes. Pliny himself saw soles of\
    \ feet being anointed, something Otho had shown Nero (XIII 22). Petronius (70) describes it as unheard\
    \ of that Trimalchio had his guests' feet anointed and garlanded. Some of the same unguent was then\
    \ poured into the wine vessel and into the lamps. Caligula used cold and warm perfumes for his bath\
    \ (Suet. Calig. XXXV 1) and had the bathtub sprinkled with balsam (Plin. XIII 22), a practice a slave\
    \ of Nero's imitated, so that it would not appear to be a privilege of princes alone. Private individuals\
    \ even sprinkled the walls of their bathing rooms with fragrances (Plin. loc. cit.). At Trimalchio's\
    \ feast, a huge hoop with golden crowns and unguent flasks descends from the ceiling as guest-gifts\
    \ (apophoreta) for the guests (Petron. 60). There were even cakes and fruits filled with saffron essence\
    \ that squirted out at the slightest pressure (ibid.). Serious men, like Scipio Africanus the Younger,\
    \ condemned daily perfuming in front of the mirror (Gell. VI 12, 5). He abstained from unguents (Sen.\
    \ ep. LXXXVI 11), as did Seneca (ep. CVIII 16), who argued most sharply against it (ep. LXXXVI 13.\
    \ CXXII 33; dial. VII 7, 3). Cicero also mocks the fops who glistened (Catil. II 5) and dripped (in\
    \ Pis. 25f.) with unguents.\nUnguents found ample use at the comissatio (drinking party). Its opening\
    \ included, among other things, the distribution of garlands and unguents (Athen. IX 408e. X 409e.\
    \ XV 665c). Later, garlands and unguents also introduced the dessert course (Athen. XV 685c. Nep.\
    \ Ages. 8). The Romans adopted the Greek custom (Catull. XIII 11ff.), hence the frequent mention of\
    \ unguents by the poets, especially Horace (carm. II 3, 13. 7, 7. 22, 11, 16f. III 1, 44. 29, 4. IV\
    \ 12, 17; epod. XIII 8; ars poet. 375; cf. Mart. III 12, 4. IV 19, 20. Iuven. XI 122. Cic. Tusc. V\
    \ 62). Unguents and garlands were also distributed at the meals of the Arval Brethren (Acta fr. Arval.\
    \ 27V. 218. 171V. 241. S. Henzen 13. 27. 39). In Petronius (60), a ring with garlands and unguent\
    \ flasks is lowered from the ceiling before dessert, the latter as guest-gifts. After dessert, slaves\
    \ bring in unguents and anoint the guests' feet (Petron. 70). At the wedding feast of Caranus, unguents\
    \ are repeatedly distributed. At the beginning of the meal, Rhodian dancers bring each guest a silver\
    \ and a golden unguent flask (Athen. IV 129a); the guests receive such flasks twice more (ibid. 129c),\
    \ the third time during the transition to the comissatio (129e). Grand hosts used to send garlands\
    \ and unguents to their guests as well (Plut. Artax. 22. Sen. IV 33, 4 of Caligula). At the Syrian\
    \ court, after the distribution of garlands, servants came in and sprinkled the drinkers' garlands\
    \ from small flasks (Athen. XV 692c). An even more refined way of scenting the guests is told in Athenaeus\
    \ (XV 691d). Doves were dipped in essences and then allowed to fly around the hall. The unguents at\
    \ the table were intended for the hair. Thus Habinnas comes from a feast laden with garlands, while\
    \ unguent runs down his forehead (Petron. 65). Christ's head was also anointed at a meal (Ev. Matth.\
    \ XXVI 7. Marc. XIV 3), and even his feet (Ev. Joan. XII 3. Luc. VII 38), which was otherwise considered\
    \ somewhat extraordinary (Petron. 70. Plin. XIII 22). When unguent flasks were given to guests as\
    \ apophoreta (Petron. 60), they were intended to be used at the soon-to-begin comissatio and to show\
    \ that the meal was nearing its end.\nFor one's grooming (toilette), the hair was preferably anointed,\
    \ partly for the fragrance, partly to give it a shiny appearance (Horat. carm. II 7, 8. Cic. Catil.\
    \ II 5. Mart. XII 38, 3). The fact that the hair is often described as dripping shows how lavishly\
    \ perfumes were used (Cic. in Pis. 25. Tibull. I 7, 51. Ovid. her. XX 161. 166). Hetaerae anointed\
    \ themselves to be pleasing (Plaut. Truc. 288ff.), and even graying lovers did so, for which they\
    \ were reproached (Plaut. Cas. 226ff.), for it was assumed that old people did not anoint themselves\
    \ (Athen. XV 688c = Archiloch. frg. 31 B.). It is more understandable that a bridegroom anointed himself\
    \ for his wedding (Catull. LXI 142). In Roman times, unguents were even used to paint a bald head\
    \ (Mart. VI 57, 1ff. 74, 2) or to dye the hair (see above Vol. VII, col. 90, 31ff.). In Mart. III\
    \ 62, 28, hair unguent is called capillare (cf. Blümner Röm. Privataltert. 275, 8). Aristotle attributed\
    \ the graying of hair to regular perfuming, because unguents dried out the hair (Athen. XV 692b).\
    \ The anointing of the chest was recommended as early as Alcaeus (frg. 36 B.) and Anacreon (frg. 9),\
    \ as it was the seat of the heart and soul, in order to invigorate them (Athen. XV 687c). Hair and\
    \ chest are mentioned by Archilochos, who is the first to name unguents (ibid. 688c). That effeminate\
    \ men, by the way, anointed their entire body (Lucian. Lexiph. 8 and Schol.) and designated different\
    \ unguents as particularly beneficial for individual parts, has already been said (Athen. XII 553c.\
    \ XV 689e ff.). Unguents were also used after bathing (ibid. XV 690c), and fragrances were added to\
    \ the bathing rooms (Plin. XIII 22), the bathwater (Schol. Iuven. VIII 83), and the laundry (Mart.\
    \ VII 3, 10. Clem. Alex. Paedag. II 8, 207 Pott.). Prop. III 10, 21 speaks of anointing the nose.\n\
    Not only externally, but also internally people wanted to enjoy unguents (Plin. XIII 25). Just as\
    \ aromatics were added to wine, so too were unguents, to enhance the taste (Theophr. de od. 9. 67).\
    \ They could not well be added to food without making it bitter (ibid. 10). In Athenaeus (XV 689e),\
    \ various perfumes are mentioned as a suitable addition to a drink or as good for the stomach and\
    \ digestion. Several writers of the Imperial period speak of the bad habit of adding unguents to wine\
    \ (Plut. moral. 149B. Plin. XIII 25. Petron. 70. Lukian. Nigrin. 31). Iuvenal (VI 303) brands this\
    \ as extravagance and debauchery. That in the Roman world even food was spoiled with unguents is proven\
    \ by an incident from Caesar's life, when a friend in Mediolanum served him asparagus that was prepared\
    \ with unguent instead of oil and was, of course, very unpleasant to eat (Plut. Caes. 17).\nJust as\
    \ the Israelites used unguents for religious purposes (see above), so too in Rome the cult required\
    \ the anointing of images of the gods (Marquardt–Mommsen St. V. III 334. 434. Lipsius Excurs. ad Tac.\
    \ ann. I 124. Marini Atti II 394). According to Plin. XXXIII 112, it stemmed from another old religious\
    \ custom, to mix the unguents with red lead during the triumphal feast. In the acts of the Arval Brethren,\
    \ there is also mention of the anointing of the gods' images (see above Vol. II, col. 1475ff.). On\
    \ the ceremony of the Arval Brethren, cf. CIL VI 2104. Henzen Acta 10ff. Roscher Myth. Lex. I 970ff.\
    \ In Segesta, women and maidens anointed the image of Diana (Cic. Verr. II 4, 77). Pliny (XIII 23)\
    \ wonders that even the eagles and field standards were anointed on festive days. Anointing with oil\
    \ and fragrances was, after all, always an honor (Sigismund Aromata 58. 73). Unguents also served\
    \ superstitious purposes. Lucian (Luc. 12) tells of a witch's unguent, through which the witch transforms\
    \ into a night-raven. Superstition is also likely the basis when a lover anoints his beloved's door\
    \ to reconcile with her (see above Vol. I, col. 1728, 21).\nHowever, these terms sometimes refer to\
    \ the manufacturer. This is particularly the case in Latin, where unguentarius (Cic. de off. I 150;\
    \ ad Att. XIII 46, 2. Horat. sat. II 3, 228. Plin. XXXI 91. CIL IV 609. 2184. VI 845. 999ff. 1974.\
    \ 5638. 5681. 9998–10005. 10007 institor unguentarius. IX 171. 5905. X 3968. 3974. 3975. 3979. 3982.\
    \ 8264. XI 5839. XII 1594. XIII 2602) refers to both the manufacturer and the seller, and unguentaria\
    \ means both the technique (ars) (Plaut. Poen. 708. Apul. de dogm. Plat. II 9) and the shop (taberna)\
    \ (Varro de l. l. VIII 55. Suet. Aug. IV 2. Sen. ep. CVIII 4); cf. Blümner Technol. I² 361; Röm. Privataltert.\
    \ 436, 4. Marquardt Privatl. d. Römer 782).\nThe pigmentarii (s.v.) also sold odores and unguenta\
    \ alongside dyes, as did the seplasiarii (s.v.), who were spread throughout the empire. The unguent-dealers\
    \ engaged in much counterfeiting with fragrances. Since the oriental aromatics were very expensive,\
    \ they sought to replace them with cheaper substances. Theophrastus mentions tricks of the unguent-dealers\
    \ (de od. 45, 53) (Plin. XIII 19). On the adulteration of balsam, see above Vol. II, col. 2838, 29ff.\n\
    Given the high prices of unguents, counterfeiting was certainly profitable. Moreover, with the great\
    \ consumption, the trade of the unguentarii must have been lucrative. According to Athenaeus (XV 691a),\
    \ a kotyle (≈ 0.274 l) of unguent was sold very expensively in Athens, for 5–10 minae. The Gospels\
    \ confirm this figure. The pound of nard with which Jesus was anointed was valued at 300 denarii (1\
    \ denarius = 0.87 Mark, see above Vol. V, col. 209, 63) (Ev. Joh. XII 3f. Marc. XIV 3ff.). A high\
    \ price, when according to Ev. Marc. VI 37, the disciples considered 200 denarii sufficient to buy\
    \ bread for several thousand people. Martial (XII 65) considers whether he should give his Phyllis\
    \ ten gold pieces from the emperor's mint—210 Marks—or a pound from the shops of Cosmus or Niceros\
    \ (cf. Mart. XI 27, 9). The leaf of the nard cost 40–75 denarii per pound, and the ear 100 denarii\
    \ per pound (Plin. XII 43ff.). Therefore, the nard unguent, both the foliatum and the spicatum, was\
    \ among the most expensive, at 35–300 denarii per pound (ibid. XIII 15). A Roman pound of Malabathrum\
    \ oil cost up to 400 denarii (ibid. XII 129), and cinnamon juice up to 1500 denarii (ibid. XII 99).\n\
    The preparation of unguents was done with exquisite art, to make them as piquant as possible (Cic.\
    \ de orat. III 99 = Plin. XIII 21; cf. Theophr. de od. 8, 25). They gained pungency from costus and\
    \ amomum, became thicker and more pleasant with myrrh, and useful for medicine with crocus. Some manufacturers\
    \ contented themselves with sprinkling in a little of the expensive ingredients after the rest had\
    \ been boiled, which naturally diminished the strength and value of the unguent (Plin. XIII 16). Counterfeiting\
    \ was, according to Plin. XIII 17, the order of the day (cf. Theophr. 30). The names of the unguents\
    \ are numerous. According to Plin. XIII 4, they derive from their place of origin, their ingredients\
    \ and plants, or other circumstances. Sometimes these, sometimes those unguents were in fashion, depending\
    \ on the different ingredients and their particular mixture, in which one was inventive. The necessary\
    \ aromatics also thrived better now here, now there, or sometimes they degenerated. Theophrastus (37)\
    \ says that the weather, the right time of gathering or extraction, and the observation of the full\
    \ strength of the plants after their extraction have a great influence on the preparation of unguents\
    \ (cf. ibid. 34). Sometimes the unguents received their name from the ingredient that gave them their\
    \ predominant scent. However, this was not always the case (Diosc. I 42, 3). Of the fragrances, the\
    \ one added last predominated, and the unguents improved with age (Plin. XIII 19; Theophr. 17).\n\
    Among the most durable were the Egyptian unguent, irinum, the marjoram and nard unguents, and above\
    \ all, stacte. An unguent-dealer is said to have had Egyptian unguent for 8 years, and irinum for\
    \ 20 years (Theophr. 38). The unguents, according to Theophr. (hist. plant. IX 7, 3), were prepared\
    \ from the blossoms and leaves, the shoots and roots, the wood, the fruits, and the resin of fragrant\
    \ plants, for which he gives individual examples, except for resin and for the shoots. The weakest\
    \ and least durable were those from the blossoms, which are best after two months but spoil after\
    \ a year (39. 67f.); among the strongest were the Egyptian and marjoram unguents and megalium (55).\
    \ An unguent in itself, without further composition, was stacte (29); the others were more or less\
    \ composite. One of the first and simplest, according to Plin. XIII 8, without him giving its proper\
    \ name, consisted of bryon and ben oil (cf. Diosc. I 21). The most frequently mentioned cosmetic unguents,\
    \ which were also used for medicinal purposes, are:\nThe Egyptian unguent, which consisted of several\
    \ ingredients, of which Theophrastus (28) names cinnamon and myrrh, and was one of the most expensive\
    \ (30), was not dyed because its white color was to be preserved (31), and was very durable (38).\
    \ Its use is mentioned by Athen. II 66c. XII 553d.\nThe marjoram unguent, amaracinum, see above Vol.\
    \ I, col. 789, 31f.\nAmomumbalsamum (Ovid. ex Pont. I 9, 52. Pers. III 101. Mart. V 64, 3), otherwise\
    \ amomum (see above Vol. I, col. 1873, 46ff.) was added to the most precious unguents (Diosc. I 15,\
    \ 2).\nAnethinum was prepared from dill (see above Vol. I, col. 641, 9) and olive oil (Isid. IV 12,\
    \ 10. Diosc. I 51).\nBalsaninum, see above Vol. V, col. 2970.\nBalsam unguent, see above Vol. II,\
    \ col. 2838. The inferior wood balsam was boiled into the unguents (ibid. line 22ff. = Plin. XII 118).\n\
    Cinnamominum, according to Plin. XIII 15 the thickest unguent; the pound cost 35–300 denarii (Diosc.\
    \ I 61). Both types of cinnamon (see above Vol. III, col. 1637) were used with other substances for\
    \ various unguents (ibid. col. 1648, 50ff.), namely for expensive ones (Diosc. I 14, 4. Theophr. od.\
    \ 28, 29).\nCommagenum Plin. XXIX 55f., from the plant named after Commagene, perhaps Nardus Syriaca,\
    \ and goose fat, cinnamon, and white pepper (Dig. XXXIV 2, 21 § 1).\nCostum, rarely costus, a precious\
    \ unguent from the root of the eponymous Indian shrub, Costus arabicus L. (Plin. XII 41. Cels. III\
    \ 21. Horat. carm. III 1, 44. Prop. IV 6, 5. Lucan. IX 917). The root was also used for the marjoram\
    \ unguent (Theophr. od. 28).\nCrinon (Dig. XXXIV 2, 21 § 1) or susinum (Cels. V 21, 1; Plin. XIII\
    \ 11), mainly from the blossoms of the lily (see above Vol. VII, col. 793, 8ff.).\nGlaucinum (Mart.\
    \ IX 26, 2), according to Dig. XXXIV 2, 21 § 1 a cosmetic and medicinal unguent, from the juice of\
    \ the glaucion, Chelidonium glaucium L., the great-flowered celandine (cf. Plin. XX 206. XXVII 83).\n\
    Gleucinum, according to Diosc. I 37 from the oil of unripe olives and various aromatics and must;\
    \ according to Colum. V 22, 1. Plin. XV 29 an oil to which, however, precious fragrances were sometimes\
    \ also added.\nThe Royal Unguent, already mentioned by Crates and Sappho (Athen. XV 690d e), was the\
    \ most excellent and costly unguent; according to Plin. XIII 18, it was manufactured for the Parthian\
    \ kings and consisted of 24 fragrances along with honey and wine.\nMalobathrum (Diosc. I 63), counted\
    \ by Pliny (XIII 14) among the more solid unguents, from the fragrant leaf of the Laurus Cassia (Plin.\
    \ XII 129. XXIII 98; cf. Kiessling on Horat. carm. II 7, 7. Sidon. carm. V 415. Cels. V 23. Cael.\
    \ Aurel. acut. III 3, 24; chron. VI, 12). In Rome, a pound of the oil cost 300 denarii (Plin. XII\
    \ 129).\nMelinum, oil from quinces (Diosc. I 45. Plin. XIII 11. XXIII 108), which became an unguent\
    \ through aromatic additives (Theophr. od. 26. 28. 31. Plin. loc. cit.); the best was supplied by\
    \ Cos (Plin. XIII 5).\nMendesium (Diosc. I 59, 3. Plin. XIII 5, 8. Athen. XV 688f.) was best supplied\
    \ by Egypt, as was\nthe Metopium, which mainly consisted of the oil of bitter almonds along with various\
    \ other ingredients (Plin. XIII 8, 5. Athen. XV 688f.). The name is said to derive from a tree called\
    \ metopon (Gum Ammoniacum) (Plin. XII 107), whose resin was a component of this unguent (Diosc. I\
    \ 59).\nMyrobalanum see Balaninum.\nThe Narcissinum (Diosc. I 53) was prepared from the leaves of\
    \ the narcissus (cf. above Vol. VII, col. 794f.); its production was later abandoned (Plin. XIII 6).\n\
    The Nardinum (Theophr. 28. 33. 38. 42) was one of the most excellent (Athen. XV 691) and expensive\
    \ unguents (Plin. XII 43ff.). According to Galen (XII 429. 601), a distinction was made between the\
    \ foliatum (Mart. XI 27, 9), which was very popular with Roman women, and the spicatum. The composition\
    \ of the former is found in Plin. XIII 15. Diosc. I 62. In Iuven. VI 465, foliatum probably refers\
    \ to a drinkable essence. Jesus was anointed with genuine nard (Ev. Marc. XIV 3. Joa. XII 3; cf. Hieron.\
    \ hom. in cant. I 4. Ambros. in Luc. VI 34).\nThe Panathenaicum always held its own in Athens (Athen.\
    \ XV 688f. Plin. XIII 6).\nThe Pardalium had fallen into oblivion; it was formerly native to Tarsus\
    \ (Plin. XIII 6).\nSampsuchinum, see Amaracinum (Diosc. I 48. Plin. XIII 10. XXI 163. Athen. XV 689c).\n\
    Stacte, the liquid part of myrrh resin, was considered a natural unguent and was very expensive (Diosc.\
    \ I 60. Plin. XIII 17. Theophr. 29. 44. Athen. XV 688d. 689b ff.).\nOn the Telinum, see above Vol.\
    \ III, col. 581, 30ff. Excellent telinum was supplied by Syria (Athen. XV 689a, d). In use at the\
    \ time of the comedian Menander, this unguent was later surpassed by megalium (Plin. XIII 13; cf.\
    \ Diosc. I 47. Tertull. pall. 4. Isid. IV 12, 7).\nThe manufacture of unguents and the brisk trade\
    \ associated with it, as already mentioned, originated in the Orient. Syria (Athen. XV 689a) and Egypt\
    \ (XV 688f.), especially Mendes (Plin. XIII 4) and Alexandria, where Arsinoë and Berenice, through\
    \ their fondness for fragrances, brought the unguent trade to prosperity (Athen. XV 689a), have always\
    \ been famous for their unguents. To this may be added Cyrene (Ath. XV 689a).\nTheophr. h. pl. VI\
    \ 6, 5; c. pl. VI 18, 3. Of Phoenicia (Plin. XIII 6), Sidon (Athen. XV 688f.) is specifically highlighted.\n\
    In mainland Greece, Athens (Athen. XV 688e f. Plin. XIII 6), Corinth (Plin. XIII 5), Elis (Diosc.\
    \ I 56, 3. Athen. XV 688e), and Aegina (Theophr. od. 27. Athen. XIII 14) were suppliers. In Italy,\
    \ Campania was the main region for unguent production, of whose extent the proverb Plus apud Campanos\
    \ unguenti quam apud ceteros olei fieri (More unguent is made among the Campanians than oil among\
    \ others) (Plin. XVIII 111) gives an idea, especially Capua, Naples, and Praeneste (Athen. XV 688e.\
    \ Plin. XIII 3). In Rome, at the time of Juvenal and Martial, Cosmus (Iuven. VIII 86 u. Schol. Mart.\
    \ I 87, 2. III 55, 1. 82, 26. IX 26, 2 et al.) and Niceros (VI 55, 3. X 38, 3. XII 65, 4) were the\
    \ most famous dealers of unguents and essences.\nCf. Büchsenschütz, Hauptstadt des Gewerbfleißes 94ff.;\
    \ Blümner, Gewerbliche Tätigkeit, see index under Salbenfabrikation.\nLiterature: Culmann Salben im\
    \ Morgen- und Abendland, Leipzig 1877. Sigismund Aromata.\n [Haug.]"
  body_markdown: "### German\nSalben. Die gewöhnlichsten Bezeichnungen für die kosmetischen S. sind μύρον,\
    \ unguentum. Nach Athen. XV 688c stammt μύρον von σμύρνη, das bei den Äolern statt μύρρα gebräuchlich\
    \ gewesen sei, weil die meisten S. mittels Myrrhe bereitet wurden. Zuerst findet sich μύρον bei Archilochos\
    \ (Athen. a. a. O. = frg. 31, 30 ἐσμιρισμένας Bergk). Wahrscheinlich ist μύρον ein semitisches Lehnwort\
    \ (hebr. mör, aram. mûrâ, arab. murr). Das υ von σμύρνη ist wohl nur Zusatz nach Analogie von σμικρός\
    \ u. a. (Kühner-Blass I² 76; Schrader Reallex. 566f.). Das lat. unguentum ist verwandt mit ai. anákti\
    \ (salbt, bestreicht, schmückt), añjanam (Salbe), ahd. ancho (Butter), mhd. anke, nhd. (schwäb. alem.)\
    \ Anke (Walde Lat. Etym. W.² 851). Der gemeine Mann bediente sich in der ältesten Zeit, bevor Öl und\
    \ ausländische Parfüme bekannt waren, der Butter zum Salben, wie Hekataios von den thrakischen Paionern\
    \ erwähnt (Athen. X 447d), ein Gebrauch, den Sidonius Apollinaris XII 7 noch bei den Burgundionen\
    \ vorfand (Schrader 121, 567). Die Römer nannten die eigentlichen Parfümerien zuerst unguenta exotica\
    \ (Plin. XIII 24). Andere Bezeichnungen sind ἄλειμμα (vgl. Corp. gloss. lat. II 211, 2. 225, 5), χρῖμα,\
    \ χρῖσμα (Diosc. I 19, 2 Wellm.), μύρωμα (Arist. Eccl. 1117), doch werden sie, wie auch unguentum,\
    \ für die verschiedenen Öle, Fette und Essenzen gebraucht. Χρῖμα bezeichnet sehr oft die medizinische\
    \ Salbe (vgl. Diosc. I 8, 3. 21. 66, 3; Aristid. XLIX 21ff. Keil). Im Gegensatz zu μύρον steht es\
    \ Xen. anab. IV 4, 13, wo es Fett bedeutet. Sich salben heißt bald ἀλείφεσθαι, μυρίζειν (Lukian. Luc.\
    \ 31), bald χρίεσθαι (ebd. 12). Zum Unterschied von den flüssigen Ölen στακτά (Arist. Plut. 529) oder\
    \ ψακτά werden die S. παχέα, odores genannt (Athen. II 46a, Theophr. de odor. 39, Plin. XIII 7; vgl.\
    \ Sprengel zu Diosc. 367), während μύρον und unguentum beide Begriffe umfassen. Bei Diosc. I 43, 3\
    \ u. ö. steht μύρον für ἔλαιον (Blümner Technol. I² 359).\nDie alten Völker liebten es, den Körper\
    \ mit allerlei Ölen und S. einzufetten. Da diese Sitte bei den südlichen Völkern besonders beobachtet\
    \ wird, mußte ein gewisses Bedürfnis danach vorliegen (vgl. Sigismund Aromata 57). Jedenfalls hielt\
    \ man das S. mit Öl für gesund (Plin. XIV 150. XXII 114 intus mulso, foris oleo). Nach Athen. I 24d\
    \ salbte man sich, damit die Leiber nicht, nachdem das Wasser des Bades vertrocknet war, zu sehr verhärteten.\
    \ Wohlriechende S. zu verwenden, ist orientalische Sitte. Das Morgenland ist die Heimat der aromatischen\
    \ Pflanzen. Dort gelang es zuerst, den flüchtigen Wohlgeruch an Fette und Öle zu binden und duftende\
    \ S. zu bereiten. Sie dienten dazu, den unangenehmen Geruch der starken Ausdünstung, die durch die\
    \ große Hitze bedingt war, zu beseitigen (vgl. Plin. XIII 3). Je mehr diese Wohlgerüche gefielen,\
    \ um so zahlreicher wurden ihre Arten, um so verbreiteter ihr Gebrauch. Daß die Babylonier sie schon\
    \ üppig zur Salbung des ganzen Körpers gebrauchten, bezeugt Herodot I 195. Ob sie die S. selbst erfanden\
    \ oder ihre Bereitung von den Ägyptern lernten, wird kaum zu entscheiden sein. Sigismund 61. 65 hält\
    \ die Ägypter für die Erfinder. Bei ihnen lernten wahrscheinlich die Israeliten die S. kennen, von\
    \ denen sie im Kultus (Exod. XXX 25) — Moses ließ auf Gottes Geheiß durch S.-Mischer aus verschiedenen\
    \ Aromaten ein heiliges Salböl bereiten — und im täglichen Leben reichlich Gebrauch machten (vgl.\
    \ das Hohelied Vulg. I 2. 3. IV 10. 14. Vulg. Ecclesiast. XXIV 20ff. Ev. Luc. VII 37f. Matth. XXVI\
    \ 7ff. Joh. XII 3). Auch die Lydier waren als S.-Liebhaber bekannt, was zu ihrer Weichlichkeit paßte\
    \ (Athen. XV 690b). Demnach waren nicht die Perser die Erfinder der Wohlgerüche, wie Plin. XIII 3\
    \ meint (vgl. Hor. carm. I 38, 1), sondern sie fanden sie bei der Eroberung Babylons vor und bildeten\
    \ sie zur höchsten Üppigkeit aus. Nach dem Buche Esther II 12 wurden die für den König bestimmten\
    \ Jungfrauen sechs Monate mit Myrrhenöl gesalbt und sechs andere Monate mit allerlei S. und Spezereien\
    \ behandelt, bevor sie zu ihm kommen durften. Artaxerxes schickte dem Antalkidas über Tafel den eigenen\
    \ Kranz, den er in die köstlichsten S. getaucht hatte, eine Gunstbezeigung, die jeden in Erstaunen\
    \ setzte (Plut. Artax. 22, Athen. II 48e). Bei der Eroberung von Damaskus fanden sich, wie Parmenio\
    \ dem Alexander berichtete, vierzig S.-Bereiter unter dem gefangenen Trosse des Großkönigs (Athen.\
    \ XIII 608a). Ebenso erbeutete Alexander im Lager des Dareios bei Issus eine kostbare Kassette mit\
    \ S. (Diog. L. IX 1. Plin. XIII 3. VII 108). Im Badezimmer traf er goldene S.-Flaschen, und das Gemach\
    \ duftete von Aromaten (Plut. Alex. 20). S. fanden auch die Zehntausend auf ihrem Rückzug in Armenien\
    \ (Xen. anab. IV 4, 13).\nAus dem Morgenland kam mit dem Namen auch der Gebrauch von Parfümen zu den\
    \ Griechen. Schon Homer hatte Kenntnis davon, obwohl man sich sonst zu seiner Zeit mit Öl salbte (Athen.\
    \ XV 688d). Aphrodite salbt Hektors Leiche mit duftendem Rosenöl (Hom. Il. XXIII 186) und Hera sich\
    \ selbst mit einem wohlriechenden Öl (Il. XIV 172). Zur Zeit des Archilochos und Alkaios war das S.\
    \ bereits im Schwang (Athen. XV 688c. 687d = Alk. frg. 36 B.), ebenso rühmt es Anakreon (ebd. 687c\
    \ = frg. 9). Zwar war es als Mittel zur Verweichlichung vielfach verachtet, während der Gebrauch des\
    \ Öles, das man in den Gymnasien verwendete, als Zeichen der Männlichkeit galt (Xen. sympos. II 3).\
    \ Darum stellt Sophokles die Aphrodite und Athene einander gegenüber, die eine der S., die andere\
    \ des Öles sich bedienend (Athen. XV 687c = frg. 334 N.).\nAuch die Soldaten Xenophons benutzten nur\
    \ im Notfalle Fette und S. statt des Olivenöls (Xen. anab. IV 4, 13). Gesetzgeber, wie Solon und Lykurg,\
    \ verboten den Verkauf der S. (Athen. XIII 612a. XV 687f), und die Lakedaimonier verwiesen die S.-Bereiter\
    \ des Landes (ebd. 686f. Sen. nat. quaest. IV 13, 8). Noch Sokrates hielt eine strenge Strafrede gegen\
    \ das Parfümieren (Xen. symp. II 3), und Chrysipps Definition von μύρον beweist ebenfalls seine Geringschätzung\
    \ der Wohlgerüche (Athen. 686f). Trotzdem fand man die Parfüme so angenehm, daß Aristipp sich beklagt,\
    \ daß die Verweichlichten sie so in Mißkredit gebracht haben (Sen. de benef. VII 25, 1).\nÄhnlich\
    \ ging es bei den Makedoniern, die in Persien mit dem S.-Luxus bekannt wurden und sich ihm bald ergaben,\
    \ obwohl Alexander die Seinen tadelte, die zum Einreiben und zum Bade S. statt Öl benutzten, und Verweichlichung\
    \ davon fürchtete (Plut. Alex. 40). In der Folgezeit wurde die S.-Verschwendung in Griechenland und\
    \ Makedonien nur um so ärger, da sich übrigens schon früh Verteidiger gefunden hatten, die die S.\
    \ anregend für die Tätigkeit des Hirnes und Herzens nannten (Athen. XV 687d ff.).\nIn Athen ließen\
    \ sich die Schwelger fast jeden Körperteil mit einer besonderen S. einreiben, mit ägyptischer Füße\
    \ und Schenkel, mit phönizischer Kinnbacken und Brust, mit sisymbrischer den Arm, mit Amarakus-S.\
    \ Haar und Augenbrauen, mit Serpyllon-S. Knie und Nacken (Athen. XV 689e), und ein Vers rühmt das\
    \ angenehme Gefühl, das das S. durch schöne, weiche Hände hervorbringe (Athen. XII 553e). Man hielt\
    \ es für reizend, von S. zu glänzen. Um verführerischer auszusehen, färbte sich Demetrios Phalereus\
    \ das Haupthaar gelb und salbte das Gesicht und den ganzen Körper (Athen. XII 542d). Bei seinen Gastmählern\
    \ wurden die Gäste von der Decke her mit Wohlgerüchen besprengt (ebd. 542c). Ebenso wurden am syrischen\
    \ Hofe die Kränze der Gäste vor dem Trinkgelage durch herumgehende Diener aus kleinen Schläuchen mit\
    \ babylonischer S. benetzt (Athen. XV 692c). Bei dem Hochzeitsmahl des Makedoniers Karanos erhielt\
    \ jeder der zwanzig Teilnehmer nach jedem Gang ein silbernes und ein goldenes Gefäß mit S., eine Kotyle\
    \ (ca. ¼ l) enthaltend, zum Geschenke (Athen. IV 129a ff.). Bei dem prunkvollen Aufzug des Antiochos\
    \ Epiphanes zogen auch zweihundert Frauen mit, die aus goldenen Gefäßen Wohlgerüche sprengten (Athen.\
    \ V 195b). Darauf wurden im Gymnasium fünf Tage lang alle aus fünfzehn großen goldenen Gefäßen mit\
    \ Krokus-S. und aus ebenso vielen mit Zimt- und Narden-S. eingerieben. Ähnlich wurden an den folgenden\
    \ Tagen andere S. gebraucht (Athen. ebd. 195d). Welchen Luxus man mit den Parfümen trieb und wie sehr\
    \ man darauf erpicht war, zeigt die Anekdote von dem König Antiochos Epiphanes (Athen. ebd. 196b).\n\
    Wann die S. zu den Römern kamen, weiß Plinius nicht zu berichten, nur daß im J. 565 d. St. nach dem\
    \ Kriege mit Antiochos die Censoren den Verkauf der unguenta exotica verboten (Plin. XIII 24. Sol.\
    \ XLVI 2), was auf eine schon ziemliche Verbreitung schließen läßt. Jedenfalls waren sie nicht erst\
    \ mit dem übrigen asiatischen Luxus nach Italien gekommen, sondern schon vorher in Großgriechenland\
    \ und Capua Mode gewesen. Aus den Rosen der campanischen Ebene bereitete man in Neapel und Capua ein\
    \ ausgezeichnetes Öl (Athen. XV 688e). Letztere Stadt war besonders durch ihre Parfüme berühmt (s.\
    \ o. Bd. III S. 1558, 32ff.); dorthin wurden orientalische Spezereien eingeführt (Plaut. Rud. 630f.).\
    \ Das Verbot der Censoren nützte in Rom nichts. Das Parfümieren wurde in den höheren Ständen als ein\
    \ tägliches Bedürfnis empfunden und gehörte zum guten Tone (Plin. XIII 3). Nach Sen. ep. LXXXVI 13\
    \ salbte man sich bisweilen mehrmals am Tage, damit der Wohlgeruch nicht ausging. Man brauchte S.\
    \ voluptatis causa et valetudinis (Dig. XXXIV 2, 21 § 1. XV 3, 3 § 6 ad luxuriae materiem).\nDie Römerinnen\
    \ wandten Wohlgerüche so reichlich an, daß eine vorübergehende Frau durch die ausströmenden Düfte\
    \ sich auch denen bemerkbar machte, deren Aufmerksamkeit anderweitig in Anspruch genommen war (Plin.\
    \ XIII 20). Ähnlich sagt Lukian Amor. 10 von den Frauen, daß sie den Reichtum der Männer für ihr Haar\
    \ verschwenden, und ganz Arabien dufte aus ihren Haaren. Nach Mart. XIV 59 liebten Männer und Frauen\
    \ Parfümerien, erstere besonders Balsam und Zimt (Iuven. II 41. Mart. III 55, 4). Der Günstling Domitians,\
    \ Crispinus, duftete schon am Morgen stärker als zwei Leichenbegängnisse (vgl. Friedländer Sittengesch.\
    \ III⁶ 89). Plutarch berichtet ebenfalls von der S.-Verschwendung, die er als unmännlich verurteilt,\
    \ und bemerkt, die Männer wollten nicht einmal bei ihren Frauen schlafen, wenn sie nicht von S. dufteten\
    \ (Moral. 99l = Teubn. VI 94). Derselbe erzählt einen Vorgang, der selbst in dem schwelgerischen Rom\
    \ Aufsehen erregte (Galb. 19): Otho habe bei einem Gastmahl zu Ehren Neros die Gäste aus goldenen\
    \ und silbernen Röhren mit den kostbarsten S. übergießen lassen. Plinius sah selbst Fußsohlen einsalben,\
    \ was Otho dem Nero gezeigt habe (XIII 22). Petron. 70 bezeichnet es als unerhört, daß Trimalchio\
    \ seinen Gästen die Füße salben und bekränzen ließ. Von demselben unguentum wurde dann ein Teil in\
    \ das Weingefäß und in die Lampen gegossen. Caligula gebrauchte zum Bade kalte und warme Parfüme (Suet.\
    \ Calig. XXXV 1) und ließ die Badwanne mit Balsam besprengen (Plin. XIII 22), was ihm ein Sklave Neros\
    \ nachmachte, damit solches nicht bloß als Vorrecht der Fürsten erscheine. Privatleute besprengten\
    \ sogar die Wände der Badestuben mit Wohlgerüchen (Plin. a. a. O.). Beim Gastmahl des Trimalchio steigt\
    \ von der Decke ein gewaltiger Reifen mit goldenen Kränzen und S.-Flaschen herab als apophoreta für\
    \ die Gäste (Petron. 60). Es gab sogar Kuchen und Früchte, die mit Safranessenz gefüllt waren und\
    \ sie beim leisesten Drucke ausspritzten (ebd.). Ernste Männer, wie Scipio Africanus min., verurteilten\
    \ das tägliche Parfümieren (Gell. VI 12, 5) vor dem Spiegel. Er enthielt sich des S. (Sen. ep. LXXXVI\
    \ 11), wie auch Seneca (ep. CVIII 16), der sich aufs schärfste dagegen wendet (ep. LXXXVI 13. CXXII\
    \ 33; dial. VII 7, 3). Auch Cicero macht sich lustig über die Stutzer, die von S. glänzten (Catil.\
    \ II 5) und troffen (in Pis. 25f.).\nReichliche Verwendung fanden die S. bei der comissatio. Zu ihrer\
    \ Eröffnung gehörte nebst anderem das Verteilen von Kränzen und S. (Athen. IX 408e. X 409e. XV 665c).\
    \ Später leiteten Kränze und S. auch den Nachtisch ein (Athen. XV 685c. Nep. Ages. 8). Die Römer übernahmen\
    \ die griechische Sitte (Catull. XIII 11ff.), daher die häufige Erwähnung der S. bei den Dichtern,\
    \ besonders bei Horaz carm. II 3, 13. 7, 7. 22, 11, 16f. III 1, 44. 29, 4. IV 12, 17; epod. XIII 8;\
    \ ars poet. 375; vgl. Mart. III 12, 4. IV 19, 20. Iuven. XI 122. Cic. Tusc. V 62. Auch bei den Mahlzeiten\
    \ der Arvalbrüder wurden S. und Kränze verteilt (Acta fr. Arval. 27V. 218. 171V. 241. S. Henzen 13.\
    \ 27. 39). Bei Petron. 60 wird vor dem Nachtisch ein Ring mit Kränzen und S.-Fläschchen von der Decke\
    \ heruntergelassen, letztere als apophoreta. Nach dem Nachtisch tragen Sklaven S. herein und salben\
    \ die Füße der Gäste (Petron. 70). Beim Hochzeitsmahl des Karanos findet wiederholt Verteilung von\
    \ S. statt. Zu Anfang des Mahles bringen rhodische Tänzerinnen jedem Gaste je eine silberne und goldene\
    \ S.-Flasche (Athen. IV 129a); solche erhalten die Gäste noch zweimal (ebd. 129c), das drittemal beim\
    \ Übergang zur comissatio (129e). Hohe Gastgeber pflegten den Gästen auch Kränze und S. zuzusenden\
    \ (Plut. Artax. 22. Sen. IV 33, 4 von Caligula). Am syrischen Hofe kamen nach der Verteilung der Kränze\
    \ Diener herein und besprengten aus kleinen Schläuchen die Kränze der Zecher (Athen. XV 692c). Eine\
    \ noch raffiniertere Art, die Gäste mit S. zu benetzen, wird bei Athen. XV 691d erzählt. Man ließ\
    \ Tauben in Essenzen tauchen und nachher im Saal herumfliegen. Bestimmt waren die S. bei Tische für\
    \ die Haare. So kommt Habinnas von einem Gelage mit Kränzen beladen, während S. über seine Stirne\
    \ läuft (Petron. 65). Auch Christi Haupt wurde beim Mahle gesalbt (Ev. Matth. XXVI 7. Marc. XIV 3),\
    \ sogar seine Füße (Ev. Joan. XII 3. Luc. VII 38), was sonst als etwas Außergewöhnliches galt (Petron.\
    \ 70. Plin. XIII 22). Wenn etwa S.-Flaschen den Gästen als apophoreta gegeben wurden (Petron. 60),\
    \ so sollten sie zunächst bei der bald beginnenden comissatio dienen und zeigen, daß das Mahl sich\
    \ dem Ende nähere.\nSo heißt es auch in den Acta arval. vom 27. Mai 218: post epulas ... unguenta\
    \ et coronas acceperunt. Philonides περὶ μύρων καὶ στεφάνων gab als Grund für den Gebrauch der S.\
    \ beim Symposion die Abkühlung des erhitzten Kopfes an. Anfangs habe man das Haupt eingefettet, mit\
    \ der Steigerung des Wohllebens habe man zu den S. gegriffen. Man solle nur solche gebrauchen, die\
    \ den Kopf am wenigsten beschweren (Athen. XV 692 a).\nZur Toilette salbte man mit Vorliebe die Haare,\
    \ teils des Wohlgeruchs halber, teils um ihnen ein glänzendes Aussehen zu geben (Horat. carm. II 7,\
    \ 8. Cic. Catil. II 5. Mart. XII 38, 3). Wie reichlich man die Parfüme dabei verwendete, zeigt der\
    \ Umstand, daß oft vom Triefen der Haare die Rede ist (Cic. in Pis. 25. Tibull. I 7, 51. Ovid. her.\
    \ XX 161. 166). Hetären salbten sich, um zu gefallen (Plaut. Truc. 288ff.), sogar ergraute Liebhaber\
    \ taten dies, was ihnen zum Vorwurf gereichte (Plaut. Cas. 226ff.), denn von alten Leuten nahm man\
    \ an, daß sie sich nicht salben (Athen. XV 688c = Archiloch. frg. 31 B.). Eher begreiflich ist, daß\
    \ sich der Bräutigam zur Hochzeit salbte (Catull. LXI 142). In römischer Zeit brauchte man sogar S.,\
    \ um sich die Glatze zu bemalen (Mart. VI 57, 1ff. 74, 2) oder die Haare zu färben (s. o. Bd. VII\
    \ S. 90, 31ff.). Bei Mart. III 62, 28 heißt Haar-S. capillare (vgl. Blümner Röm. Privataltert. 275,\
    \ 8). Aristoteles schrieb dem regelmäßigen Parfümieren der Haare das Weißwerden zu, weil S. die Haare\
    \ austrockneten (Athen. XV 692b). Empfohlen wurde schon von Alkaios frg. 36 B. und Anakreon frg. 9\
    \ das S. der Brust, als Sitz des Herzens und der Seele, um diese zu beleben (Athen. XV 687c). Haare\
    \ und Brust werden bei Archilochos, der zuerst die S. nennt, erwähnt (ebd. 688c). Daß Weichlinge übrigens\
    \ den ganzen Körper (Lukian. Lexiph. 8 und Schol.) salbten und für die einzelnen Teile verschiedene\
    \ S. als besonders zuträglich bezeichneten, wurde bereits gesagt (Athen. XII 553c. XV 689e ff.). Auch\
    \ nach dem Bade verwendete man S. (ebd. XV 690c), teilte den Baderäumen (Plin. XIII 22) und dem Badewasser\
    \ (Schol. Iuven. VIII 83) und der Wäsche Wohlgerüche mit (Mart. VII 3, 10. Clem. Alex. Paedag. II\
    \ 8, 207 Pott.). Vom S. der Nase spricht Prop. III 10, 21.\nNicht bloß äußerlich, auch innerlich wollte\
    \ man die S. genießen (Plin. XIII 25). Wie man Aromate dem Wein zusetzte, so auch S., um den Geschmack\
    \ zu erhöhen (Theophr. de od. 9. 67). Den Speisen konnte man sie nicht wohl zufügen, ohne sie bitter\
    \ zu machen (ebd. 10). Bei Athen. XV 689e werden verschiedene Parfüme als geeigneter Zusatz zum Getränk\
    \ oder als gut für den Magen und die Verdauung erwähnt. Mehrfach sprechen die Schriftsteller der Kaiserzeit\
    \ von der Unsitte, dem Wein S. beizumischen (Plut. moral. 149B. Plin. XIII 25. Petron. 70. Lukian.\
    \ Nigrin. 31). Iuven. VI 303 brandmarkt dies als Üppigkeit und Ausschweifung. Daß man in der römischen\
    \ Welt mit S. sogar die Speisen verdarb, beweist ein Vorfall aus dem Leben Caesars, dem ein Freund\
    \ in Mediolanum Spargel vorsetzen ließ, der statt mit Öl mit S. zubereitet war und natürlich sehr\
    \ unangenehm zu genießen war (Plut. Caes. 17).\nDer Gebrauch der S. wurde von Lebenden auch auf die\
    \ Toten ausgedehnt (Plin. XIII 3). Schon bei Homer wird die Leiche des Patroklos mit Öl gesalbt und\
    \ seine Wunden mit Tierfett gefüllt (Hom. Il. XVIII 350). Achilleus legt auf den Scheiterhaufen große\
    \ Krüge mit Honig und ἄλειφαρ (Il. XXIII 170; vgl. Hehn Kulturpflanzen⁶ 105). Die Salbung der Leichen\
    \ geschieht Erwähnung bei Arist. frg. 445 a D. Schol. Plat. Hipp. min. 368c. Nach Lukian de luctu\
    \ 11 salbte man die Leiche mit der besten S., um ihre Zersetzung zu verhindern oder zu verlangsamen.\
    \ In Athen stellte man neben den ausgestellten Toten S.-Gefäße, λήκυθοι (Arist. Eccl. 538. 1032).\
    \ Bei den Römern wurden die Leichen ebenfalls nach der Waschung gesalbt (Stat. Silv. II 1, 160. Pers.\
    \ III 104 und Schol. Ovid. ex Pont. I 9, 52f. Serv. Aen. VI 219. Apul. Florid. 19. Plin. ep. V 16,\
    \ 7. Val. Max. VII 7, 4. Ammian. Marc. XIX 1, 10). Das besorgte ein weibliches Mitglied der Familie\
    \ oder die Dienerschaft oder der pollinctor (s. d.). Als Parfüme für die Bestattung werden amomum\
    \ (Ovid. ex Pont. I 9, 52), myrrha und casia (Mart. X 97, 2. XI 54, 1) genannt. Trimalchio bestimmte\
    \ zum voraus die S. für seine Leiche (Petron. 77). Selbst der Scheiterhaufen wurde mit S. und Spezereien\
    \ reichlich überschüttet (Stat. Silv. III 3, 131), so daß sogar Diebstähle dabei vorkamen (Mart. XI\
    \ 54, 1ff.). Bei der Bestattung der Annia Priscilla erfüllten Safran, Myrrhe und Balsam die Luft (Stat.\
    \ Silv. V 1, 210ff.). Auch Iuven. IV 109 weist auf die Verschwendung von S. bei Leichenfeiern hin.\
    \ Um den Toten oder dessen Familie zu ehren, sandte man auch Wohlgerüche zur Bestattung (Plut. Cat.\
    \ min. 11; vgl. Friedländer Sittengesch.⁸ 131. Blümner Röm. Privataltert. 484f.). Nach Dig. XI 7,\
    \ 37 sind in den Leichenkosten auch die S. inbegriffen. Man legte S.-Fläschchen in die Grabkammern\
    \ (s. o. Bd. III S. 358, 45). Solche kleine Glasgefäße, früher Lacrimatorien genannt, fand man in\
    \ Gräbern aufgehängt (Marquardt Privatl. d. Römer 368, 4. Blümner Röm. Privataltert. 501, 15. Mau\
    \ Pomp. in Leben und Kunst² 449). Man ließ auch Kränze und S.-Fläschchen auf Grabdenkmälern anbringen\
    \ (Petron. 71). Nicht aus Luxus, sondern aus religiösen Gründen brachten die Griechen am Jahrestag\
    \ der Schlacht von Plataiai unter andern Totenspenden auch S. zu den Begräbnisplätzen, mit denen der\
    \ Archon die Grabstelen bestrich (Plut. Aristid. 21).\nWie die Israeliten S. zu religiösen Zwecken\
    \ verwendeten (s. o.), so gebot in Rom der Kultus, Götterbilder zu salben (Marquardt–Mommsen St. V.\
    \ III 334. 434. Lipsius Excurs. ad Tac. ann. I 124. Marini Atti II 394). Nach Plin. XXXIII 112 rührte\
    \ es von einer anderen alten nannten religiösen Sitte her, beim Triumphschmaus die S. mit Mennig zu\
    \ vermischen. In den Akten der Arvalbrüder ist ebenfalls von der Salbung der Götterbilder die Rede\
    \ (s. o. Bd. II S. 1475ff.). Über das Zeremoniell der Arvalbrüder vgl. CIL VI 2104. Henzen Acta 10ff.\
    \ Roscher Myth. Lex. I 970ff. In Segesta salbten Frauen und Jungfrauen das Bild der Diana (Cic. Verr.\
    \ II 4, 77). Plin. XIII 23 wundert sich, daß sogar die Adler und Feldzeichen an festlichen Tagen gesalbt\
    \ wurden. Die Salbung mit Öl und Wohlgerüchen war eben von jeher eine Ehrung (Sigismund Aromata 58.\
    \ 73). Auch zu abergläubischen Zwecken dienten S. Lukian Luc. 12 weiß von einer Hexen-S. zu berichten,\
    \ wodurch sich die Hexe in einen Nachtraben verwandelt. Wahrscheinlich liegt auch Aberglaube zu Grunde,\
    \ wenn ein Liebhaber die Türe seiner Geliebten salbt, um letztere zu versöhnen (s. o. Bd. I S. 1728,\
    \ 21).\nDie S. der Alten entsprechen zum größten Teil nicht denjenigen, die in unseren Apotheken bereitet\
    \ werden. Zwar verstand man es auch, tierische Fette von festerer Konsistenz zu parfümieren und so\
    \ unseren Pomaden ähnliche Präparate herzustellen. Meistens wurden jedoch zu den parfümierten Gemischen\
    \ der Alten Pflanzenöle genommen (Sigismund 73). Eine Vorschrift, tierische Fette zur Aufnahme aromatischer\
    \ Stoffe geeignet zu machen, gibt Dioscorides II 76ff. Wellm. Man reinigte Rinderfett, Hirschfett\
    \ und das Mark der Tiere von allen Häuten, schmolz es in einem neuen Gefäß mit ein wenig Salz. Dann\
    \ wusch man dieses Gemisch durch Reiben mit den Händen in reinem Wasser aus, unter öfterer Erneuerung\
    \ des Wassers. Darauf kochte man es mit gleichen Teilen wohlriechenden Weines und ließ es eine Nacht\
    \ zusammenstehen. Am nächsten Tage folgte erneutes Kochen mit wohlriechendem Wein, was man so lange\
    \ wiederholte, bis das Fett allen unangenehmen Geruch verloren hatte und man es mit wohlriechenden\
    \ Stoffen vereinigen konnte. Ähnliche Vorschriften, das Fett von Vögeln, besonders Gänsen, durch Zusatz\
    \ von Aromaten wohlriechend zu machen, gibt Diosc. a. a. O. II 76, 13ff. Wellm. Aus Gänsefett und\
    \ Aromaten wurde das Commagenum, das zugleich Parfüm und Heilmittel war, hergestellt (Plin. XXIX 55.\
    \ XXXVII 204). Sonst unterschied man bei der Herstellung der S. das aus den Pflanzen gewonnene ätherische\
    \ Öl, sucus, und das Fett, corpus, das meistens aus Früchten ausgepreßt war, wie Oliven-, Nuß-, Mandelöl\
    \ (Plin. XIII 7). Dieses Fett bildete den Körper der S. und hieß bei den Griechen στῦμμα, στυπτικόν\
    \ und das Verfahren στῦψις (Diosc. I 6. 19, 5. 20, 1. 2 u. 3. Theophr. de od. 21. 32. 60 u. ö.). Die\
    \ flüchtigen Pflanzenöle, die mit jenen Stoffen verbunden wurden und den S. den Wohlgeruch verliehen,\
    \ hießen ἡδύσματα (Plut. Ant. 24. Hippocr. II 866. Plin. XIII 7). Zu den Hauptbestandteilen der S.,\
    \ corpus und sucus, kamen oft noch Färbemittel hinzu, wie Zinnober, Safran, Ochsenzunge (s. o. Bd.\
    \ II S. 2111), flos salis (Plin. XIII 1, 9. 10. XXXI 91). Nach Theophr. de od. 31 wurden die Amarakus-,\
    \ Rosen- und Megalium-S. gefärbt. Von den kostbaren blieben ungefärbt die ägyptischen, die Kypros-\
    \ und Quitten-S. Die beiden ersten sollten weiß sein, die letztere die Farbe der Quitten haben. Außerdem\
    \ färbte man die wohlfeilen nicht, weil das Zusetzen von Farbe sich nicht gelohnt hätte. Um das Öl\
    \ zu konservieren, fügte man Salz hinzu (Diosc. I 43, 3. Plin. XIII 7). Oliven- und Mandelöl wurden\
    \ nämlich leicht ranzig und verdarben die Wohlgerüche. Hingegen hat das bei der S.-Bereitung geschätzte\
    \ Benöl (s. o. Bd. V S. 2070) die wertvolle Eigenschaft, nicht ranzig zu werden. Gummi und Harz wurden\
    \ bei der S.-Bereitung verwendet, um den Geruch, der sich schnell verflüchtigte, festzuhalten (Plin.\
    \ XIII 7). Denn die Alten scheinen sich noch nicht darauf verstanden zu haben, reine ätherische Öle\
    \ aus den betreffenden Pflanzenteilen auszuziehen, da sie unser Destillationsverfahren nicht kannten;\
    \ sie standen aber dieser Erkenntnis sehr nahe (Blümner Technol. I² 360, 2). Nach Diosc. I 58, 3 geschah\
    \ die Zumischung von Harz oder Gummi der Farbe und Verdickung wegen, und zwar wurden gebrannte Harze\
    \ dazu benützt (I 71, 6).\nEine Haupttätigkeit bei der S.-Bereitung war das Kochen, das bei der Herstellung\
    \ des corpus, bei der στῦψις, dem ὑποστύφειν, immer stattfand (Theophr. de od. 22), während die Öle\
    \ auf kaltem Wege hergestellt wurden (ψυχροβαφῆ) oder auf heißem (θερμοβαφῆ). Dieses Kochen mußte\
    \ im Wasserbade stattfinden, d. h. man setzte die Stoffe nicht unmittelbar dem Feuer aus, da der Verlust\
    \ dabei zu groß gewesen wäre und weil alles einen brenzlichen Geruch erhalten hätte, sondern man setzte\
    \ diese Gefäße in andere, die Wasser enthielten. Vorschriften über S.-Bereitung geben Theophrast de\
    \ od. 23ff., Plin. XIII 8ff., Diosc. I 43ff. Aus der Haupttätigkeit bei der S.-Bereitung, dem Kochen,\
    \ μύρον ἕψειν (Arist. Lysistr. 946 und sehr oft bei Diosc. u. a.), μυρεψεῖν (Aesop. fab. 122), ergaben\
    \ sich bei den Griechen als Benennungen dieses Gewerbes: μυρεψία (Arist. de insomn. II 13 p. 460a,\
    \ 27), μυρεψική (Theodos. gramm. 53, 28 Göttl. Athen. XIII 611f. Plut. quaest. conviv. IV 1, 2 p.\
    \ 661 C μυρεψικὰ φάρμακα), μυρεψός (Poll. VII 177. Plut. Pericl. 1. Theophr. hist. pl. IV 2, 6; caus.\
    \ pl. VI 11, 19, 3; de odor. 8 u. ö. Vgl. Cramer Anecd. Oxon. IV 248, 17), μυροποιός (Athen. XIII\
    \ 608 a. Poll. VII 177).\nHäufiger sind die den Handel mit S. ausdrückenden Bezeichnungen, wie μυροπωλεῖν\
    \ (Poll. VII 177), μυροπώλης (Xen. conviv. II 4. Athen. XII 552 f. XIII 612e. Poll. VII 177. Etym.\
    \ M. 595, 32), μυρόπωλις (Arist. Eccl. 841. Anth. Pal. V 180, 10), myropola (Plaut. Cas. 226; Trin.\
    \ 408. Naev. b. Fulgent. 565, 17), μυροπωλεῖον (Ps.-Demosth. XXV 52 p. 786. Lys. XXIV 20), μυροπώλιον\
    \ (Plut. Timol. 14. Poll. VII 177), myropolium (Plaut. Amph. 1011; Epid. 199).\nDoch bezeichnen diese\
    \ Ausdrücke manchmal den Fabrikanten. Das ist besonders im Lateinischen der Fall, wo unguentarius\
    \ (Cic. de off. I 150; ad Att. XIII 46, 2. Horat. sat. II 3, 228. Plin. XXXI 91. CIL IV 609. 2184.\
    \ VI 845. 999ff. 1974. 5638. 5681. 9998–10005. 10007 institor unguentarius. IX 171. 5905. X 3968.\
    \ 3974. 3975. 3979. 3982. 8264. XI 5839. XII 1594. XIII 2602) sowohl den Fabrikanten als auch den\
    \ Verkäufer, und unguentaria sowohl die Technik (ars) (Plaut. Poen. 708. Apul. de dogm. Plat. II 9)\
    \ als den Verkaufsladen (taberna) bedeutet (Varro de l. l. VIII 55. Suet. Aug. IV 2. Sen. ep. CVIII\
    \ 4); vgl. Blümner Technol. I² 361; Röm. Privataltert. 436, 4. Marquardt Privatl. d. Römer 782).\n\
    Das Gewerbe der S.-Fabrikanten und -Händler war bei den Griechen und Römern verachtet (Theod. gramm.\
    \ p. 53, 28 Göttl. μικροτεχνία ἡ μυρεψική). Lysias wirft dem Sokratiker Aischines die μυρεψία als\
    \ eines Philosophen unwürdig vor (Athen. XIII 612a). Solon verbot den Männern das μυροπωλεῖν (Athen.\
    \ XV 687a), und die Spartaner vertrieben die S.-Händler als Ölverderber (Sen. nat. quaest. IV 13,\
    \ 8). Man freute sich an den Wohlgerüchen, verachtete aber das Gewerbe (Plut. Pericl. 1). Cic. de\
    \ off. I 150 rechnet es unter die sordidae artes und stellt die unguentarii den cetarii, lanii, coqui\
    \ gleich. Ähnlich drückt sich Sen. ep. LXXXVIII 18 aus (vgl. Plaut. Trin. 408. Horat. sat. II 3, 228).\
    \ Die S.-Läden waren ähnlich wie die Barbierstuben beliebte Sammelplätze für die attischen Müßiggänger\
    \ (Athen. XIII 612a. Lys. XXIV 20. Plaut. Amph. 1011; Epid. 199). Der jüngere Dionysos trieb sich\
    \ nach seiner Vertreibung in den Garküchen Korinths herum oder saß in der S.-Bude (Plut. Timol. 14).\
    \ Bei Petron. 74 ist der unguentarius herae proximae wohl ein Freigelassener oder Sklave, der von\
    \ seiner Herrin als institor einer S.-Bude eingesetzt war. Es scheint danach, daß die unguentarii\
    \ sich oft mit Vermittlung von Heiraten abgaben, da in ihren Läden vorzugsweise Frauen verkehrten\
    \ (vgl. Friedländer z. St. S. 348). Die S.-Händlerinnen standen nicht im besten Rufe (Arist. Eccl.\
    \ 841. Anth. Pal. V 180, 10). Sie werden auch auf Inschriften erwähnt (CIL VI 10006. X 1965).\nAuch\
    \ die pigmentarii (s. d.) verkauften neben Farbstoffen odores und unguenta und die im ganzen Reich\
    \ verbreiteten seplasiarii (s. d.). Mit den Wohlgerüchen trieben die S.-Händler viel Fälschung. Da\
    \ die morgenländischen Aromata sehr teuer waren, suchte man sie durch billigere Stoffe zu ersetzen.\
    \ Kniffe der S.-Händler erwähnt Theophr. de od. 45, 53 (Plin. XIII 19). Über die Verfälschung des\
    \ Balsams s. o. Bd. II S. 2838, 29ff.\nBei den hohen Preisen der S. lohnte sich allerdings das Fälschen.\
    \ Auch sonst muß bei dem großen Verbrauch das Gewerbe der unguentarii einträglich gewesen sein. Nach\
    \ Athen. XV 691a wurde in Athen die Kotyle (≈ 0,274 l) S. sehr teuer verkauft, für 5–10 Minen. Die\
    \ Evangelien bestätigen diese Angabe. Das Pfund Narde, womit Jesus gesalbt wurde, wurde auf 300 Denare\
    \ (1 Den. = 0,87 Mark, s. o. Bd. V S. 209, 63) veranschlagt (Ev. Joh. XII 3f. Marc. XIV 3ff.). Ein\
    \ hoher Preis, wenn nach Ev. Marc. VI 37 die Jünger 200 Denare für hinreichend halten, für mehrere\
    \ tausend Menschen Brot zu kaufen. Martial XII 65 überlegt, ob er seiner Phyllis zehn Gelbe aus der\
    \ Münze des Kaisers — 210 Mark — oder ein Pfund aus den Läden des Cosmus oder Niceros schenken sollte\
    \ (vgl. Mart. XI 27, 9). Von der Narde kostete das Blatt 40–75 Denare das Pfund, und die öhricht 100\
    \ Denare das Pfund (Plin. XII 43ff.). Daher gehörte die Narden-S., das foliatum und spicatum, zu den\
    \ kostbarsten, 35–300 Denare das Pfund (ebd. XIII 15). Ein römisches Pfund Malabathrumöl kostete bis\
    \ 400 Denare (ebd. XII 129), Zimtsaft bis 1500 Denare (ebd. XII 99).\nAuf die Aufbewahrungsart scheint\
    \ man viel Gewicht gelegt zu haben. Die S.-Händler suchten dicht beschattete Räume zu Wohnungen aus,\
    \ damit nicht die Sonnenhitze die Wohlgerüche zerstöre (Theophr. de od. 40). Aus demselben Grund wählte\
    \ man zu S.-Gefäßen solche aus Blei (ebd. 41. Mart. VI 55, 3; s. o. Bd. III S. 562, 45) und Alabaster\
    \ (Plin. XIII 19). Besonders wurde der Alabastrites (s. o. Bd. I S. 1271f.; Blümner Röm. Privataltert.\
    \ 154; Sigismund 80ff.), der echte orientalische Alabaster und eine Varietät davon, Onyxmarmor, von\
    \ den Alten Onyx (s. d.) genannt, verwendet, der sich nach Plin. XXXVI 60 besonders gut für S. eignete.\
    \ Daher erhielten die S.-Gefäße den Namen alabastrum (s. o. Bd. I S. 1272, 57ff.) und onyx — der letztere\
    \ ist bei den Dichtern beliebt (Catull. LXVIII 83; Horat. carm. IV 12, 17; Prop. III 5, 14 [II 13,\
    \ 30]; IV 9 [III 10], 22; Mart. VII 94; XI 50, 6) — obwohl sie nicht immer aus diesem Material bestanden.\
    \ Man dachte eben mehr an die Form und an die Bestimmung als an den Stoff. Es gab auch solche aus\
    \ Glas und Ton. Gläserne S.-Fläschchen mit weißen Streifenornamenten auf bernsteinfarbigem Grunde\
    \ fanden sich in etruskischen Gräbern. Sie scheinen nicht geblasen, sondern in einer Form gegossen\
    \ zu sein (Marquardt Privatl. d. Römer 748, 5; 786, 2; s. o. Bd. VII S. 1386, 11; 1384, 48; 1388,\
    \ 9). Auch in Pompeii wurden S.- und Ölgefäße gefunden (Overbeck-Mau 451 Fig. 250,5. 452f. Fig. 251.\
    \ 252 h) aus Glas, Ton und Elfenbein. Goldene alabastra erwähnen Theokr. XV 114; Plut. Alex. 20. Bei\
    \ Athen. IV 86c werden Alabastergefäße neben goldenen S.-Gefäßen genannt. Für köstliche S. scheint\
    \ man überhaupt kostbare, kunstreich geformte Gefäße bestimmt zu haben. Beim Festzug des Antiochos\
    \ wurden Wohlgerüche aus goldenen Krügen, καλπίδες, gesprengt (Athen. V 195b; vgl. Polyb. XXXI 3,\
    \ 17), und nachher salbten sich die Teilnehmer an den Wettkämpfen aus goldenen Gefäßen, ὀλκίαι (a.\
    \ a. O. 195d). Goldene und silberne λήκυθοι schenkt Karanos seinen Gästen (Athen. IV 129b). Auch das\
    \ Gefäß, aus dem Jesus gesalbt wurde, heißt alabastron (Ev. Matth. XXVI 7; Luc. VII 37). Nach Ev.\
    \ Marc. XIV 3 wurde es zuerst zerbrochen und dann die S. auf das Haupt gegossen. Als S.-Gefäß wird\
    \ bisweilen auch die ampulla (Mart. III 82, 26; XIV 110), griech. λήκυθος (s. d.), die sonst Ölgefäße\
    \ waren, verwendet (Arist. Plut. 810; Eccles. 1101; Poll. VI 105; X 119; Athen. IV 129a). Bei Lucian.\
    \ Luc. 12 stehen die S.-Büchsen in einem Kästchen. Sehr kostbar war der S.-Schrein des Darius, der\
    \ mit Edelsteinen, Perlen und Gold geziert war (Plin. VII 108; XIII 3). Abbildungen von S.-Flaschen:\
    \ Stackelberg Gräber der Hellenen Taf. 38 = Múzik-Perschinka Kunst und Leben I. A. 136, 4; Gerhard\
    \ Ant. Bildw. 27, 2 = Roscher Myth. Lex. II 2455; Overbeck-Mau a. a. O.; Daremberg-Saglio I² 177;\
    \ Sigismund Aromata 85 Fig. c—e. Fig. e; Guhl-Koner⁶ 345f. Fig. 425–427.\nDie Bereitung der S. geschah\
    \ mit ausgesuchter Kunst, um sie möglichst pikant zu machen (Cic. de orat. III 99 = Plin. XIII 21;\
    \ vgl. Theophr. de od. 8, 25). Sie erhielten Schärfe durch costus und amomum, wurden dicker und angenehmer\
    \ durch Myrrhe, für die Medizin brauchbar durch crocus. Einige Fabrikanten begnügten sich, von den\
    \ teuren Stoffen nur etwas hinzuzuspritzen, nachdem das übrige abgekocht war, was natürlich Kraft\
    \ und Wert der S. herabminderte (Plin. XIII 16). Fälschung war ja nach Plin. XIII 17 an der Tagesordnung\
    \ (vgl. Theophr. 30). Die Namen der S. sind zahlreich. Sie rühren nach Plin. XIII 4 von ihrer Heimat\
    \ oder von den Bestandteilen und Pflanzen, oder sonstigen Umständen her. Bald waren diese, bald jene\
    \ S. in Mode, je nach den verschiedenen Stoffen und ihrer eigentümlichen Mischung, in der man erfinderisch\
    \ war. Auch gediehen die nötigen Aromata bald da, bald dort besser, bald schlugen sie aus der Art.\
    \ Theophr. 37 sagt, die Witterung, die richtige Zeit des Einsammelns oder Gewinnung und die Beobachtung\
    \ der Vollkraft der Pflanzen nach ihrer Gewinnung sei von großem Einfluss bei der Bereitung der S.\
    \ (vgl. ebd. 34). Manchmal erhielten die S. ihren Namen von dem Bestandteil, der ihnen den vorwiegenden\
    \ Geruch gab. Jedoch war das nicht immer der Fall (Diosc. I 42, 3). Von den Wohlgerüchen herrschte\
    \ der zuletzt beigemischte vor, und die S. wurden durch das Alter besser (Plin. XIII 19; Theophr.\
    \ 17).\nZu den haltbarsten gehörte die ägyptische S., das irinum, die Majoran- und Narden-S., und\
    \ vor allem die Stakte. Ein S.-Händler soll ägyptische S. von 8, und irinum von 20 Jahren gehabt haben\
    \ (Theophr. 38). Die S. wurden nach Theophr. hist. plant. IX 7, 3 aus den Blüten und Blättern, den\
    \ Sprösslingen und Wurzeln, dem Holze, den Früchten und dem Harze der wohlriechenden Pflanzen bereitet,\
    \ wofür er einzelne Beispiele anführt, ausgenommen für Harz und für die Sprösslinge. Am schwächsten\
    \ und wenigsten haltbar waren die aus den Blüten, die nach zwei Monaten am besten sind, nach einem\
    \ Jahr aber verderben (39. 67f.); zu den stärksten gehörten die ägyptische und Majoran-S. und das\
    \ megalium (55). Eine S. für sich, ohne weitere Zusammensetzung, war die Stakte (29), die anderen\
    \ waren mehr oder weniger zusammengesetzt. Eine der ersten und einfachsten bestand nach Plin. XIII\
    \ 8, ohne dass er ihren eigentlichen Namen angibt, aus bryon und Behenöl (vgl. Diosc. I 21). Die am\
    \ meisten erwähnten kosmetischen S., die auch zu Heilzwecken verwendet wurden, sind:\nDie ägyptische\
    \ S., die aus mehreren Stoffen bestand, von denen Theophr. 28 Zimt und Myrrhe nennt, und zu den kostbarsten\
    \ (30) gehörte, nicht gefärbt war, weil man ihre weiße Farbe erhalten wollte (31), und sehr dauerhaft\
    \ war (38). Von ihrer Verwendung spricht Athen. II 66c. XII 553d.\nDie Majoran-S., amaracinum, s.\
    \ o. Bd. I S. 789, 31f.\nAmomumbalsamum (Ovid. ex Pont. I 9, 52. Pers. III 101. Mart. V 64, 3), sonst\
    \ wurde Amomum (s. o. Bd. I S. 1873, 46ff.) den köstlichsten S. beigemischt (Diosc. I 15, 2). \nDas\
    \ Anethinum wurde aus Dill (s. o. Bd. I S. 641, 9) und Olivenöl bereitet (Isid. IV 12, 10. Diosc.\
    \ I 51). \nΒακκάρινον s. o. Bd. II S. 2686.\nBalsaninum s. o. Bd. V S. 2970.\nBalsam. S. s. o. Bd.\
    \ II S. 2838. Der minderwertige Holzbalsam wurde mit unter die S. gekocht (ebd. Z. 22ff. = Plin. XII\
    \ 118).\nΒρένθειον Athen. XV 690 d; Etym. M. s. v. (s. o. Bd. III S. 2808, 37).\nCinnamominum nach\
    \ Plin. XIII 15 die dickste S.; das Pfund kostete 35–300 Denare (Diosc. I 61). Beide Zimtarten (s.\
    \ o. Bd. III S. 1637) wurden mit andern Substanzen zu verschiedenen S. verwendet (ebd. S. 1648, 50ff.),\
    \ namentlich zu kostbaren (Diosc. I 14, 4. Theophr. od. 28, 29).\nCommagenum Plin. XXIX 55f., aus\
    \ der Kommagene genannten Pflanze, vielleicht Nardus Syriaca, und Gänsefett, Zimt und weißem Pfeffer\
    \ (Dig. XXXIV 2, 21 § 1).\nCostum, selten costus, eine kostbare S. aus der Wurzel des gleichnamigen\
    \ indischen Strauches, Costus arabicus L. (Plin. XII 41. Cels. III 21. Horat. carm. III 1, 44. Prop.\
    \ IV 6, 5. Lucan. IX 917). Die Wurzel wurde auch zur Majoran-S. verwendet (Theophr. od. 28).\nCrinon\
    \ (Dig. XXXIV 2, 21 § 1) oder susinum (Cels. V 21, 1; Plin. XIII 11), hauptsächlich aus den Blüten\
    \ der Lilie (s. o. Bd. VII S. 793, 8ff.).\nCrocinum, Safran-S. (s. o. Bd. VII S. 796, 26ff. 818, 58.\
    \ Plin. XIII 5, 10. Paul. Aeg. VII 20 s. v. Diosc. I 54, 42. 63). Nur dem Namen nach waren das ὀνύχινον,\
    \ βουτύρινον, στυράκινον verschieden, die sonst ihrer Bereitung und Wirkung nach der Safran-S. gleichkamen\
    \ (Diosc. I 54, 2). Auch das crocomagma wurde medizinisch verwendet (Diosc. I 27. Plin. XX 139).\n\
    Cyprinum (Diosc. I 55, 49. Plin. XIII 5, 12), aus den Blüten des κύπρος, Lawsonia inermis L., bereitet\
    \ (s. o. Bd. VII S. 805, 14ff.).\nΔάφνινον, aus den Früchten des Lorbeers bereitet (Theophr. od. 28),\
    \ war billig und erregte Kopfweh (ebd. 42), bei Diosc. I 40. Plin. XIII 86 als Öl erwähnt.\nἘλάτινον\
    \ (Diosc. I 44), aus der ἐλάτη, der Palmfrucht (vgl. ebd. 109, 5). Die jungen Triebe der Palmen wurden\
    \ von den S.-Bereitern zur στύψις der S. verwendet (ebd. 109, 4). Plin. XII 134 versteht unter elate\
    \ fälschlich eine bestimmte Palmengattung, die Stoff zur S. liefert (Blümner Maximaltarif VI 40).\n\
    Glaucinum (Mart. IX 26, 2), nach Dig. XXXIV 2, 21 § 1 kosmetische und medizinische S., aus dem Safte\
    \ des glaucion, Chelidonium glaucium L., großblütiges Schöllkraut (vgl. Plin. XX 206. XXVII 83).\n\
    Gleucinum, nach Diosc. I 37 aus Öl von unreifen Oliven und verschiedenen Aromaten und Most, nach Colum.\
    \ V 22, 1. Plin. XV 29 ein Öl, dem aber auch zuweilen kostbare Wohlgerüche beigemischt wurden.\nἙρπύλλινον,\
    \ aus den Blüten des Quendels (Theophr. od. 27 = Athen. XV 689d. XII 553d).\nἩδύχρουν, auf Kos bereitet,\
    \ an Wirkung und Zubereitung der Majoran-S. gleich, aber noch wohlriechender als diese (Diosc. I 58,\
    \ 3. Gal. XIV 52. 306. 262). Bei Cic. Tusc. III 46 ist es ein Räucherwerk.\nIrinum, aus der Wurzel\
    \ der iris (s. o. Bd. VII S. 825, 46ff.), auch eine gute Arznei, sehr dauerhaft, deren Wohlgeruch\
    \ sich nicht rasch verflüchtigte (Theophr. od. 24. 28. 36. 38). Das beste wurde nach Diosc. I 56,\
    \ 3 in Perge und Elis gemacht, nach Plin. XXI 42 ehedem auf Leukas und in Elis, zu seiner Zeit aber\
    \ in Pamphylien und Kilikien; lange Zeit war das korinthische sehr beliebt (Plin. XIII 5 = Athen.\
    \ XV 688e). Nach Theophr. h. pl. IX 7, 3 war die iris, und zwar die illyrische, die einzige zu Aromaten\
    \ brauchbare Pflanze, Plin. XIII 18 erwähnt noch daneben die gallische Narde (vgl. Theophr. h. pl.\
    \ IX 7, 2. Athen. V 195d. XII 553a. Plin. XIII 14. Aet. I s.v. ἔλαιον ἴρινον = Nic. M. XVI 30. Paul.\
    \ Aeg. VII 20 s.v.).\nDie Könige-S., schon von Krates und Sappho erwähnt (Athen. XV 690d e), war die\
    \ ausgezeichnetste und kostbarste S.; sie wurde nach Plin. XIII 18 für die Partherkönige fabriziert\
    \ und bestand aus 24 Wohlgerüchen nebst Honig und Wein.\nΛευκόϊον (Theophr. od. 27 = Athen. XV 689),\
    \ aus den Blüten des λευκόινον (s. o. Bd. VII S. 788f.), auch Essenz zum Trinken (Athen. XV 689e).\n\
    Λιβανώτινον herzustellen war nur einem einzigen Fabrikanten in Pergamon gelungen (Athen. XV 689a).\n\
    Malobathrum (Diosc. I 63), von Plin. XIII 14 unter die solidiora unguenta gerechnet, aus dem wohlriechenden\
    \ Blatte der Laurus Cassia (Plin. XII 129. XXIII 98; vgl. Kiessling zu Horat. carm. II 7, 7. Sidon.\
    \ carm. V 415. Cels. V 23. Cael. Aurel. acut. III 3, 24; chron. VI, 12). In Rom zahlte man für das\
    \ Pfund Öl 300 Denare (Plin. XII 129).\nDas Megalium, μεγαλείον, μεγάλλειον, wurde nach seinem Erfinder\
    \ Μέγαλλος, einem Sizilier oder Athener, genannt (Athen. XV 690f.) und erfreute sich hohen Ansehens,\
    \ daher auch die Schriften des Erfinders vielfach erwähnt. Das berühmteste kam von Ephesus (ebd. 689a).\
    \ Plin. XIII 13 leitet den Namen von dem großen Ruf ab, den es genoß. Nach Diosc. I 58, 3 zeichnete\
    \ es sich durch einen starken Harzzusatz aus, seine Herstellung erforderte 10 Tage und Nächte und\
    \ kostbare Aromate (Theophr. od. 30. 35. 42. 55).\nMelinum, Öl aus Quitten (Diosc. I 45. Plin. XIII\
    \ 11. XXIII 108), das durch aromatische Zutaten zu einer S. wurde (Theophr. od. 26. 28. 31. Plin.\
    \ a. a. O.); das beste lieferte Kos (Plin. XIII 5).\nMendesium (Diosc. I 59, 3. Plin. XIII 5, 8. Athen.\
    \ XV 688f.) lieferte Ägypten am besten, wie auch\ndas Metopium, das hauptsächlich aus dem Öl bitterer\
    \ Mandeln nebst verschiedenen andern Zutaten bestand (Plin. XIII 8, 5. Athen. XV 688f.). Der Name\
    \ soll von einem metopon (Gummi Ammoniacum) genannten Baume (Plin. XII 107) herstammen, dessen Harz\
    \ ein Bestandteil dieser S. war (Diosc. I 59).\nMyrobalanum s. Balaninum.\nΜυρσίνεον, Öl aus den Blättern\
    \ der Myrte (Diosc. I 39. Plin. XV 27. XXIII 87), das mit andern Aromaten zu einer S. wurde (Diosc.\
    \ a. a. O. Theophr. 27. 28).\nDas Narcissinum (Diosc. I 53) wurde aus den Blättern der Narzisse (vgl.\
    \ o. Bd. VII S. 794f.) bereitet; später wurde seine Erzeugung aufgegeben (Plin. XIII 6).\nDas Nardinum\
    \ (Theophr. 28. 33. 38. 42) gehörte zu den vorzüglichsten (Athen. XV 691) und teuersten S. (Plin.\
    \ XII 43ff.). Nach Galen. XII 429. 601 unterschied man das foliatum (Mart. XI 27, 9), das bei den\
    \ römischen Frauen sehr beliebt war, und das spicatum. Die Zusammensetzung des ersteren findet sich\
    \ bei Plin. XIII 15. Diosc. I 62. Bei Iuven. VI 465 bezeichnet foliatum wahrscheinlich eine trinkbare\
    \ Essenz. Mit echter Narde wurde Jesus gesalbt (Ev. Marc. XIV 3. Joa. XII 3; vgl. Hieron. hom. in\
    \ cant. I 4. Ambros. in Luc. VI 34).\nOenanthinum, von den Blättern der οἰνάνθη (s. o. Bd. VII S.\
    \ 798, 1. Theophr. od. 27. Diosc. I 46. Plin. XII 132). Als die beste Art zur Salbenbereitung galt\
    \ die kyprische (Athen. XV 689d. Plin. XII 133), die in Griechenland zu wenig aromatisch war. Als\
    \ ausgezeichnet galt das oenanthinum von Adramyttion wegen der Vorliebe, die des Eumenes Gattin Stratonike\
    \ dafür hatte (Athen. XV 689a), und das kyprische (Plin. XIII 5).\nDas Panathenaicum behauptete sich\
    \ stets in Athen (Athen. XV 688f. Plin. XIII 6).\nIn Vergessenheit war das Pardalium geraten, das\
    \ ehemals in Tarsus heimisch war (Plin. XIII 6).\nΦοινίκινον wird von Antiphanes (Athen. XII 553d)\
    \ unter andern S. erwähnt.\nΠλαγγόνιον, eine in Elis gebräuchliche Salbe, benannt nach dem Erfinder\
    \ Πλάγγων (Athen. XV 690e).\nEine ägyptische S. war Ράγδα (Athen. XV 690e) oder Σάγδα (ebd. 691c).\n\
    Rosensalbe wurde aus dem Saft der Rosenblätter und verschiedenen Aromaten gewonnen (Diosc. I 43, 3.\
    \ Plin. XIII 9. Theophr. od. 25). Sie wurde mit Ochsenzunge gefärbt (Theophr. 33). Die Eigenschaften\
    \ des ῥόδινον erwähnt Theophr. 35. 42. 45. 48. 51. 55. Was Diosc. I 43, 1f. als Rosensalbe bezeichnet,\
    \ bestand nur aus Olivenöl, das mit σχοῖνος zusammengekocht worden war, und dem Safte der Rosenblätter\
    \ (s. o. Bd. VII S. 774. 817. Sigismund Aromata 77). Berühmt war die Rosensalbe von Phaselis, später\
    \ die von Neapel, Capua und Praeneste (Plin. XIII 3).\nSampsuchinum, s. o. Amaracinum (Diosc. I 48.\
    \ Plin. XIII 10. XXI 163. Athen. XV 689c).\nSisymbrinum (s. o. Bd. VII S. 790, 67ff.), aus den Blüten\
    \ des σισύμβριον (Theophr. 27. Athen. XV 689d. XII 553e).\nSusinum, aus einer Lilienart (s. o. Bd.\
    \ VII S. 792, 51ff.), daher auch κρίνινον (Diosc. III 102. Galen. XIX 119) und λείριον (Diosc. I 52)\
    \ genannt. Σοῦσον soll das persische Wort für κρίνον sein (Athen. XII 513f.). Nach Plin. XIII 11 war\
    \ es die dünnste Salbe (vgl. XXI 22. XXIII 95), deren Aroma bald verflog (Theophr. od. 22. 27. Athen.\
    \ XV 689d).\nStacte, der flüssige Teil des Myrrhenharzes, galt als natürliche Salbe und war sehr teuer\
    \ (Diosc. I 60. Plin. XIII 17. Theophr. 29. 44. Athen. XV 688d. 689b ff.).\nDas von Diosc. I 54, 2\
    \ genannte Στυράκινον soll gleich dem ὀνύχινον und βουτύρινον der Safransalbe ähnlich gewesen sein.\n\
    Über das Telinum, s. o. Bd. III S. 581, 30ff. Vorzügliches telinum lieferte Syrien (Athen. XV 689a,\
    \ d). Zur Zeit des Komikers Menander in Gebrauch, wurde diese Salbe nachher vom megalium übertroffen\
    \ (Plin. XIII 13; vgl. Diosc. I 47. Tertull. pall. 4. Isid. IV 12, 7).\nDas Verfahren bei der Bereitung\
    \ des ὠκίμινον, das seinen Namen von der Pflanze ὤκιμον, Basilienkraut, hat, war ähnlich wie beim\
    \ rhodinum (Diosc. I 49).\nDie Fabrikation der Salben und der damit schwunghaft betriebene Handel\
    \ gingen, wie schon erwähnt, vom Morgenlande aus. Von jeher waren Syrien (Athen. XV 689a) und Ägypten\
    \ durch ihre Salben berühmt (XV 688f.), besonders Mendes (Plin. XIII 4) und Alexandrien, wo Arsinoë\
    \ und Berenike durch ihre Vorliebe für Wohlgerüche den Salbenhandel zur Blüte brachten (Athen. XV\
    \ 689a). Dazu zählt Kyrene (Ath. XV 689 a).\nTheophr. h. pl. VI 6, 5; c. pl. VI 18, 3. Von Phönikien\
    \ (Plin. XIII 6) wird Sidon (Athen. XV 688f.) eigens hervorgehoben.\nWeit verbreitet war die Salbenfabrikation\
    \ in Kleinasien, so in Kilikien (Theophr. od. 27), besonders in Soloi (Athen. XV 688d) und Tarsus\
    \ (Plin. XIII 6), in Perge (Diosc. I 56, 3), Ephesus (Athen. XV 689a), Pergamum (ebd.), Adramyttion\
    \ (XV 688e. 689a), Kyzikos (XV 688e. Plin. XIII 5. 14). Von den Inseln wurden genannt Rhodus (Arist.\
    \ Lys. 944 und Schol. Hesych. s. ῥόδιον. Suid. s. Ῥόδια μύρα. Plin. XIII 5. Athen. XV 688e), Cypern\
    \ (Theophr. od. 27. Plin. XIII 5. 10. Athen. XV 688f.), Delos (Plin. XIII 4), Kos (Plin. XIII 5. Athen.\
    \ XV 688e. Diosc. I 58, 3), Lesbos vertreten durch Mytilene (Plin. XIII 10).\nIm griechischen Mutterlande\
    \ lieferten Athen (Athen. XV 688e f. Plin. XIII 6), Korinth (Plin. XIII 5), Elis (Diosc. I 56, 3.\
    \ Athen. XV 688e), Aigina (Theophr. od. 27. Athen. XIII 14). In Italien war Kampanien das Hauptgebiet\
    \ der Salbenproduktion, von deren Umfang das Sprichwort Plus apud Campanos unguenti quam apud ceteros\
    \ olei fieri (Plin. XVIII 111) eine Vorstellung gibt, besonders Capua, Neapel, Praeneste (Athen. XV\
    \ 688e. Plin. XIII 3). In Rom waren zu Iuvenals und Martials Zeit Cosmus (Iuven. VIII 86 u. Schol.\
    \ Mart. I 87, 2. III 55, 1. 82, 26. IX 26, 2 u. ö.) und Niceros (VI 55, 3. X 38, 3. XII 65, 4) die\
    \ bekanntesten Salben- und Essenzenhändler.\nVgl. Büchsenschütz, Hauptstadt des Gewerbfleißes 94ff.;\
    \ Blümner, Gewerbliche Tätigkeit, Register unter Salbenfabrikation.\nÜber die Salben schrieben der\
    \ Herophileer Apollonios (s. o. Bd. II S. 149 Nr. 103) in seinem Buche περὶ μύρων (Athen. XV 688e\
    \ ff.), Hikesios (s. o. Bd. VIII S. 1393 Nr. 5) in seinem Werke περὶ ὕλης (Athen. XV 689c), der Arzt\
    \ Philonides in περὶ μύρων καὶ στεφάνων (Athen. XV 675 a–676e. 691f–692b), Apollodoros in einer gleichnamigen\
    \ Schrift (Athen. 675e), der kaiserliche Leibarzt Kriton, der im 2. Buche seiner Kosmetik 25 verschiedene\
    \ Salben und Essenzen aufzählt (Fabricius Bibl. Graec. XII 690). Hauptstellen über Salben finden sich\
    \ bei Theophr. de od., Dioscorides de materia medica I 4–68 (Wellmann, vgl. die Ausg. von Sprengel\
    \ mit Kommentar), Athen. XII 553. XV 685–692, Plin. XII 102ff. XIII 4–5. Phot. bibl. 279, p. 532 Bekker.\
    \ Poll. VI 104ff. VII 177. X 115. Isid. IV 12.\nLiteratur: Culmann Salben im Morgen- und Abendland,\
    \ Leipzig 1877. Sigismund Aromata. [Haug.]\n \n\n\n\n### English Translation\nUnguents. The most common\
    \ designations for cosmetic unguents are μύρον (myron) and unguentum. According to Athenaeus (XV 688c),\
    \ μύρον comes from σμύρνη (smyrna, myrrh), a term that was customary among the Aeolians instead of\
    \ μύρρα, because most unguents were prepared using myrrh. The word μύρον is first found in Archilochos\
    \ (Athen. loc. cit. = frg. 31, 30 ἐσμιρισμένας Bergk). Μύρον is likely a Semitic loanword (Hebr. mör,\
    \ Aram. mûrâ, Arab. murr). The upsilon (υ) in σμύρνη is probably an addition by analogy with σμικρός\
    \ (smikros, small) and others (Kühner-Blass I² 76; Schrader Reallex. 566f.). The Latin unguentum is\
    \ related to Old Indic anákti (anoints, spreads on, adorns), añjanam (ointment), Old High German ancho\
    \ (butter), Middle High German anke, and New High German (Swabian, Alemannic) Anke (Walde Lat. Etym.\
    \ W.² 851). In the earliest times, before oil and foreign perfumes were known, the common man used\
    \ butter for anointing, as Hecataeus mentions regarding the Thracian Paeonians (Athen. X 447d), a\
    \ practice that Sidonius Apollinaris (XII 7) still found among the Burgundians (Schrader 121, 567).\
    \ The Romans initially called the actual perfumeries unguenta exotica (foreign unguents) (Plin. XIII\
    \ 24). Other designations are ἄλειμμα (aleimma; cf. Corp. gloss. lat. II 211, 2. 225, 5), χρῖμα (chrima),\
    \ χρῖσμα (chrisma) (Diosc. I 19, 2 Wellm.), and μύρωμα (myroma) (Arist. Eccl. 1117), though these,\
    \ like unguentum, are used for various oils, fats, and essences. Χρῖμα very often refers to medicinal\
    \ ointment (cf. Diosc. I 8, 3. 21. 66, 3; Aristid. XLIX 21ff. Keil). In contrast to μύρον, it appears\
    \ in Xen. anab. IV 4, 13, where it means fat. To anoint oneself is sometimes ἀλείφεσθαι (aleiphesthai),\
    \ μυρίζειν (myrizein) (Lucian. Luc. 31), or χρίεσθαι (chriesthai) (ibid. 12). In contrast to the liquid\
    \ oils, στακτά (stakta) (Arist. Plut. 529) or ψακτά (psakta), the unguents are called παχέα (pachea,\
    \ thick) or odores (fragrances) (Athen. II 46a, Theophr. de odor. 39, Plin. XIII 7; cf. Sprengel on\
    \ Diosc. 367), while μύρον and unguentum encompass both concepts. In Diosc. I 43, 3 and elsewhere,\
    \ μύρον stands for ἔλαιον (elaion, oil) (Blümner Technol. I² 359).\nThe ancient peoples loved to grease\
    \ the body with all sorts of oils and unguents. Since this custom is particularly observed among southern\
    \ peoples, a certain need for it must have existed (cf. Sigismund Aromata 57). In any case, it was\
    \ considered healthy to use unguents with oil (Plin. XIV 150. XXII 114 intus mulso, foris oleo [mead\
    \ wine inside, oil outside]). According to Athen. I 24d, people anointed themselves so that their\
    \ bodies would not become too hard after the water from the bath had dried. The use of fragrant unguents\
    \ is an oriental custom. The Orient is the home of aromatic plants. It was there that they first succeeded\
    \ in binding fleeting fragrances to fats and oils and in preparing scented unguents. They served to\
    \ eliminate the unpleasant odor of strong perspiration caused by the great heat (cf. Plin. XIII 3).\
    \ The more these fragrances pleased, the more numerous their varieties became, and the more widespread\
    \ their use. Herodotus (I 195) attests that the Babylonians already used them lavishly for anointing\
    \ the entire body. Whether they invented the unguents themselves or learned their preparation from\
    \ the Egyptians is difficult to decide. Sigismund (61. 65) considers the Egyptians the inventors.\
    \ The Israelites probably learned about unguents from them, making ample use of them in their cult—Moses,\
    \ at God's command, had a holy anointing oil prepared from various aromatics (Exod. XXX 25)—and in\
    \ daily life (cf. the Song of Solomon Vulg. I 2. 3. IV 10. 14. Vulg. Ecclesiast. XXIV 20ff. Ev. Luc.\
    \ VII 37f. Matth. XXVI 7ff. Joh. XII 3). The Lydians were also known as lovers of unguents, which\
    \ suited their effeminacy (Athen. XV 690b). Consequently, the Persians were not the inventors of fragrances,\
    \ as Pliny (XIII 3) claims (cf. Hor. carm. I 38, 1), but rather they found them upon conquering Babylon\
    \ and developed them to the highest degree of lavishness. According to the Book of Esther (II 12),\
    \ the virgins destined for the king were anointed for six months with oil of myrrh and for another\
    \ six months with all sorts of unguents and spices before they were allowed to come to him. Artaxerxes\
    \ sent Antalcidas his own crown from the table, which he had dipped in the most exquisite unguents,\
    \ a gesture of favor that astonished everyone (Plut. Artax. 22, Athen. II 48e). During the conquest\
    \ of Damascus, as Parmenio reported to Alexander, forty unguent-makers were found among the captured\
    \ retinue of the Great King (Athen. XIII 608a). Likewise, Alexander captured a precious casket of\
    \ unguents in the camp of Darius at Issus (Diog. L. IX 1. Plin. XIII 3. VII 108). In the bathroom,\
    \ he found golden unguent flasks, and the chamber was fragrant with aromatics (Plut. Alex. 20). The\
    \ Ten Thousand also found unguents on their retreat in Armenia (Xen. anab. IV 4, 13).\nFrom the Orient,\
    \ the use of perfumes also came to the Greeks, along with the name. Homer already had knowledge of\
    \ it, although in his time people generally anointed themselves with oil (Athen. XV 688d). Aphrodite\
    \ anoints Hector's body with fragrant rose oil (Hom. Il. XXIII 186), and Hera anoints herself with\
    \ a fragrant oil (Il. XIV 172). By the time of Archilochos and Alcaeus, unguents were already in vogue\
    \ (Athen. XV 688c. 687d = Alk. frg. 36 B.), and Anacreon also praises them (ibid. 687c = frg. 9).\
    \ While it was often disdained as a means of effeminacy, the use of oil in the gymnasia was considered\
    \ a sign of masculinity (Xen. sympos. II 3). Therefore, Sophocles contrasts Aphrodite and Athena,\
    \ one using unguents, the other oil (Athen. XV 687c = frg. 334 N.).\nXenophon's soldiers also used\
    \ fats and unguents instead of olive oil only in emergencies (Xen. anab. IV 4, 13). Lawgivers like\
    \ Solon and Lycurgus forbade the sale of unguents (Athen. XIII 612a. XV 687f), and the Lacedaemonians\
    \ expelled the unguent-makers from the country (ibid. 686f. Sen. nat. quaest. IV 13, 8). Socrates\
    \ still delivered a stern tirade against perfuming (Xen. symp. II 3), and Chrysippus's definition\
    \ of μύρον also shows his disdain for fragrances (Athen. 686f). Nevertheless, perfumes were found\
    \ so pleasant that Aristippus complained that the effeminate had brought them into such disrepute\
    \ (Sen. de benef. VII 25, 1).\nIt was similar with the Macedonians, who became acquainted with the\
    \ luxury of unguents in Persia and soon succumbed to it, although Alexander rebuked his men for using\
    \ unguents instead of oil for rubbing and bathing, fearing it would lead to effeminacy (Plut. Alex.\
    \ 40). Subsequently, the extravagance with unguents in Greece and Macedonia only grew more intense,\
    \ especially since defenders had been found early on who called unguents stimulating for the activity\
    \ of the brain and heart (Athen. XV 687d ff.).\nIn Athens, hedonists had almost every part of their\
    \ body rubbed with a special unguent: Egyptian for the feet and legs, Phoenician for the jaw and chest,\
    \ sisymbrium for the arm, amarakus for the hair and eyebrows, and serpyllum for the knees and neck\
    \ (Athen. XV 689e), and a verse praises the pleasant feeling that unguents produce through beautiful,\
    \ soft hands (Athen. XII 553e). It was considered charming to glisten with unguents. To look more\
    \ seductive, Demetrius Phalereus dyed his hair yellow and anointed his face and entire body (Athen.\
    \ XII 542d). At his banquets, the guests were sprinkled with fragrances from the ceiling (ibid. 542c).\
    \ Similarly, at the Syrian court, the garlands of the guests were sprinkled with Babylonian unguent\
    \ by servants walking around with small flasks before the drinking began (Athen. XV 692c). At the\
    \ wedding feast of the Macedonian Caranus, each of the twenty participants received a silver and a\
    \ golden vessel with unguent after each course, containing a kotyle (ca. ¼ liter), as a gift (Athen.\
    \ IV 129a ff.). In the magnificent procession of Antiochus Epiphanes, two hundred women also marched\
    \ along, sprinkling fragrances from golden vessels (Athen. V 195b). Afterward, in the gymnasium, everyone\
    \ was anointed for five days from fifteen large golden vessels with crocus unguent and from just as\
    \ many with cinnamon and nard unguent. Similarly, other unguents were used on the following days (Athen.\
    \ ibid. 195d). The anecdote of King Antiochus Epiphanes shows what luxury was practiced with perfumes\
    \ and how much people coveted them (Athen. ibid. 196b).\nPliny does not know when unguents came to\
    \ the Romans, only that in the year 565 AUC, after the war with Antiochus, the censors forbade the\
    \ sale of unguenta exotica (Plin. XIII 24. Sol. XLVI 2), which suggests a fairly widespread use already.\
    \ In any case, they had not first come to Italy with the rest of Asian luxury but had already been\
    \ in fashion in Magna Graecia and Capua. From the roses of the Campanian plain, an excellent oil was\
    \ prepared in Naples and Capua (Athen. XV 688e). The latter city was particularly famous for its perfumes\
    \ (see above Vol. III, col. 1558, 32ff.); oriental spices were imported there (Plaut. Rud. 630f.).\
    \ The censors' ban was of no use in Rome. Perfuming became perceived as a daily necessity in the upper\
    \ classes and was part of good manners (guten Tone) (Plin. XIII 3). According to Sen. ep. LXXXVI 13,\
    \ people sometimes anointed themselves several times a day so that the fragrance would not fade. Unguents\
    \ were used \"for the sake of pleasure and health\" (voluptatis causa et valetudinis) (Dig. XXXIV\
    \ 2, 21 § 1. XV 3, 3 § 6 ad luxuriae materiem [as material for luxury]).\nRoman women used fragrances\
    \ so lavishly that a passing woman made herself noticeable even to those whose attention was otherwise\
    \ occupied (Plin. XIII 20). Similarly, Lucian (Amor. 10) says of women that they squander the wealth\
    \ of men on their hair, and that all of Arabia seems to emanate from it. According to Mart. XIV 59,\
    \ men and women loved perfumes, the former especially balsam and cinnamon (Iuven. II 41. Mart. III\
    \ 55, 4). The favorite of Domitian, Crispinus, already smelled stronger in the morning than two funeral\
    \ processions (cf. Friedländer Sittengesch. III⁶ 89). Plutarch also reports on the extravagance with\
    \ unguents, which he condemns as unmanly, and notes that men did not even want to sleep with their\
    \ wives if they did not smell of unguents (Moral. 99l = Teubn. VI 94). He recounts an incident that\
    \ caused a stir even in prodigal Rome (Galb. 19): Otho, at a banquet in honor of Nero, had the guests\
    \ showered with the most precious unguents from golden and silver pipes. Pliny himself saw soles of\
    \ feet being anointed, something Otho had shown Nero (XIII 22). Petronius (70) describes it as unheard\
    \ of that Trimalchio had his guests' feet anointed and garlanded. Some of the same unguent was then\
    \ poured into the wine vessel and into the lamps. Caligula used cold and warm perfumes for his bath\
    \ (Suet. Calig. XXXV 1) and had the bathtub sprinkled with balsam (Plin. XIII 22), a practice a slave\
    \ of Nero's imitated, so that it would not appear to be a privilege of princes alone. Private individuals\
    \ even sprinkled the walls of their bathing rooms with fragrances (Plin. loc. cit.). At Trimalchio's\
    \ feast, a huge hoop with golden crowns and unguent flasks descends from the ceiling as guest-gifts\
    \ (apophoreta) for the guests (Petron. 60). There were even cakes and fruits filled with saffron essence\
    \ that squirted out at the slightest pressure (ibid.). Serious men, like Scipio Africanus the Younger,\
    \ condemned daily perfuming in front of the mirror (Gell. VI 12, 5). He abstained from unguents (Sen.\
    \ ep. LXXXVI 11), as did Seneca (ep. CVIII 16), who argued most sharply against it (ep. LXXXVI 13.\
    \ CXXII 33; dial. VII 7, 3). Cicero also mocks the fops who glistened (Catil. II 5) and dripped (in\
    \ Pis. 25f.) with unguents.\nUnguents found ample use at the comissatio (drinking party). Its opening\
    \ included, among other things, the distribution of garlands and unguents (Athen. IX 408e. X 409e.\
    \ XV 665c). Later, garlands and unguents also introduced the dessert course (Athen. XV 685c. Nep.\
    \ Ages. 8). The Romans adopted the Greek custom (Catull. XIII 11ff.), hence the frequent mention of\
    \ unguents by the poets, especially Horace (carm. II 3, 13. 7, 7. 22, 11, 16f. III 1, 44. 29, 4. IV\
    \ 12, 17; epod. XIII 8; ars poet. 375; cf. Mart. III 12, 4. IV 19, 20. Iuven. XI 122. Cic. Tusc. V\
    \ 62). Unguents and garlands were also distributed at the meals of the Arval Brethren (Acta fr. Arval.\
    \ 27V. 218. 171V. 241. S. Henzen 13. 27. 39). In Petronius (60), a ring with garlands and unguent\
    \ flasks is lowered from the ceiling before dessert, the latter as guest-gifts. After dessert, slaves\
    \ bring in unguents and anoint the guests' feet (Petron. 70). At the wedding feast of Caranus, unguents\
    \ are repeatedly distributed. At the beginning of the meal, Rhodian dancers bring each guest a silver\
    \ and a golden unguent flask (Athen. IV 129a); the guests receive such flasks twice more (ibid. 129c),\
    \ the third time during the transition to the comissatio (129e). Grand hosts used to send garlands\
    \ and unguents to their guests as well (Plut. Artax. 22. Sen. IV 33, 4 of Caligula). At the Syrian\
    \ court, after the distribution of garlands, servants came in and sprinkled the drinkers' garlands\
    \ from small flasks (Athen. XV 692c). An even more refined way of scenting the guests is told in Athenaeus\
    \ (XV 691d). Doves were dipped in essences and then allowed to fly around the hall. The unguents at\
    \ the table were intended for the hair. Thus Habinnas comes from a feast laden with garlands, while\
    \ unguent runs down his forehead (Petron. 65). Christ's head was also anointed at a meal (Ev. Matth.\
    \ XXVI 7. Marc. XIV 3), and even his feet (Ev. Joan. XII 3. Luc. VII 38), which was otherwise considered\
    \ somewhat extraordinary (Petron. 70. Plin. XIII 22). When unguent flasks were given to guests as\
    \ apophoreta (Petron. 60), they were intended to be used at the soon-to-begin comissatio and to show\
    \ that the meal was nearing its end.\nIt is also stated in the Acta Arvalia of May 27, 218: post epulas\
    \ ... unguenta et coronas acceperunt (after the feast ... they received unguents and crowns). Philonides,\
    \ in his work περὶ μύρων καὶ στεφάνων (On Unguents and Garlands), gave the cooling of the heated head\
    \ as the reason for the use of unguents at the symposium. Initially, he said, the head was greased;\
    \ with the increase of luxury, people resorted to unguents. One should only use those that least weigh\
    \ down the head (Athen. XV 692a).\nFor one's grooming (toilette), the hair was preferably anointed,\
    \ partly for the fragrance, partly to give it a shiny appearance (Horat. carm. II 7, 8. Cic. Catil.\
    \ II 5. Mart. XII 38, 3). The fact that the hair is often described as dripping shows how lavishly\
    \ perfumes were used (Cic. in Pis. 25. Tibull. I 7, 51. Ovid. her. XX 161. 166). Hetaerae anointed\
    \ themselves to be pleasing (Plaut. Truc. 288ff.), and even graying lovers did so, for which they\
    \ were reproached (Plaut. Cas. 226ff.), for it was assumed that old people did not anoint themselves\
    \ (Athen. XV 688c = Archiloch. frg. 31 B.). It is more understandable that a bridegroom anointed himself\
    \ for his wedding (Catull. LXI 142). In Roman times, unguents were even used to paint a bald head\
    \ (Mart. VI 57, 1ff. 74, 2) or to dye the hair (see above Vol. VII, col. 90, 31ff.). In Mart. III\
    \ 62, 28, hair unguent is called capillare (cf. Blümner Röm. Privataltert. 275, 8). Aristotle attributed\
    \ the graying of hair to regular perfuming, because unguents dried out the hair (Athen. XV 692b).\
    \ The anointing of the chest was recommended as early as Alcaeus (frg. 36 B.) and Anacreon (frg. 9),\
    \ as it was the seat of the heart and soul, in order to invigorate them (Athen. XV 687c). Hair and\
    \ chest are mentioned by Archilochos, who is the first to name unguents (ibid. 688c). That effeminate\
    \ men, by the way, anointed their entire body (Lucian. Lexiph. 8 and Schol.) and designated different\
    \ unguents as particularly beneficial for individual parts, has already been said (Athen. XII 553c.\
    \ XV 689e ff.). Unguents were also used after bathing (ibid. XV 690c), and fragrances were added to\
    \ the bathing rooms (Plin. XIII 22), the bathwater (Schol. Iuven. VIII 83), and the laundry (Mart.\
    \ VII 3, 10. Clem. Alex. Paedag. II 8, 207 Pott.). Prop. III 10, 21 speaks of anointing the nose.\n\
    Not only externally, but also internally people wanted to enjoy unguents (Plin. XIII 25). Just as\
    \ aromatics were added to wine, so too were unguents, to enhance the taste (Theophr. de od. 9. 67).\
    \ They could not well be added to food without making it bitter (ibid. 10). In Athenaeus (XV 689e),\
    \ various perfumes are mentioned as a suitable addition to a drink or as good for the stomach and\
    \ digestion. Several writers of the Imperial period speak of the bad habit of adding unguents to wine\
    \ (Plut. moral. 149B. Plin. XIII 25. Petron. 70. Lukian. Nigrin. 31). Iuvenal (VI 303) brands this\
    \ as extravagance and debauchery. That in the Roman world even food was spoiled with unguents is proven\
    \ by an incident from Caesar's life, when a friend in Mediolanum served him asparagus that was prepared\
    \ with unguent instead of oil and was, of course, very unpleasant to eat (Plut. Caes. 17).\nThe use\
    \ of unguents was extended from the living to the dead (Plin. XIII 3). Already in Homer, the body\
    \ of Patroclus is anointed with oil and his wounds are filled with animal fat (Hom. Il. XVIII 350).\
    \ Achilles places large jars of honey and ἄλειφαρ (aleiphar, fat/oil) on the pyre (Il. XXIII 170;\
    \ cf. Hehn Kulturpflanzen⁶ 105). The anointing of corpses is mentioned by Arist. frg. 445 a D. Schol.\
    \ Plat. Hipp. min. 368c. According to Lucian (de luctu 11), the corpse was anointed with the best\
    \ unguent to prevent or slow its decomposition. In Athens, unguent vessels, λήκυθοι (lekythoi), were\
    \ placed next to the displayed dead (Arist. Eccl. 538. 1032). Among the Romans, the corpses were also\
    \ anointed after being washed (Stat. Silv. II 1, 160. Pers. III 104 and Schol. Ovid. ex Pont. I 9,\
    \ 52f. Serv. Aen. VI 219. Apul. Florid. 19. Plin. ep. V 16, 7. Val. Max. VII 7, 4. Ammian. Marc. XIX\
    \ 1, 10). This was done by a female member of the family, the servants, or the pollinctor (s.v.).\
    \ As perfumes for burial, amomum (Ovid. ex Pont. I 9, 52), myrrha, and casia (Mart. X 97, 2. XI 54,\
    \ 1) are mentioned. Trimalchio predetermined the unguents for his own corpse (Petron. 77). Even the\
    \ pyre was lavishly showered with unguents and spices (Stat. Silv. III 3, 131), so that even thefts\
    \ occurred (Mart. XI 54, 1ff.). At the burial of Annia Priscilla, saffron, myrrh, and balsam filled\
    \ the air (Stat. Silv. V 1, 210ff.). Juvenal (IV 109) also points to the waste of unguents at funeral\
    \ ceremonies. To honor the deceased or their family, fragrances were also sent for the burial (Plut.\
    \ Cat. min. 11; cf. Friedländer Sittengesch.⁸ 131. Blümner Röm. Privataltert. 484f.). According to\
    \ Dig. XI 7, 37, unguents are also included in the funeral costs. Unguent flasks were placed in the\
    \ burial chambers (see above Vol. III, col. 358, 45). Such small glass vessels, formerly called lacrimatoria\
    \ (tear-catchers), were found hanging in graves (Marquardt Privatl. d. Römer 368, 4. Blümner Röm.\
    \ Privataltert. 501, 15. Mau Pomp. in Leben und Kunst² 449). Garlands and unguent flasks were also\
    \ attached to grave monuments (Petron. 71). Not out of luxury, but for religious reasons, the Greeks,\
    \ on the anniversary of the Battle of Plataea, brought unguents among other offerings for the dead\
    \ to the burial sites, with which the archon anointed the grave steles (Plut. Aristid. 21).\nJust\
    \ as the Israelites used unguents for religious purposes (see above), so too in Rome the cult required\
    \ the anointing of images of the gods (Marquardt–Mommsen St. V. III 334. 434. Lipsius Excurs. ad Tac.\
    \ ann. I 124. Marini Atti II 394). According to Plin. XXXIII 112, it stemmed from another old religious\
    \ custom, to mix the unguents with red lead during the triumphal feast. In the acts of the Arval Brethren,\
    \ there is also mention of the anointing of the gods' images (see above Vol. II, col. 1475ff.). On\
    \ the ceremony of the Arval Brethren, cf. CIL VI 2104. Henzen Acta 10ff. Roscher Myth. Lex. I 970ff.\
    \ In Segesta, women and maidens anointed the image of Diana (Cic. Verr. II 4, 77). Pliny (XIII 23)\
    \ wonders that even the eagles and field standards were anointed on festive days. Anointing with oil\
    \ and fragrances was, after all, always an honor (Sigismund Aromata 58. 73). Unguents also served\
    \ superstitious purposes. Lucian (Luc. 12) tells of a witch's unguent, through which the witch transforms\
    \ into a night-raven. Superstition is also likely the basis when a lover anoints his beloved's door\
    \ to reconcile with her (see above Vol. I, col. 1728, 21).\nThe unguents of the ancients do not for\
    \ the most part correspond to those prepared in our pharmacies. While they did know how to perfume\
    \ animal fats of a firmer consistency and thus produce preparations similar to our pomades, for the\
    \ most part, plant oils were used for the perfumed mixtures of the ancients (Sigismund 73). A recipe\
    \ for making animal fats suitable for absorbing aromatic substances is given by Dioscorides (II 76ff.\
    \ Wellm.). Beef fat, deer fat, and the marrow of animals were cleaned of all membranes, melted in\
    \ a new vessel with a little salt. This mixture was then washed by rubbing it with the hands in pure\
    \ water, with frequent renewal of the water. It was then boiled with equal parts of fragrant wine\
    \ and left to stand together for a night. The next day, renewed boiling with fragrant wine followed,\
    \ which was repeated until the fat had lost all unpleasant odor and could be combined with fragrant\
    \ substances. Similar instructions for making the fat of birds, especially geese, fragrant by adding\
    \ aromatics are given by Diosc. (loc. cit. II 76, 13ff. Wellm.). From goose fat and aromatics, commagenum\
    \ was made, which was both a perfume and a remedy (Plin. XXIX 55. XXXVII 204). Otherwise, in the production\
    \ of unguents, a distinction was made between the essential oil extracted from plants, the sucus,\
    \ and the fat, the corpus, which was mostly pressed from fruits like olives, nuts, and almonds (Plin.\
    \ XIII 7). This fat formed the body of the unguent and was called στῦμμα (stymma), στυπτικόν (styptikon)\
    \ by the Greeks, and the process στῦψις (stypsis) (Diosc. I 6. 19, 5. 20, 1. 2 u. 3. Theophr. de od.\
    \ 21. 32. 60 et al.). The volatile plant oils, which were combined with these substances and gave\
    \ the unguents their fragrance, were called ἡδύσματα (hedysmata) (Plut. Ant. 24. Hippocr. II 866.\
    \ Plin. XIII 7). To the main components of the unguents, corpus and sucus, coloring agents were often\
    \ added, such as cinnabar, saffron, alkanet (see above Vol. II, col. 2111), and flos salis (flower\
    \ of salt) (Plin. XIII 1, 9. 10. XXXI 91). According to Theophr. (de od. 31), the amarakus, rose,\
    \ and megalium unguents were dyed. The expensive ones, like the Egyptian, the Cyprus, and the quince\
    \ unguents, remained undyed. The first two were supposed to be white, the latter the color of quinces.\
    \ In addition, the cheap ones were not dyed because the addition of color would not have been worthwhile.\
    \ To preserve the oil, salt was added (Diosc. I 43, 3. Plin. XIII 7). Olive and almond oil became\
    \ rancid easily and spoiled the fragrances. In contrast, the ben oil valued in unguent-making (see\
    \ above Vol. V, col. 2070) has the valuable property of not becoming rancid. Gum and resin were used\
    \ in unguent-making to fix the fragrance, which evaporated quickly (Plin. XIII 7). For the ancients\
    \ do not seem to have yet understood how to extract pure essential oils from the respective plant\
    \ parts, as they did not know our distillation process; but they were very close to this knowledge\
    \ (Blümner Technol. I² 360, 2). According to Diosc. I 58, 3, the addition of resin or gum was for\
    \ the sake of color and thickening, and for this,\t.\nA main activity in unguent-making was cooking,\
    \ which always took place in the production of the corpus, the στῦψις, the ὑποστύφειν (Theophr. de\
    \ od. 22), while the oils were prepared by a cold process (ψυχροβαφῆ) or a hot one (θερμοβαφῆ). This\
    \ cooking had to take place in a water bath, i.e., the substances were not exposed directly to the\
    \ fire, as the loss would have been too great and everything would have acquired a burnt smell; instead,\
    \ these vessels were placed in others that contained water. Instructions on unguent-making are given\
    \ by Theophrast (de od. 23ff.), Pliny (XIII 8ff.), and Dioscorides (I 43ff.). From the main activity\
    \ in unguent-making, the cooking, μύρον ἕψειν (myron hepsein, to cook unguent) (Arist. Lysistr. 946\
    \ and very often in Diosc. et al.), μυρεψεῖν (myrepsein) (Aesop. fab. 122), the Greeks derived the\
    \ following names for this trade: μυρεψία (myrepsia) (Arist. de insomn. II 13 p. 460a, 27), μυρεψική\
    \ (myrepsikē) (Theodos. gramm. 53, 28 Göttl. Athen. XIII 611f. Plut. quaest. conviv. IV 1, 2 p. 661\
    \ C μυρεψικὰ φάρμακα), μυρεψός (myrepsos) (Poll. VII 177. Plut. Pericl. 1. Theophr. hist. pl. IV 2,\
    \ 6; caus. pl. VI 11, 19, 3; de odor. 8 et al. cf. Cramer Anecd. Oxon. IV 248, 17), μυροποιός (myropoios)\
    \ (Athen. XIII 608 a. Poll. VII 177).\nMore common are the designations expressing the trade in unguents,\
    \ such as μυροπωλεῖν (myropōlein) (Poll. VII 177), μυροπώλης (myropōlēs) (Xen. conviv. II 4. Athen.\
    \ XII 552f. XIII 612e. Poll. VII 177. Etym. M. 595, 32), μυρόπωλις (myropōlis) (Arist. Eccl. 841.\
    \ Anth. Pal. V 180, 10), myropola (Plaut. Cas. 226; Trin. 408. Naev. b. Fulgent. 565, 17), μυροπωλεῖον\
    \ (myropōleion) (Ps.-Demosth. XXV 52 p. 786. Lys. XXIV 20), μυροπώλιον (myropōlion) (Plut. Timol.\
    \ 14. Poll. VII 177), myropolium (Plaut. Amph. 1011; Epid. 199).\nHowever, these terms sometimes refer\
    \ to the manufacturer. This is particularly the case in Latin, where unguentarius (Cic. de off. I\
    \ 150; ad Att. XIII 46, 2. Horat. sat. II 3, 228. Plin. XXXI 91. CIL IV 609. 2184. VI 845. 999ff.\
    \ 1974. 5638. 5681. 9998–10005. 10007 institor unguentarius. IX 171. 5905. X 3968. 3974. 3975. 3979.\
    \ 3982. 8264. XI 5839. XII 1594. XIII 2602) refers to both the manufacturer and the seller, and unguentaria\
    \ means both the technique (ars) (Plaut. Poen. 708. Apul. de dogm. Plat. II 9) and the shop (taberna)\
    \ (Varro de l. l. VIII 55. Suet. Aug. IV 2. Sen. ep. CVIII 4); cf. Blümner Technol. I² 361; Röm. Privataltert.\
    \ 436, 4. Marquardt Privatl. d. Römer 782).\nThe trade of unguent-makers and -dealers was despised\
    \ among the Greeks and Romans (Theod. gramm. p. 53, 28 Göttl. μικροτεχνία ἡ μυρεψική [the art of unguent-making\
    \ is a petty craft]). Lysias accuses the Socratic Aeschines of μυρεψία as being unworthy of a philosopher\
    \ (Athen. XIII 612a). Solon forbade men from dealing in unguents (μυροπωλεῖν) (Athen. XV 687a), and\
    \ the Spartans expelled unguent-dealers as spoilers of oil (Sen. nat. quaest. IV 13, 8). People enjoyed\
    \ the fragrances but despised the trade (Plut. Pericl. 1). Cicero (de off. I 150) counts it among\
    \ the \"sordid arts\" (sordidae artes) and equates the unguentarii with fishmongers, butchers, and\
    \ cooks. Seneca expresses himself similarly (ep. LXXXVIII 18) (cf. Plaut. Trin. 408. Horat. sat. II\
    \ 3, 228). The unguent shops were, like barbershops, popular gathering places for the idle of Athens\
    \ (Athen. XIII 612a. Lys. XXIV 20. Plaut. Amph. 1011; Epid. 199). The younger Dionysius, after his\
    \ expulsion, loitered in the cookshops of Corinth or sat in the unguent booth (Plut. Timol. 14). In\
    \ Petronius (74), the unguentarius herae proximae is probably a freedman or slave, appointed by his\
    \ mistress as the manager (institor) of an unguent booth. It seems that the unguentarii often engaged\
    \ in matchmaking, as women were the primary clientele in their shops (cf. Friedländer loc. cit. p.\
    \ 348). The female unguent-dealers did not have the best reputation (Arist. Eccl. 841. Anth. Pal.\
    \ V 180, 10). They are also mentioned in inscriptions (CIL VI 10006. X 1965).\nThe pigmentarii (s.v.)\
    \ also sold odores and unguenta alongside dyes, as did the seplasiarii (s.v.), who were spread throughout\
    \ the empire. The unguent-dealers engaged in much counterfeiting with fragrances. Since the oriental\
    \ aromatics were very expensive, they sought to replace them with cheaper substances. Theophrastus\
    \ mentions tricks of the unguent-dealers (de od. 45, 53) (Plin. XIII 19). On the adulteration of balsam,\
    \ see above Vol. II, col. 2838, 29ff.\nGiven the high prices of unguents, counterfeiting was certainly\
    \ profitable. Moreover, with the great consumption, the trade of the unguentarii must have been lucrative.\
    \ According to Athenaeus (XV 691a), a kotyle (≈ 0.274 l) of unguent was sold very expensively in Athens,\
    \ for 5–10 minae. The Gospels confirm this figure. The pound of nard with which Jesus was anointed\
    \ was valued at 300 denarii (1 denarius = 0.87 Mark, see above Vol. V, col. 209, 63) (Ev. Joh. XII\
    \ 3f. Marc. XIV 3ff.). A high price, when according to Ev. Marc. VI 37, the disciples considered 200\
    \ denarii sufficient to buy bread for several thousand people. Martial (XII 65) considers whether\
    \ he should give his Phyllis ten gold pieces from the emperor's mint—210 Marks—or a pound from the\
    \ shops of Cosmus or Niceros (cf. Mart. XI 27, 9). The leaf of the nard cost 40–75 denarii per pound,\
    \ and the ear 100 denarii per pound (Plin. XII 43ff.). Therefore, the nard unguent, both the foliatum\
    \ and the spicatum, was among the most expensive, at 35–300 denarii per pound (ibid. XIII 15). A Roman\
    \ pound of Malabathrum oil cost up to 400 denarii (ibid. XII 129), and cinnamon juice up to 1500 denarii\
    \ (ibid. XII 99).\nGreat importance seems to have been placed on the method of storage. The unguent-dealers\
    \ sought out densely shaded rooms for their dwellings so that the sun's heat would not destroy the\
    \ fragrances (Theophr. de od. 40). For the same reason, vessels made of lead (ibid. 41. Mart. VI 55,\
    \ 3; see above Vol. III, col. 562, 45) and alabaster (Plin. XIII 19) were chosen for unguents. Especially\
    \ the alabastrites (see above Vol. I, col. 1271f.; Blümner Röm. Privataltert. 154; Sigismund 80ff.),\
    \ the true oriental alabaster and a variety thereof, onyx marble, called Onyx by the ancients (s.v.),\
    \ was used, which according to Pliny (XXXVI 60) was particularly suitable for unguents. Therefore,\
    \ the unguent vessels were given the name alabastrum (see above Vol. I, col. 1272, 57ff.) and onyx—the\
    \ latter is popular with the poets (Catull. LXVIII 83; Horat. carm. IV 12, 17; Prop. III 5, 14 [II\
    \ 13, 30]; IV 9 [III 10], 22; Mart. VII 94; XI 50, 6)—although they were not always made of this material.\
    \ The form and purpose were considered more important than the material. There were also those made\
    \ of glass and clay. Glass unguent flasks with white stripe-ornaments on an amber-colored ground have\
    \ been found in Etruscan graves. They do not seem to be blown, but rather cast in a mold (Marquardt\
    \ Privatl. d. Römer 748, 5; 786, 2; see above Vol. VII, col. 1386, 11; 1384, 48; 1388, 9). In Pompeii,\
    \ too, unguent and oil vessels were found (Overbeck-Mau 451 Fig. 250,5. 452f. Fig. 251. 252h) made\
    \ of glass, clay, and ivory. Golden alabastra are mentioned by Theocr. XV 114; Plut. Alex. 20. In\
    \ Athen. IV 86c, alabaster vessels are mentioned alongside golden unguent vessels. For exquisite unguents,\
    \ it seems that precious, artistically shaped vessels were generally intended. At the procession of\
    \ Antiochus, fragrances were sprinkled from golden jars, καλπίδες (kalpides) (Athen. V 195b; cf. Polyb.\
    \ XXXI 3, 17), and afterwards the participants in the competitions anointed themselves from golden\
    \ vessels, ὀλκίαι (olkiai) (loc. cit. 195d). Caranus gives his guests golden and silver λήκυθοι (lekythoi)\
    \ (Athen. IV 129b). The vessel from which Jesus was anointed is also called an alabastron (Ev. Matth.\
    \ XXVI 7; Luc. VII 37). According to Ev. Marc. XIV 3, it was first broken and then the unguent was\
    \ poured on his head. The ampulla (Mart. III 82, 26; XIV 110), Greek λήκυθος (lekythos) (s.v.), which\
    \ was otherwise an oil flask, is also sometimes used as an unguent vessel (Arist. Plut. 810; Eccles.\
    \ 1101; Poll. VI 105; X 119; Athen. IV 129a). In Lucian (Luc. 12), the unguent boxes are in a small\
    \ chest. The unguent shrine of Darius, adorned with precious stones, pearls, and gold, was very costly\
    \ (Plin. VII 108; XIII 3). Illustrations of unguent flasks: Stackelberg Gräber der Hellenen Taf. 38\
    \ = Múzik-Perschinka Kunst und Leben I. A. 136, 4; Gerhard Ant. Bildw. 27, 2 = Roscher Myth. Lex.\
    \ II 2455; Overbeck-Mau loc. cit.; Daremberg-Saglio I² 177; Sigismund Aromata 85 Fig. c—e. Fig. e;\
    \ Guhl-Koner⁶ 345f. Fig. 425–427.\nThe preparation of unguents was done with exquisite art, to make\
    \ them as piquant as possible (Cic. de orat. III 99 = Plin. XIII 21; cf. Theophr. de od. 8, 25). They\
    \ gained pungency from costus and amomum, became thicker and more pleasant with myrrh, and useful\
    \ for medicine with crocus. Some manufacturers contented themselves with sprinkling in a little of\
    \ the expensive ingredients after the rest had been boiled, which naturally diminished the strength\
    \ and value of the unguent (Plin. XIII 16). Counterfeiting was, according to Plin. XIII 17, the order\
    \ of the day (cf. Theophr. 30). The names of the unguents are numerous. According to Plin. XIII 4,\
    \ they derive from their place of origin, their ingredients and plants, or other circumstances. Sometimes\
    \ these, sometimes those unguents were in fashion, depending on the different ingredients and their\
    \ particular mixture, in which one was inventive. The necessary aromatics also thrived better now\
    \ here, now there, or sometimes they degenerated. Theophrastus (37) says that the weather, the right\
    \ time of gathering or extraction, and the observation of the full strength of the plants after their\
    \ extraction have a great influence on the preparation of unguents (cf. ibid. 34). Sometimes the unguents\
    \ received their name from the ingredient that gave them their predominant scent. However, this was\
    \ not always the case (Diosc. I 42, 3). Of the fragrances, the one added last predominated, and the\
    \ unguents improved with age (Plin. XIII 19; Theophr. 17).\nAmong the most durable were the Egyptian\
    \ unguent, irinum, the marjoram and nard unguents, and above all, stacte. An unguent-dealer is said\
    \ to have had Egyptian unguent for 8 years, and irinum for 20 years (Theophr. 38). The unguents, according\
    \ to Theophr. (hist. plant. IX 7, 3), were prepared from the blossoms and leaves, the shoots and roots,\
    \ the wood, the fruits, and the resin of fragrant plants, for which he gives individual examples,\
    \ except for resin and for the shoots. The weakest and least durable were those from the blossoms,\
    \ which are best after two months but spoil after a year (39. 67f.); among the strongest were the\
    \ Egyptian and marjoram unguents and megalium (55). An unguent in itself, without further composition,\
    \ was stacte (29); the others were more or less composite. One of the first and simplest, according\
    \ to Plin. XIII 8, without him giving its proper name, consisted of bryon and ben oil (cf. Diosc.\
    \ I 21). The most frequently mentioned cosmetic unguents, which were also used for medicinal purposes,\
    \ are:\nThe Egyptian unguent, which consisted of several ingredients, of which Theophrastus (28) names\
    \ cinnamon and myrrh, and was one of the most expensive (30), was not dyed because its white color\
    \ was to be preserved (31), and was very durable (38). Its use is mentioned by Athen. II 66c. XII\
    \ 553d.\nThe marjoram unguent, amaracinum, see above Vol. I, col. 789, 31f.\nAmomumbalsamum (Ovid.\
    \ ex Pont. I 9, 52. Pers. III 101. Mart. V 64, 3), otherwise amomum (see above Vol. I, col. 1873,\
    \ 46ff.) was added to the most precious unguents (Diosc. I 15, 2).\nAnethinum was prepared from dill\
    \ (see above Vol. I, col. 641, 9) and olive oil (Isid. IV 12, 10. Diosc. I 51).\nΒακκάρινον (Bakkarinon),\
    \ see above Vol. II, col. 2686.\nBalsaninum, see above Vol. V, col. 2970.\nBalsam unguent, see above\
    \ Vol. II, col. 2838. The inferior wood balsam was boiled into the unguents (ibid. line 22ff. = Plin.\
    \ XII 118).\nΒρένθειον (Brentheion) Athen. XV 690 d; Etym. M. s.v. (see above Vol. III, col. 2808,\
    \ 37).\nCinnamominum, according to Plin. XIII 15 the thickest unguent; the pound cost 35–300 denarii\
    \ (Diosc. I 61). Both types of cinnamon (see above Vol. III, col. 1637) were used with other substances\
    \ for various unguents (ibid. col. 1648, 50ff.), namely for expensive ones (Diosc. I 14, 4. Theophr.\
    \ od. 28, 29).\nCommagenum Plin. XXIX 55f., from the plant named after Commagene, perhaps Nardus Syriaca,\
    \ and goose fat, cinnamon, and white pepper (Dig. XXXIV 2, 21 § 1).\nCostum, rarely costus, a precious\
    \ unguent from the root of the eponymous Indian shrub, Costus arabicus L. (Plin. XII 41. Cels. III\
    \ 21. Horat. carm. III 1, 44. Prop. IV 6, 5. Lucan. IX 917). The root was also used for the marjoram\
    \ unguent (Theophr. od. 28).\nCrinon (Dig. XXXIV 2, 21 § 1) or susinum (Cels. V 21, 1; Plin. XIII\
    \ 11), mainly from the blossoms of the lily (see above Vol. VII, col. 793, 8ff.).\nCrocinum, saffron\
    \ unguent (see above Vol. VII, col. 796, 26ff. 818, 58. Plin. XIII 5, 10. Paul. Aeg. VII 20 s.v. Diosc.\
    \ I 54, 42. 63). Only in name were ὀνύχινον, βουτύρινον, and στυράκινον different, which were otherwise\
    \ identical to the saffron unguent in their preparation and effect (Diosc. I 54, 2). The crocomagma\
    \ was also used medicinally (Diosc. I 27. Plin. XX 139).\nCyprinum (Diosc. I 55, 49. Plin. XIII 5,\
    \ 12), prepared from the blossoms of the κύπρος, Lawsonia inermis L. (see above Vol. VII, col. 805,\
    \ 14ff.).\nΔάφνινον (Daphninon), prepared from the fruits of the laurel (Theophr. od. 28), was cheap\
    \ and caused headaches (ibid. 42), mentioned as an oil in Diosc. I 40. Plin. XIII 86.\nἘλάτινον (Elatinon)\
    \ (Diosc. I 44), from the ἐλάτη (elatē), the palm fruit (cf. ibid. 109, 5). The young shoots of the\
    \ palms were used by the unguent-makers for the στύψις (stypsis, astringent base) of the unguent (ibid.\
    \ 109, 4). Pliny (XII 134) mistakenly understands elate as a specific type of palm that provides material\
    \ for unguents (Blümner Maximaltarif VI 40).\nGlaucinum (Mart. IX 26, 2), according to Dig. XXXIV\
    \ 2, 21 § 1 a cosmetic and medicinal unguent, from the juice of the glaucion, Chelidonium glaucium\
    \ L., the great-flowered celandine (cf. Plin. XX 206. XXVII 83).\nGleucinum, according to Diosc. I\
    \ 37 from the oil of unripe olives and various aromatics and must; according to Colum. V 22, 1. Plin.\
    \ XV 29 an oil to which, however, precious fragrances were sometimes also added.\nἙρπύλλινον (Herpyllinon),\
    \ from the blossoms of the wild thyme (Theophr. od. 27 = Athen. XV 689d. XII 553d).\nἩδύχρουν (Hēdychroun),\
    \ prepared on Cos, similar in effect and preparation to the marjoram unguent, but even more fragrant\
    \ (Diosc. I 58, 3. Gal. XIV 52. 306. 262). In Cic. Tusc. III 46 it is an incense.\nIrinum, from the\
    \ root of the iris (see above Vol. VII, col. 825, 46ff.), also a good medicine, very durable, whose\
    \ fragrance did not evaporate quickly (Theophr. od. 24. 28. 36. 38). The best was made in Perge and\
    \ Elis according to Diosc. I 56, 3; according to Plin. XXI 42 formerly on Leukas and in Elis, but\
    \ in his time in Pamphylia and Cilicia; for a long time the Corinthian was very popular (Plin. XIII\
    \ 5 = Athen. XV 688e). According to Theophr. (h. pl. IX 7, 3), the iris, specifically the Illyrian\
    \ iris, was the only plant usable for aromatics. Pliny (XIII 18) also mentions the Gallic nard (cf.\
    \ Theophr. h. pl. IX 7, 2. Athen. V 195d. XII 553a. Plin. XIII 14. Aet. I s.v. ἔλαιον ἴρινον = Nic.\
    \ M. XVI 30. Paul. Aeg. VII 20 s.v.).\nThe Royal Unguent, already mentioned by Crates and Sappho (Athen.\
    \ XV 690d e), was the most excellent and costly unguent; according to Plin. XIII 18, it was manufactured\
    \ for the Parthian kings and consisted of 24 fragrances along with honey and wine.\nΛευκόϊον (Leukoion)\
    \ (Theophr. od. 27 = Athen. XV 689), from the blossoms of the λευκόινον (leukoinon, white violet)\
    \ (see above Vol. VII, col. 788f.), also an essence for drinking (Athen. XV 689e).\nΛιβανώτινον (Libanōtinon)\
    \ could only be successfully produced by a single manufacturer in Pergamon (Athen. XV 689a).\nMalobathrum\
    \ (Diosc. I 63), counted by Pliny (XIII 14) among the more solid unguents, from the fragrant leaf\
    \ of the Laurus Cassia (Plin. XII 129. XXIII 98; cf. Kiessling on Horat. carm. II 7, 7. Sidon. carm.\
    \ V 415. Cels. V 23. Cael. Aurel. acut. III 3, 24; chron. VI, 12). In Rome, a pound of the oil cost\
    \ 300 denarii (Plin. XII 129).\nThe Megalium, μεγαλείον, μεγάλλειον, was named after its inventor,\
    \ Megallos, a Sicilian or Athenian (Athen. XV 690f.), and enjoyed high esteem, hence the inventor's\
    \ writings were frequently mentioned. The most famous came from Ephesus (ibid. 689a). Pliny (XIII\
    \ 13) derives the name from the great reputation (Ruf) it enjoyed. According to Diosc. I 58, 3, it\
    \ was characterized by a strong resin additive; its production required 10 days and nights and costly\
    \ aromatics (Theophr. od. 30. 35. 42. 55).\nMelinum, oil from quinces (Diosc. I 45. Plin. XIII 11.\
    \ XXIII 108), which became an unguent through aromatic additives (Theophr. od. 26. 28. 31. Plin. loc.\
    \ cit.); the best was supplied by Cos (Plin. XIII 5).\nMendesium (Diosc. I 59, 3. Plin. XIII 5, 8.\
    \ Athen. XV 688f.) was best supplied by Egypt, as was\nthe Metopium, which mainly consisted of the\
    \ oil of bitter almonds along with various other ingredients (Plin. XIII 8, 5. Athen. XV 688f.). The\
    \ name is said to derive from a tree called metopon (Gum Ammoniacum) (Plin. XII 107), whose resin\
    \ was a component of this unguent (Diosc. I 59).\nMyrobalanum see Balaninum.\nΜυρσίνεον (Myrsineon),\
    \ oil from the leaves of the myrtle (Diosc. I 39. Plin. XV 27. XXIII 87), which became an unguent\
    \ with other aromatics (Diosc. loc. cit. Theophr. 27. 28).\nThe Narcissinum (Diosc. I 53) was prepared\
    \ from the leaves of the narcissus (cf. above Vol. VII, col. 794f.); its production was later abandoned\
    \ (Plin. XIII 6).\nThe Nardinum (Theophr. 28. 33. 38. 42) was one of the most excellent (Athen. XV\
    \ 691) and expensive unguents (Plin. XII 43ff.). According to Galen (XII 429. 601), a distinction\
    \ was made between the foliatum (Mart. XI 27, 9), which was very popular with Roman women, and the\
    \ spicatum. The composition of the former is found in Plin. XIII 15. Diosc. I 62. In Iuven. VI 465,\
    \ foliatum probably refers to a drinkable essence. Jesus was anointed with genuine nard (Ev. Marc.\
    \ XIV 3. Joa. XII 3; cf. Hieron. hom. in cant. I 4. Ambros. in Luc. VI 34).\nOenanthinum, from the\
    \ leaves of the οἰνάνθη (oinanthē, wild vine) (see above Vol. VII, col. 798, 1. Theophr. od. 27. Diosc.\
    \ I 46. Plin. XII 132). The Cypriot variety was considered the best for unguent preparation (Athen.\
    \ XV 689d. Plin. XII 133), but it was not very aromatic in Greece. The oenanthinum from Adramyttion\
    \ was considered excellent because of the preference that Eumenes' wife Stratonice had for it (Athen.\
    \ XV 689a), as was the Cypriot one (Plin. XIII 5).\nThe Panathenaicum always held its own in Athens\
    \ (Athen. XV 688f. Plin. XIII 6).\nThe Pardalium had fallen into oblivion; it was formerly native\
    \ to Tarsus (Plin. XIII 6).\nΦοινίκινον (Phoinikinon) is mentioned by Antiphanes (Athen. XII 553d)\
    \ among other unguents.\nΠλαγγόνιον (Plangonion), an unguent common in Elis, named after its inventor\
    \ Plangon (Athen. XV 690e).\nAn Egyptian unguent was Ράγδα (Rhagda) (Athen. XV 690e) or Σάγδα (Sagda)\
    \ (ibid. 691c).\nRose unguent was obtained from the juice of rose petals and various aromatics (Diosc.\
    \ I 43, 3. Plin. XIII 9. Theophr. od. 25). It was dyed with alkanet (Theophr. 33). The properties\
    \ of the ῥόδινον (rhodinon) are mentioned by Theophrastus (35. 42. 45. 48. 51. 55). What Dioscorides\
    \ (I 43, 1f.) describes as rose unguent consisted only of olive oil boiled with sweet rush (σχοῖνος)\
    \ and the juice of rose petals (see above Vol. VII, col. 774. 817. Sigismund Aromata 77). The rose\
    \ unguent from Phaselis was famous, later that from Naples, Capua, and Praeneste (Plin. XIII 3).\n\
    Sampsuchinum, see Amaracinum (Diosc. I 48. Plin. XIII 10. XXI 163. Athen. XV 689c).\nSisymbrinum (see\
    \ above Vol. VII, col. 790, 67ff.), from the blossoms of the σισύμβριον (sisymbrion, wild mint) (Theophr.\
    \ 27. Athen. XV 689d. XII 553e).\nSusinum, from a type of lily (see above Vol. VII, col. 792, 51ff.),\
    \ hence also called κρίνινον (krininon) (Diosc. III 102. Galen. XIX 119) and λείρινον (leirinon) (Diosc.\
    \ I 52). Σοῦσον (Souson) is said to be the Persian word for κρίνον (krinon, lily) (Athen. XII 513f.).\
    \ According to Plin. XIII 11, it was the thinnest unguent (cf. XXI 22. XXIII 95), whose aroma quickly\
    \ faded (Theophr. od. 22. 27. Athen. XV 689d).\nStacte, the liquid part of myrrh resin, was considered\
    \ a natural unguent and was very expensive (Diosc. I 60. Plin. XIII 17. Theophr. 29. 44. Athen. XV\
    \ 688d. 689b ff.).\nThe Στυράκινον (Styrakinon) mentioned by Diosc. I 54, 2 is said to have been similar\
    \ to the ὀνύχινον and βουτύρινον of the saffron unguents.\nOn the Telinum, see above Vol. III, col.\
    \ 581, 30ff. Excellent telinum was supplied by Syria (Athen. XV 689a, d). In use at the time of the\
    \ comedian Menander, this unguent was later surpassed by megalium (Plin. XIII 13; cf. Diosc. I 47.\
    \ Tertull. pall. 4. Isid. IV 12, 7).\nThe process for preparing ὠκίμινον (ōkiminon), which takes its\
    \ name from the plant ὤκιμον (ōkimon, basil), was similar to that for rhodinum (Diosc. I 49).\nThe\
    \ manufacture of unguents and the brisk trade associated with it, as already mentioned, originated\
    \ in the Orient. Syria (Athen. XV 689a) and Egypt (XV 688f.), especially Mendes (Plin. XIII 4) and\
    \ Alexandria, where Arsinoë and Berenice, through their fondness for fragrances, brought the unguent\
    \ trade to prosperity (Athen. XV 689a), have always been famous for their unguents. To this may be\
    \ added Cyrene (Ath. XV 689a).\nTheophr. h. pl. VI 6, 5; c. pl. VI 18, 3. Of Phoenicia (Plin. XIII\
    \ 6), Sidon (Athen. XV 688f.) is specifically highlighted.\nThe unguent industry was widespread in\
    \ Asia Minor, for instance in Cilicia (Theophr. od. 27), especially in Soloi (Athen. XV 688d) and\
    \ Tarsus (Plin. XIII 6), in Perge (Diosc. I 56, 3), Ephesus (Athen. XV 689a), Pergamum (ibid.), Adramyttion\
    \ (XV 688e. 689a), and Cyzicus (XV 688e. Plin. XIII 5. 14). Of the islands, Rhodes was mentioned (Arist.\
    \ Lys. 944 and Schol. Hesych. s. ῥόδιον. Suid. s. Ῥόδια μύρα. Plin. XIII 5. Athen. XV 688e), Cyprus\
    \ (Theophr. od. 27. Plin. XIII 5. 10. Athen. XV 688f.), Delos (Plin. XIII 4), Cos (Plin. XIII 5. Athen.\
    \ XV 688e. Diosc. I 58, 3), and Lesbos represented by Mytilene (Plin. XIII 10).\nIn mainland Greece,\
    \ Athens (Athen. XV 688e f. Plin. XIII 6), Corinth (Plin. XIII 5), Elis (Diosc. I 56, 3. Athen. XV\
    \ 688e), and Aegina (Theophr. od. 27. Athen. XIII 14) were suppliers. In Italy, Campania was the main\
    \ region for unguent production, of whose extent the proverb Plus apud Campanos unguenti quam apud\
    \ ceteros olei fieri (More unguent is made among the Campanians than oil among others) (Plin. XVIII\
    \ 111) gives an idea, especially Capua, Naples, and Praeneste (Athen. XV 688e. Plin. XIII 3). In Rome,\
    \ at the time of Juvenal and Martial, Cosmus (Iuven. VIII 86 u. Schol. Mart. I 87, 2. III 55, 1. 82,\
    \ 26. IX 26, 2 et al.) and Niceros (VI 55, 3. X 38, 3. XII 65, 4) were the most famous dealers of\
    \ unguents and essences.\nCf. Büchsenschütz, Hauptstadt des Gewerbfleißes 94ff.; Blümner, Gewerbliche\
    \ Tätigkeit, see index under Salbenfabrikation.\nOn the subject of unguents, wrote the Herophilean\
    \ Apollonios (see above Vol. II, col. 149 No. 103) in his book περὶ μύρων (On Unguents) (Athen. XV\
    \ 688e ff.); Hikesios (see above Vol. VIII, col. 1393 No. 5) in his work περὶ ὕλης (On Matter) (Athen.\
    \ XV 689c); the physician Philonides in περὶ μύρων καὶ στεφάνων (On Unguents and Garlands) (Athen.\
    \ XV 675a–676e. 691f–692b); Apollodoros in a work of the same name (Athen. 675e); the imperial physician\
    \ Kriton, who in the 2nd book of his Kosmetik lists 25 different unguents and essences (Fabricius\
    \ Bibl. Graec. XII 690). Main sources on unguents can be found in Theophr. de od., Dioscorides de\
    \ materia medica I 4–68 (Wellmann, cf. the edition by Sprengel with commentary), Athen. XII 553. XV\
    \ 685–692, Plin. XII 102ff. XIII 4–5. Phot. bibl. 279, p. 532 Bekker. Poll. VI 104ff. VII 177. X 115.\
    \ Isid. IV 12.\nLiterature: Culmann Salben im Morgen- und Abendland, Leipzig 1877. Sigismund Aromata.\n\
    \ [Haug.]"

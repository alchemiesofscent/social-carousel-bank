  translation: 'Athenaeus XV, p. 690, E:

    Polemon, in his Against Adaeus written in Elis, says that a certain kind of perfume was called planggonion,
    having been invented by a man named Planggon. Sosibios likewise records in Similarities that Megallion
    was similarly named—so called after Megallos the Sicilian.'
  body_markdown: 'Clearchus, of the Peripatetic school, in his On Proverbs, records the saying “Perfume
    on the lentil stew” as a proverb.


    Athenaeus XV, p. 690, E:

    Πολέμων δ ̓ ἐν τοῖς πρὸς Ἀδαῖον παρὰ Ἠλείοις φησὶ μύρον τι πλαγγόνιον καλεῖσθαι, εὑρεθὲν ὑπό τινος
    Πλάγγονος. Ὁμοίως ἱστορεῖ καὶ Σωσίβιος ἐν Ὁμοιότησι, ὡς καὶ τὸ Μεγάλλιον· ὠνομάσθη γὰρ καὶ τοῦτο ἀπὸ
    Μεγάλλου τοῦ Σικελιώτου.

    Polemon, in his Against Adaeus written in Elis, says that a certain kind of perfume was called planggonion,
    having been invented by a man named Planggon. Sosibios likewise records in Similarities that Megallion
    was similarly named—so called after Megallos the Sicilian.'

  text_original: 'εὑρήσεις δὲ τὴν πεδιάδα γεν-

    ναιοτέραν, καίτοι τῶν πλείστων βοτανῶν ἐν τοῖς πεδίοις

    ἀσθενεστέρων γεννωμένων. στύρακα δὲ δῆλον ὅτι τὸν

    ἐν τοῖς καλάμοις φερόμενον ἐκ Παμφυλίας, ἐμβάλλειν

    προσῆκεν, ὀλίγιστόν τε γεννώμενον καὶ τοσούτῳ διαφέροντα

    τοῦ πολλοῦ τούτου στύρακος, ὅσον ὁ Φαλερῖνος οἶνος τοῦ

    πιπρασκομένου κατὰ τὰ καπηλεῖα.'

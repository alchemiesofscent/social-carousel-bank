  source_line_start: 74
  source_line_end: 90
  topics: *id001
  tags: []
  title: 'Galenus Med., De antidotis libri ii (0057: 078)'
  summary: “Claudii Galeni opera omnia, vol. 14”, Ed. Kühn, C.G.
  source:
    author: Galenus Med.
    work: 'De antidotis libri ii (0057: 078)'
    citation_raw: 'Galenus Med., De antidotis libri ii (0057: 078)'
    citation_normalized: 'Galenus Med., De antidotis libri ii (0057: 078)'
  text_original: 'διὰ

    γὰρ τὸ πλῆθος τῶν γενομένων βοτανῶν ἐν τῇ νήσῳ οὐ

    πάνυ τι πανουργεῖν ἐπιχειροῦσιν οἱ κατ'' αὐτὴν βοτανικοὶ,

    οὐ μὴν οὐδ'' ἡ καινουργία μεγάλη, καθάπερ ἐπ'' ἄλλων, ἀλλ''

    ἀντὶ τοῦ χυλὸν ἀψινθίου μόνου ποιήσασθαι πρασίου μι-

    γνύουσιν, ἤ τι τοιοῦτον παραποιοῦσι μικρὸν, ὥστε τοὺς ἐν

    Ῥώμῃ μυροπώλας ὠνουμένους καθ'' ἕκαστον ἔτος τὰ πλήρη

    τῶν φαρμάκων ἀγγεῖα τὰ πλεκτὰ, πρῶτον μὲν ἕκαστον αὐ-

    τὸν διδάσκεσθαι γνωρίζειν, εἰ καὶ μὴ πρότερον ἑορακώς

    τις εἴη.'
  translation: For due to the abundance of plants that have appeared on the island, the local botanists
    do not attempt anything particularly cunning, nor is there great novelty, as with others, but instead
    of making a juice from wormwood alone, they mix it with leek, or make a small modification like this,
    so that the perfumers in Rome, when buying the complete vessels of drugs each year, must first learn
    to recognize each one, even if one has not seen it before.
  body_markdown: "Galenus Med., De antidotis libri ii (0057: 078)\n“Claudii Galeni opera omnia, vol. 14”,\
    \ Ed. Kühn, C.G.\nLeipzig: Knobloch, 1827, Repr. 1965.\nVolume 14, page 10, line 9\n\n           \
    \                                                    διὰ\nγὰρ τὸ πλῆθος τῶν γενομένων βοτανῶν ἐν τῇ\
    \ νήσῳ οὐ\nπάνυ τι πανουργεῖν ἐπιχειροῦσιν οἱ κατ' αὐτὴν βοτανικοὶ,\nοὐ μὴν οὐδ' ἡ καινουργία μεγάλη,\
    \ καθάπερ ἐπ' ἄλλων, ἀλλ'\nἀντὶ τοῦ χυλὸν ἀψινθίου μόνου ποιήσασθαι πρασίου μι-\nγνύουσιν, ἤ τι τοιοῦτον\
    \ παραποιοῦσι μικρὸν, ὥστε τοὺς ἐν\nῬώμῃ μυροπώλας ὠνουμένους καθ' ἕκαστον ἔτος τὰ πλήρη\nτῶν φαρμάκων\
    \ ἀγγεῖα τὰ πλεκτὰ, πρῶτον μὲν ἕκαστον αὐ-\nτὸν διδάσκεσθαι γνωρίζειν, εἰ καὶ μὴ πρότερον ἑορακώς\n\
    τις εἴη. \n\nFor due to the abundance of plants that have appeared on the island, the local botanists\
    \ do not attempt anything particularly cunning, nor is there great novelty, as with others, but instead\
    \ of making a juice from wormwood alone, they mix it with leek, or make a small modification like\
    \ this, so that the perfumers in Rome, when buying the complete vessels of drugs each year, must first\
    \ learn to recognize each one, even if one has not seen it before."
  notes:
    editorial:
    - 'Removed bibliography lead from translation: “Claudii Galeni opera omnia, vol. 14”, Ed. Kühn, C.G.
      | Leipzig: Knobloch, 1827, Repr. 1965.'

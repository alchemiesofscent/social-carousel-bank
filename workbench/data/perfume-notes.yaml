    \ ἐν τῇ πεντεκαιδεκάτῃ καὶ εἰκοστῇ τῶν Ἱστοριῶν τάδε γράφει· «Λακεδαιμόνιοι εἰς μὲν τὰ φειδίτια οὐκ\

  text_original: "ΠΕΔΑΝΙΟΥ ΔΙΟΣΚΟΥΡΙΔΟΥ ΑΝΑΖΑΡΒΕΩΣ\n   ΠΕΡΙ ΥΛΗΣ ΙΑΤΡΙΚΗΣ\n    ΛΟΓΟΣ ΠΡΩΤΟΣ\n Πολλῶν οὐ\
    \ μόνον ἀρχαίων ἀλλὰ καὶ νέων συνταξαμένων\nπερὶ τῆς τῶν φαρμάκων σκευασίας τε καὶ δυνάμεως καὶ δοκιμα-\n\
    σίας, φίλτατε Ἄρειε, πειράσομαι παραστῆσαί σοι μὴ κενὴν μηδὲ\nἄλογον ὁρμὴν ἐσχηκέναι με πρὸς τήνδε\
    \ τὴν πραγματείαν διὰ τὸ\nτοὺς μὲν αὐτῶν μὴ τετελειωκέναι, τοὺς δὲ ἐξ ἱστορίας τὰ πλεῖστα\nἀναγράψαι.\
    \ <Ἰόλλας> μὲν γὰρ ὁ Βιθυνὸς καὶ <Ἡρακλείδης> ὁ\nΤαραντῖνος ἐπ' ὀλίγον ἥψαντο τῆς αὐτῆς πραγματείας\
    \ τὴν\nβοτανικὴν παντελῶς ἐάσαντες παράδοσιν, οὐ μὴν οὐδὲ τῶν\nμεταλλικῶν ἢ ἀρωμάτων πάντων ἐμνημόνευσαν.\
    \ <Κρατεύας>\nδὲ ὁ ῥιζοτόμος καὶ <Ἀνδρέας> ὁ ἰατρός – οὗτοι γὰρ δοκοῦσιν\nἀκριβέστερον τῶν λοιπῶν\
    \ περὶ τοῦτο τὸ μέρος ἀνεστράφθαι –\nπολλὰς ῥίζας εὐχρηστοτάτας καί τινας βοτάνας ἀπαρασημειώ-\nτους\
    \ εἴασαν. πλὴν τοῖς μὲν ἀρχαίοις μαρτυρητέον μετὰ τῆς\nὀλιγότητος τῶν παραδοθέντων καὶ τὴν ἀκρίβειαν\
    \ προσπαραλα-\nβοῦσι, τοῖς μέντοι νέοις οὐ συγκαταθετέον, ὧν ἐστι <Βάσσος>\nἸουλαῖος καὶ <Νικήρατος>\
    \ καὶ <Πετρώνιος Νίγερ> τε καὶ\n<Διόδοτος>, Ἀσκληπιάδειοι πάντες, οἳ τὴν μὲν πᾶσι σύμφυλον\nκαὶ γνώριμον\
    \ ὕλην ἠξίωσαν ἐπὶ ποσὸν ἀναγραφῆς ἀκριβοῦς,\nτὰς δὲ τῶν φαρμάκων δυνάμεις καὶ δοκιμασίας ἐξ ἐπιδρομῆς\n\
    παρέδοσαν, οὐ τῇ πείρᾳ τὴν ἐνέργειαν αὐτῶν κανονίζοντες, τῇ\nδὲ τῆς αἰτίας κενοφωνίᾳ εἰς ὄγκων διαφορὰς\
    \ ἕκαστον αὐτῶν\nἀναφέροντες μετὰ τοῦ καὶ ἄλλα ἀντ' ἄλλων γράφειν. Ὁ γοῦν\nδιαπρεπὴς δοκῶν εἶναι ἐν\
    \ αὐτοῖς <Νίγερ> τὸ Εὐφόρβιόν φησιν\nὀπὸν εἶναι χαμελαίας γεννωμένης ἐν Ἰταλίᾳ καὶ τὸ ἀνδρόσαι-\n\
    μον ταὐτὸ ὑπάρχειν ὑπερικῷ, ἀλόην δὲ ὀρυκτὴν ἐν Ἰουδαίᾳ γεν-\nνᾶσθαι, καὶ ἄλλα τούτοις ὅμοια πλεῖστα\
    \ παρὰ τὴν ἐνάργειαν\nἐκτίθεται ψευδῶς, ἅπερ ἐστὶ τεκμήρια οὐκ αὐτοψίας ἀλλὰ τῆς\nἐκ παρακουσμάτων\
    \ ἱστορίας. ἥμαρτον δὲ καὶ περὶ τὴν τάξιν,\nοἱ μὲν ἀσυμφύλους δυνάμεις συγκρούσαντες, οἱ δὲ κατὰ στοι-\n\
    χεῖον καταγράψαντες, διέζευξάν <τε> τῆς ὁμογενείας τά τε γένη\nκαὶ τὰς ἐνεργείας αὐτῶν, ὡς διὰ τοῦτο\
    \ ἀσυμμνημόνευτα γί-\nνεσθαι.\n ἡμεῖς δὲ ὡς εἰπεῖν ἐκ πρώτης ἡλικίας ἄληκτόν τινα ἔχον-\nτες ἐπιθυμίαν\
    \ περὶ τὴν ἐπίγνωσιν τῆς ὕλης καὶ πολλὴν γῆν\nἐπελθόντες – οἶσθα γὰρ ἡμῖν στρατιωτικὸν τὸν βίον –\
    \ συν-\nαγηόχαμεν τὴν πραγματείαν ἐν πέντε βιβλίοις σοῦ προτρεψα-\nμένου, ᾧ καὶ τὴν σύνταξιν ἀνατίθεμεν,\
    \ εὐχάριστον ἐκπληροῦντες\nπάθος δι' ἣν ἔχεις πρὸς ἡμᾶς διάθεσιν, φύσει μὲν πρὸς πάν-\nτας τοὺς ἀπὸ\
    \ παιδείας ἀναγομένους οἰκειούμενος, μάλιστα δὲ\nπρὸς τοὺς ὁμοτέχνους, ἰδιαίτερον δὲ πρὸς ἡμᾶς. δεῖγμα\
    \ δὲ οὐ\nσμικρὸν τῆς ἐν σοὶ καλοκἀγαθίας καὶ ἡ τοῦ κρατίστου <Λαι-\nκανίου Βάσσου> πρὸς σὲ διάθεσις,\
    \ ἣν ἔγνωμεν συνδιάγοντες\nὑμῖν ἀξιοζήλωτον τὸ παρ' ἀμφοτέρων ὑμῶν πρὸς ἀλλήλους εὔ-\nνουν ὁρῶντες.\
    \ παρακαλοῦμεν δὲ σὲ καὶ τοὺς ἐντευξομένους τοῖς\nὑπομνήμασι μὴ τὴν ἐν λόγοις δύναμιν ἡμῶν σκοπεῖν,\
    \ ἀλλὰ τὴν\nἐν τοῖς πράγμασι μετ' ἐμπειρίας ἐπιμέλειαν. μετὰ γὰρ πλεί-\nστης ἀκριβείας τὰ μὲν πλεῖστα\
    \ δι' αὐτοψίας γνόντες, τὰ δὲ ἐξ\nἱστορίας τῆς πᾶσι συμφώνου καὶ ἀνακρίσεως τῶν παρ' ἑκάστοις\nἐπιχωρίων\
    \ ἀκριβώσαντες πειρασόμεθα καὶ τῇ τάξει διαφόρῳ\nχρήσασθαι καὶ τὰ γένη κατὰ τὰς δυνάμεις ἑκάστου αὐτῶν\
    \ ἀνα-\nγράψασθαι. ὅτι γε μὴν ἀναγκαῖος ὑπάρχει ὁ περὶ φαρμάκων\nλόγος, παντί που δῆλον, συνεζευγμένος\
    \ ὅλῃ τῇ τέχνῃ καὶ τὴν\nἀφ' ἑαυτοῦ συμμαχίαν ἀήττητον παντὶ μέρει παρεχόμενος, καὶ\nδιότι δύναται\
    \ αὔξεσθαι κατά τε τὰς σκευασίας καὶ τὰς μείξεις\nκαὶ τοὺς ἐπὶ τῶν παθῶν πειρασμοὺς πλεῖστα συμβαλλομένης\n\
    τῆς περὶ ἕκαστον τῶν φαρμάκων γνώσεως. προσπαραλημψόμεθα\nδὲ καὶ τὴν συνήθη καὶ σύμφυλον ὕλην, ἵνα\
    \ ἡ γραφὴ γένηται\nτελεία.\n πρὸ πάντων οὖν φροντίζειν τῆς ἀποθέσεως καὶ συλλογῆς\nἑκάστου κατὰ τοὺς\
    \ οἰκείους καιροὺς προσήκει· παρὰ γὰρ δὴ\nτούτους ἢ ἐνεργῆ ἢ ἐξίτηλα γίνεται τὰ φάρμακα· αἰθρίου γὰρ\n\
    ὄντος τοῦ καταστήματος συλλέγειν δεῖ. μεγάλη γὰρ κἂν τούτῳ\nὑπάρχει διαφορὰ παρὰ τὸ αὐχμῶν ἢ ὄμβρων\
    \ παραγινομένων\nτὴν συλλογὴν ποιεῖσθαι, ὡς καὶ παρὰ τὸ ὀρεινοὺς καὶ ὑψηλοὺς\nκαὶ διαπνεομένους καὶ\
    \ ψυχροὺς καὶ ἀνύδρους εἶναι τοὺς τόπους·\nἰσχυρότεραι γάρ εἰσιν αἱ δυνάμεις αὐτῶν. αἱ δὲ ἐν πεδινοῖς\n\
    καὶ καθύγροις <τόποις> καὶ κατασκίοις καὶ μὴ διαπνεομένοις\nἀτονώτεραι κατὰ τὸ πλεῖστον, καὶ μᾶλλον\
    \ αἱ μὴ καθ' ὥραν\nεὐκαίρως συλλεγεῖσαι ἢ δι' ἀσθένειαν ἐφθινηκυῖαι. οὐκ ἀγνο-\nητέον μέντοι ὅτι πολλάκις\
    \ τὰ τοιαῦτα παρὰ τὴν ἰδιότητα τῆς\nχώρας καὶ παρὰ τὴν σύγκρασιν τοῦ ἔτους τάχιον ἢ βράδιον\nἀκμάζει,\
    \ ἔνια δὲ καὶ παρὰ τὴν ἑαυτῶν ἰδιότητα ἐν χειμῶνι ἄνθη\nτε καὶ φύλλα φέρει, τινὰ δὲ καὶ δὶς τοῦ ἔτους\
    \ ἀνθοφορεῖ. τὸν\nδὲ βουλόμενον ἐν τούτοις ἐμπειρίαν ἔχειν δεῖ κατά τε τὴν ἀρτι-\nφυῆ βλάστησιν ἐκ\
    \ τῆς γῆς καὶ ἀκμάζουσι καὶ παρηκμακόσι παρα-\nτυγχάνειν· οὔτε γὰρ ὁ τῇ βλαστήσει ἐντετυχηκὼς μόνον\
    \ δύνα-\nται τὸ ἀκμάζον γνωρίσαι οὔτε ὁ ἑωρακὼς τὰ ἀκμάζοντα τὸ\nἀρτιφυὲς ἐπιγνῶναι. παρὰ γὰρ τοὺς\
    \ μετασχηματισμοὺς τῶν\nφύλλων καὶ τὰ μεγέθη τῶν καυλῶν καὶ ἀνθῶν καὶ καρπῶν καί\nτινας ἄλλας ἰδιότητας\
    \ μεγάλη πλάνη γίνεται ἐπ' ἐνίων τοῖς μὴ\nοὕτω τὴν θέαν ποιησαμένοις. παρὰ ταύτην γοῦν τὴν αἰτίαν\n\
    τινὲς τῶν ἀναγραψαμένων ἐπλανήθησαν εἰπόντες τινὰ μήτε\nἄνθη μήτε καυλὸν μήτε καρπὸν φέρειν, καθάπερ\
    \ ἐπὶ τῆς ἀγρώ-\nστεως καὶ βηχίου καὶ πενταφύλλου. ὁ δὲ πολλάκις ἐντετευχὼς\nαὐτοῖς καὶ ἐν πολλοῖς\
    \ τόποις μάλιστα τὴν ἐπίγνωσιν ποιήσεται.\nχρὴ μέντοι εἰδέναι ὅτι ἔνια τῶν βοτανικῶν φαρμάκων ἐπὶ\n\
    πολλὰ ἔτη διαμένει, οἷον ἐλλέβορος λευκὸς καὶ μέλας, τὰ δὲ\nλοιπὰ μέχρι τριετίας ἐστὶν εὔχρηστα. τὰ\
    \ μὲν οὖν ἐρνώδη, ὧν\nἐστι στοιχάς, χαμαίδρυς, πόλιον, ἁβρότονον, σέριφον, ἀψίνθιον,\nὕσσωπον καὶ\
    \ τὰ ὅμοια τούτοις, συλλέγειν δεῖ ἐγκύμονα τῶν\nσπερμάτων, ἄνθη δὲ πρὸ τῆς ἀποπτώσεως αὐτῶν, τοὺς\
    \ δὲ καρ-\nποὺς πεπείρους ὄντας, καὶ τὰ σπέρματα δὲ ἀρχόμενα ξηραί-\nνεσθαι πρὸ τοῦ ἀπορρεῖν· χυλίζειν\
    \ δὲ τὰς βοτάνας ἀρτιβλάστων\nὄντων τῶν καυλῶν, ὁμοίως καὶ τὰ φύλλα, ὀποὺς δὲ καὶ δάκρυα\nλαμβάνειν\
    \ τέμνοντας ἐν ἀκμῇ ἔτι τοὺς καυλούς, τὰς δὲ εἰς\nἀπόθεσιν ῥίζας καὶ χυλίσματα καὶ φλοιοὺς ἀφαιρεῖν\
    \ ἀρχομένων\nφυλλορροεῖν τῶν βοτανῶν· καὶ τὰς μὲν καθαρὰς αὐτόθεν ξη-\nραίνειν ἐν τόποις ἀνοτίστοις,\
    \ τὰς δὲ μετεχούσας γῆς ἢ πηλοῦ\nπλύνειν ὕδατι. ἀποτίθεσθαι δὲ καὶ ἄνθη καὶ ὅσα εὐώδη τυγ-\nχάνει\
    \ ἐν κιβωτίοις φιλυρίνοις ἀνοτίστοις, ἔστι δ' ὅτε καὶ ἐν χάρ-\nταις ἢ φύλλοις χρησίμως περιδεῖται\
    \ πρὸς συμμονὴν τῶν σπερ-\nμάτων. πρὸς δὲ τὰ ὑγρὰ φάρμακα ἁρμόσει ὕλη πᾶσα ἐξ\nἀργύρου ἢ ὑάλου ἢ κεράτων\
    \ γεγενημένη, καὶ ὀστρακίνη δὲ ἡ μὴ\nἀραιὰ εὔθετος, ξυλίνων δὲ ὅσα ἐκ πύξου κατασκευάζεται. τὰ\nδὲ\
    \ χαλκᾶ ἀγγεῖα ἁρμόσει πρὸς τὰ ὀφθαλμικὰ ὑγρὰ καὶ ὅσα δι'\nὄξους ἢ πίσσης ὑγρᾶς ἢ κεδρίας σκευάζεται·\
    \ στέατα δὲ καὶ\nμυελοὺς ἐν κασσιτερίνοις ἀποτίθεσθαι."

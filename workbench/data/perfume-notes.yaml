    \ today, when I already possess such things for so long? But since I have been instructed by Asclepius\
    \ at Pergamon to feed a partridge, fumigated with frankincense, and since this incense is now so rare\
    \ among us that the gods are worshipped with roasted grain and bay leaves instead, I ask for fifty\
    \ talents of frankincense, so that I may serve the gods and be served myself.” The emperor granted\
    \ the frankincense with praise, blushing as he said that the request was a small one."

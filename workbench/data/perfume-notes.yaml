  translation: "Special among the materials that cure by smell are what Dioscorides calls aromata. The\
    \ term is usually thought to mean something like ‘exotic spices’ (rare commodities from abroad), but\
    \ there are indications he is using it in a technical sense. In many Greek sources, aromata refer\
    \ to the spices brought from the hot and dry regions of Ethiopia (Somali peninsula), Arabia Felix\
    \ (the southern portion of the Arabian Peninsula), Syria-Palestine (Eastern Mediterranean), and India.\
    \ Aromata in this sense have been discussed extensively by Detienne, but the sense in Dioscorides\
    \ that I am interested in does not overlap with his discussion.[ ]; for Dioscorides uses aromata to\
    \ refer to materials discussed in a section of his first book that begins with iris, acorus (or yellow\
    \ flag), meon (or baldmoney), and cyperus, materials which, while being called aromata and described\
    \ as fragrant, warming, and subtle, are not materials associated with Arabia, other hot and dry lands,\
    \ or their spices, (as are, for example, cardamom, cinnamon, or myrrh). After these aromata, the book\
    \ continues with a discussion of oils, perfumes (which are oils steeped with aromata, flowers, and\
    \ other ingredients), aromatic woods, resins, and fruits, all which seem to be connected.\nThe list\
    \ is interesting because, while it does not pick out what one normally thinks of as spices, it also\
    \ does not pick out fragrant materials more generally. Many herbs, roots, and flowers that Dioscorides\
    \ calls fragrant are not listed with the aromata. Herpyllos (tufted thyme) and sampsukhon (marjoram)\
    \ are fragrant plants, but they are found in book three in the section on herbs.[ ] Sampsoukhinon\
    \ (marjoram perfume), however, is included in the fragrant materials of the first book.[ ] The term\
    \ ‘aromata’ therefore does not pick out all fragrant plant materials, all warming ones, or even all\
    \ foreign spices; rather it picks out a specific subset of them.[ ] Since perfumes are organized along\
    \ with them, it is plausible that he considers them all to be a similar class of fragrant medicines.\n\
    We find evidence that aromata represented a specific class of drugs in sources beyond Dioscorides\
    \ as well. When he introduces his treatise, Dioscorides complains that two of his predecessors ‘had\
    \ failed to mention all aromata’.[ ] This suggests aroma is a class of material his predecessors and\
    \ his audience would recognise---and so would have some idea what counts as an aroma and what does\
    \ not.[ ]\nAnother source for aromata as a class is Galen of Pergamum, a Greek-speaking physician\
    \ from Pergamum in Asia Minor, writing in the second and third century CE (we will return to Galen\
    \ below). In his pharmacological writings, Galen mentions a ‘catalogue of aromata’ used when preparing\
    \ medicines, and he gives examples of what this catalogue contained: ‘spikenard, amomum, calamus,\
    \ iris, and labdanum, and the leaf of malabathrum, storax and bdellium, opobalsamum, balsam, and xylobalsamum’.[\
    \ ] These entries overlap with entries in Dioscorides’ first book (see table 1), suggesting either\
    \ Galen is taking his list from Dioscorides or that they are working in a common tradition. There\
    \ are also some differences, which suggests the catalogue was subject to revision.\nA third source\
    \ is Aulus Cornelius Celsus, a medical layperson who composed a work On Medicine a generation or so\
    \ before Dioscorides. He also gives a list of aromata that overlaps to a large extent with Dioscorides’\
    \ and Galen’s lists; but it contains material Dioscorides discusses in a later, non-aromatic section\
    \ of On Medical Materials, including plants like abrotonum, galbanum and panaces, which appear in\
    \ book three on herbs.[ ] One way to account for the difference between Dioscorides and Celsus is\
    \ to think they are using the term ‘aromata’ in different senses. Celsus may reserve the term for\
    \ foreign fragrant materials: he remarks that some items in his list are grown locally and imported,\
    \ but what he means when he mentions them are ‘not those plants that are grown here, but those that\
    \ are imported with the aromata’.[ ]\nIf, for Celsus, being an import is a condition for being an\
    \ aroma, this would suggest that the list of plants considered aromata was fluid, with disagreements\
    \ among doctors and others concerning what counts and what does not. Disagreement was already suggested\
    \ by the preface of Dioscorides’ work mentioned above, who claimed his predecessors had not mentioned\
    \ ‘all the aromata’. Nevertheless, whatever disagreements there may have been, Celsus’ list largely\
    \ agrees with Dioscorides and Galen (see table 1), suggesting there was a largely stable group of\
    \ materials known as aromata that these authors were familiar with.\n[Insert table 1 about here]\n\
    They criteria by which aromata were distinguished from other kinds of materials are not entirely clear.\
    \ Like the contemporary English word, ‘spice’, it seems the term ‘aroma’ was sensitive to context.\
    \ However, one possibiltiy is that it was due to their unique way of acting on the body. Galen distinguishes\
    \ aromata by ‘their ability to dissolve and disperse into vapor the fluid that has accumulated in\
    \ the body’,[ ] which they can do because ‘they are all subtle and able to dry accompanied by an ability\
    \ to heat’.[ ] Dioscorides, too, says he groups aromata together because they have a common way of\
    \ acting on the body, although he does not explain the mechanism in detail. Both seem less concerned\
    \ than Aristotle to say that we find the smell flowers and perfumes pleasant (and sulphur unpleasant)\
    \ because this promotes our well-being. They do, however, recognize the unique ability of some plants,\
    \ especially aromata, to heal through smell.\nList from Celsus (early first century CE), On medicine\
    \ book 3, chapter 21\tDioscorides (mid-first century CE), On medical materials\tGalen’s catalogue\
    \ of aromata (late second century CE), De methodo medendi 7.4\tEnglish Translation(s)\nTable 1: List\
    \ of Aromata in Galen, compared with parallels in Dioscorides and Celsus,\nin chronological order"

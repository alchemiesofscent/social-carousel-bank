  translation: 'For although I am thoroughly familiar with ointments that brighten the body and with preparations
    that preserve the breasts for maidens over a long period—also with treatments that preserve the small
    size of the testicles in prepubescent boys and delay the growth of hair—I am ashamed to write of such
    things, and much more so of what Criton has written: compresses of perfumes in garments, fragrant
    dyes for clothing, sachets for bedrooms and walkways, and the various sorts of incense, unguents,
    and oils—for these lie outside the bounds of medicine.

    1.25.5

    1.26.1

    1.26.5

    1.26.6

    1.27.1

    1.27.5

    1.28.1

    1.28.5

    1.29.1

    1.29.5

    One must approach the gods having purified oneself, cleansed, brightened, sprinkled, rinsed, washed,
    consecrated, having practiced chastity, being consecrated, sanctified, with a pure mind, in newly
    wrought raiment, in freshly laundered clothing. To approach the gods, to make an approach to the gods,
    to pray to the gods, to raise one''s hands, to entreat the gods, to turn toward the gods, to invoke
    the gods, to call upon the gods, to ask good things from the gods, to flee to the gods for refuge,
    to supplicate, to implore, to entreat earnestly, to offer sacrifice to the gods, to perform sacred
    rites, to conduct religious ceremonies, to slaughter oxen, to offer a hecatomb, to carry out a sacrificial
    feast, to sing paeans, to chant hymns, to begin sacred rites, to consecrate frankincense, to burn
    incense, to release aromata into the fire. Aromata and are also called thumiamata; and Thucydides
    (?) has referred to them as “pure offerings,” setting them in contrast to the bloodied and slaughtered
    victims—myrrh and frankincense.

    To lead sacrificial victims to the altars, to stain the altars with blood, to offer a tithe, to pray
    over a bull or other animal, to pour libations, to pour fully, to pour additionally, to offer garlands,
    to place garlands, to bring offerings of garlands, of myrtle wreaths, to pour, to pour completely,
    to pour further, to place thigh bones, to throw fat pieces, to inspect entrails, to partake in the
    sacrifice, to begin sacred rites, to make an offering of entrails, to sacrifice a tithe, to set aside
    a tithe, to dedicate, to make a dedication, to dedicate to the temple.

    The dedications are for the most part garlands, libation bowls, cups, censers, golden chains, silver
    ornaments, wine-jugs, small amphorae. And the Pythia cleared the streets with sacrificial smoke. To
    bring first-fruits, to offer first-fruit portions, to offer portions, boiled grains, sacrificial cakes,
    sacred loaves, pelanoi, garlands, baked goods, ribbons, branches, myrtle, flowers. To sing paeans,
    to chant a paean.

    The ololygē—ritual shrieking—is used by women. The ritual practices include sacrifice, ox-sacrifice,
    sacrificial feasting, invocation of gods, calling upon gods, entreaty, approach, sacred service, religious
    rites, supplication, libation. The vapor rising from the altars is called knisa and atmos.

    The sacrificial victims offered must be whole, intact, complete, healthy, unharmed, of full limbs,
    sound-limbed, neither maimed nor burned nor mutilated nor deformed. Solon called the burned and defective
    ones by those names. The ox offered must be one unyoked. Know that the meat from the sacrificial victims
    is called theothyta—god-offerings.'

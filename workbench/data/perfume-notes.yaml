  tags: []
  title: Eustathius Philol., Scr. Eccl., Commentarii ad Homeri Iliadem
  summary: Volume 3, page 604, line 10
  source:
    author: Eustathius Philol.
    work: Scr. Eccl., Commentarii ad Homeri Iliadem
    citation_raw: Eustathius Philol., Scr. Eccl., Commentarii ad Homeri Iliadem
    citation_normalized: Eustathius Philol., Scr. Eccl., Commentarii ad Homeri Iliadem
  text_original: 'Ὅμηρος γὰρ μύρου χρῆσιν μὲν

    οἶδε, κλῆσιν δὲ ἀγνοεῖ, ὁποῖον τὸ βρένθειον καὶ ἡ ξίρις καὶ τὸ ἴρινον [καὶ τὸ

    ἀμαράκινον καὶ τὸ ῥόδινον καὶ τὸ ἢ μεγαλεῖον προπερισπωμένως κατὰ τοὺς

    πολλοὺς ἢ κατὰ τοὺς ἀκριβεστέρους μεγάλλιον προπαροξυτόνως ἐν δυσὶ <λλ>

    μετὰ παραλήγοντος <ι>, ἔτι δὲ καὶ τὸ κάλλος, ὡς ἐν τοῖς εἰς τὴν Ὀδυσσείαν

    περὶ ἀμφοτέρων εἴρηται, καὶ μὴν καὶ τὸ Αἰγύπτιον μύρον, τὸ καλούμενον μὲν

    μετώπιον, σκευαζόμενον δὲ κατὰ τὴν τοῦ Ἀθηναίου ἱστορίαν ἐξ ἐλαίου καὶ

    πικρῶν καρύων, σὺν τούτοις δὲ καὶ τὸ κινναμώμινον καὶ τὸ νάρδινον καὶ τὸ

    τήλινον καὶ τὸ σαμψύχινον, καὶ ἄλλα] ὅσα τοιαῦτα περιᾴδονται.'
  translation: "For Homer knows the use of perfume, but is unaware of its names—such as brentheion, xiris,\
    \ irinum [and amarakinon, rhodinon, and megaleion (according to most with a circumflex accent) or,\
    \ according to the more precise, megallion with a double lambda and an acute on the penult), and also\
    \ kallos, as discussed in the commentary on both epics of the Odyssey. And also the Egyptian perfume,\
    \ called metopion, which according to Athenaeus’ account is prepared from oil and bitter nuts, along\
    \ with cinnamomum, nardinum, telinon, sampsychinon, and other such substances sung of in like manner.\n\
    \ >>> plan to do a post on the egyptian perfume"
  body_markdown: "Eustathius Philol., Scr. Eccl., Commentarii ad Homeri Iliadem\nVolume 3, page 604, line\
    \ 10\n\n                                                          Ὅμηρος γὰρ μύρου χρῆσιν μὲν\nοἶδε,\
    \ κλῆσιν δὲ ἀγνοεῖ, ὁποῖον τὸ βρένθειον καὶ ἡ ξίρις καὶ τὸ ἴρινον [καὶ τὸ\nἀμαράκινον καὶ τὸ ῥόδινον\
    \ καὶ τὸ ἢ μεγαλεῖον προπερισπωμένως κατὰ τοὺς\nπολλοὺς ἢ κατὰ τοὺς ἀκριβεστέρους μεγάλλιον προπαροξυτόνως\
    \ ἐν δυσὶ <λλ>\nμετὰ παραλήγοντος <ι>, ἔτι δὲ καὶ τὸ κάλλος, ὡς ἐν τοῖς εἰς τὴν Ὀδυσσείαν\nπερὶ ἀμφοτέρων\
    \ εἴρηται, καὶ μὴν καὶ τὸ Αἰγύπτιον μύρον, τὸ καλούμενον μὲν\nμετώπιον, σκευαζόμενον δὲ κατὰ τὴν τοῦ\
    \ Ἀθηναίου ἱστορίαν ἐξ ἐλαίου καὶ\nπικρῶν καρύων, σὺν τούτοις δὲ καὶ τὸ κινναμώμινον καὶ τὸ νάρδινον\
    \ καὶ τὸ\nτήλινον καὶ τὸ σαμψύχινον, καὶ ἄλλα] ὅσα τοιαῦτα περιᾴδονται.\n\nFor Homer knows the use\
    \ of perfume, but is unaware of its names—such as brentheion, xiris, irinum [and amarakinon, rhodinon,\

- id: perfume-sellers--theophrastus-phil-fragmenta
  record_type: ancient_passage
  source_layer: ancient
  container_id: perfume-sellers
  source_line_start: 134
  source_line_end: 184
  topics: *id001
  tags: []
  title: Theophrastus Phil., Fragmenta
  summary: Fragment 4, section 40, line 3
  source:
    author: Theophrastus Phil.
    work: Fragmenta
    citation_raw: Theophrastus Phil., Fragmenta
    citation_normalized: Theophrastus Phil., Fragmenta
  text_original: 'Διαφθείρει δὲ τὰ

    μύρα καὶ ὥρα θερμὴ καὶ τόπος καὶ ὁ ἥλιος ἂν τεθῶσι·

    διὸ καὶ οἱ μυροπῶλαι ζητοῦσι τὰς οἰκίας ὑπερῴους

    καὶ μὴ προσηλίους ἀλλ'' ὅτι μάλιστα παλισκίους· ἀφαι-

    ρεῖται γὰρ τὰς ὀσμὰς ὁ ἥλιος καὶ τὸ θερμὸν καὶ ὅλως

    ἐξίστησι τῆς φύσεως μᾶλλον τοῦ ψυχροῦ· τὸ δὲ ψυχρὸν

    καὶ ὁ πάγος εἰ καὶ ἀοσμότερον ποιεῖ διὰ τὸ συστέλλειν,

    ἀλλ'' οὐκ ἀφαιρεῖταί γε τὴν δύναμιν τελέως.

    οὐκ ἀηδῶς γὰρ Ξενοφῶν ‘ἐάν σοι’ φησί ‘δείξω

    δύο ἀδελφῶν τὴν ἴσην οὐσίαν διελομένων τὸν μὲν ἐν τῇ

    πάσῃ ἀπορίᾳ, τὸν δὲ ἐν εὐκολίᾳ, οὐ φανερὸν ὅτι οὐ τὰ

    χρήματα αἰτιατέον ἀλλ'' ἕτερόν τι;’ οὕτως ἐάν σοι δείξω

    δύο γέροντας, δύο πένητας, δύο φεύγοντας, τὸν μὲν ἐν

    τῇ πάσῃ εὐκολίᾳ καὶ ἀπαθείᾳ ὄντα, τὸν δὲ ἐν τῇ πάσῃ

    ταραχῇ, οὐ φανερὸν ὅτι οὐ τὸ γῆρας, οὐ τὴν πενίαν, οὐ

    τὴν ξενίαν αἰτιατέον ἀλλ'' ἕτερόν τι; καὶ ὅπερ Διογένης

    ἐποίησεν πρὸς τὸν πολυτελῆ φάμενον πόλιν εἶναι τὰς

    Ἀθήνας· λαβὼν γὰρ αὐτὸν ἦγεν εἰς τὸ μυροπωλεῖον καὶ

    ἐπυνθάνετο πόσου τῆς κύπρου ἡ κοτύλη. ‘μνᾶς’ φησιν

    ὁ μυροπώλης· ἀνέκραγε ‘πολυτελής γε ἡ πόλις’. ἀπῆγεν

    αὐτὸν πάλιν εἰς τὸ μαγειρεῖον καὶ ἐπυνθάνετο πόσου τὸ

    ἀκροκώλιον. ‘τριῶν δραχμῶν’· ἐβόα ‘πολυτελής γε ἡ

    πόλις’. εἰς τὰ ἔρια πάλιν τὰ μαλακὰ καὶ πόσου τὸ πρό-

    βατον. ‘μνᾶς’ φησίν· ἐβόα ‘πολυτελής γε ἡ πόλις’. ‘δεῦρο

    δή’ φησί. κἀνταῦθα ἄγει αὐτὸν καὶ εἰς τοὺς θέρμους.

    ’πόσου ἡ χοῖνιξ;’ ‘χαλκοῦ’ φησίν· ἀνέκραγεν ὁ Διογένης

    ’εὐτελής γε ἡ πόλις’. πάλιν εἰς τὰς ἰσχάδας, ‘δύο χαλ-

    κῶν’· ‘τῶν δὲ μύρτων;’ ‘δύο χαλκῶν’· ‘εὐτελής γε ἡ πόλις’.

    ὃν τρόπον οὖν ὧδε οὐχ ἡ πόλις εὐτελὴς καὶ <πολυτελής,

    ἀλλ'' ἐὰν μὲν οὕτω ζῇ> πολυτελής, ἐὰν δὲ οὕτως, εὐτε-

    λής, οὕτω καὶ τὰ πράγματα, ἐὰν μὲν αὐτοῖς οὕτω χρῆ-

    ται, εὐπετῆ καὶ ῥᾴδια φανεῖται, ἐὰν δὲ οὕτως, δυσχερῆ.'
  translation: 'The perfumes are spoiled by heat, location, and the sun when exposed; hence, the perfumers
    seek upper rooms that are not exposed to the sun but are as shaded as possible. For the sun removes
    the scents and the heat, and generally alters the nature more than the cold does; while the cold and
    ice, although they make it less fragrant due to contraction, do not completely remove its potency.

    3.1.98.85

    3.1.98.90

    3.1.98.91

    3.1.98.95

    3.1.98.100

    For Xenophon says, ''if I show you two brothers dividing an equal inheritance, one in complete poverty
    and the other in ease, is it not evident that it''s not the money to blame but something else?'' Similarly,
    if I show you two old men, two paupers, two exiles, one in complete ease and apathy, and the other
    in complete turmoil, is it not evident that it''s not old age, not poverty, not exile to blame but
    something else? And what Diogenes did to the man claiming that Athens was an expensive city; taking
    him to the perfumery and asking how much for a cotyla of perfume. ''A mina,'' says the perfumer. Diogenes
    exclaimed, ''Indeed, the city is expensive.'' He then took him to the cookshop and asked the price
    of a fish; ''Three drachmas''; he shouted, ''Indeed, the city is expensive.'' Then to the soft wool
    and asked the price of a sheep. ''A mina,'' he says; Diogenes shouted, ''Indeed, the city is expensive.''
    ''Come here,'' he says, and takes him to the baths. ''How much for a choinix?'' ''A copper coin,''
    he says; Diogenes exclaimed, ''Indeed, the city is cheap.'' Again, to the figs, ''Two coppers''; ''And
    the myrtles?'' ''Two coppers''; ''Indeed, the city is cheap.'' Thus, the city is neither cheap nor
    expensive per se, but if you live this way, it''s expensive, and if that way, it''s cheap. Similarly,
    matters, if used in one way, seem easy and straightforward, but in another, difficult.'
  body_markdown: "Theophrastus Phil., Fragmenta\nFragment 4, section 40, line 3\n\n   Διαφθείρει δὲ τὰ\n\
    μύρα καὶ ὥρα θερμὴ καὶ τόπος καὶ ὁ ἥλιος ἂν τεθῶσι·\nδιὸ καὶ οἱ μυροπῶλαι ζητοῦσι τὰς οἰκίας ὑπερῴους\n\
    καὶ μὴ προσηλίους ἀλλ' ὅτι μάλιστα παλισκίους· ἀφαι-\nρεῖται γὰρ τὰς ὀσμὰς ὁ ἥλιος καὶ τὸ θερμὸν καὶ\
    \ ὅλως\nἐξίστησι τῆς φύσεως μᾶλλον τοῦ ψυχροῦ· τὸ δὲ ψυχρὸν\nκαὶ ὁ πάγος εἰ καὶ ἀοσμότερον ποιεῖ διὰ\
    \ τὸ συστέλλειν,\nἀλλ' οὐκ ἀφαιρεῖταί γε τὴν δύναμιν τελέως. \n\nThe perfumes are spoiled by heat,\
    \ location, and the sun when exposed; hence, the perfumers seek upper rooms that are not exposed to\
    \ the sun but are as shaded as possible. For the sun removes the scents and the heat, and generally\
    \ alters the nature more than the cold does; while the cold and ice, although they make it less fragrant\
    \ due to contraction, do not completely remove its potency.\n\n\n\n\n\n\n\nοὐκ ἀηδῶς γὰρ Ξενοφῶν ‘ἐάν\
    \ σοι’ φησί ‘δείξω\nδύο ἀδελφῶν τὴν ἴσην οὐσίαν διελομένων τὸν μὲν ἐν τῇ\nπάσῃ ἀπορίᾳ, τὸν δὲ ἐν εὐκολίᾳ,\
    \ οὐ φανερὸν ὅτι οὐ τὰ\nχρήματα αἰτιατέον ἀλλ' ἕτερόν τι;’ οὕτως ἐάν σοι δείξω\nδύο γέροντας, δύο\
    \ πένητας, δύο φεύγοντας, τὸν μὲν ἐν\n3.1.98.85\nτῇ πάσῃ εὐκολίᾳ καὶ ἀπαθείᾳ ὄντα, τὸν δὲ ἐν τῇ πάσῃ\n\
    ταραχῇ, οὐ φανερὸν ὅτι οὐ τὸ γῆρας, οὐ τὴν πενίαν, οὐ\nτὴν ξενίαν αἰτιατέον ἀλλ' ἕτερόν τι; καὶ ὅπερ\
    \ Διογένης\nἐποίησεν πρὸς τὸν πολυτελῆ φάμενον πόλιν εἶναι τὰς  \nἈθήνας· λαβὼν γὰρ αὐτὸν ἦγεν εἰς\
    \ τὸ μυροπωλεῖον καὶ\n3.1.98.90\nἐπυνθάνετο πόσου τῆς κύπρου ἡ κοτύλη. ‘μνᾶς’ φησιν\n3.1.98.91\nὁ\
    \ μυροπώλης· ἀνέκραγε ‘πολυτελής γε ἡ πόλις’. ἀπῆγεν\nαὐτὸν πάλιν εἰς τὸ μαγειρεῖον καὶ ἐπυνθάνετο\
    \ πόσου τὸ\nἀκροκώλιον. ‘τριῶν δραχμῶν’· ἐβόα ‘πολυτελής γε ἡ\nπόλις’. εἰς τὰ ἔρια πάλιν τὰ μαλακὰ\
    \ καὶ πόσου τὸ πρό-\n3.1.98.95\nβατον. ‘μνᾶς’ φησίν· ἐβόα ‘πολυτελής γε ἡ πόλις’. ‘δεῦρο\nδή’ φησί.\
    \ κἀνταῦθα ἄγει αὐτὸν καὶ εἰς τοὺς θέρμους.\n’πόσου ἡ χοῖνιξ;’ ‘χαλκοῦ’ φησίν· ἀνέκραγεν ὁ Διογένης\n\
    ’εὐτελής γε ἡ πόλις’. πάλιν εἰς τὰς ἰσχάδας, ‘δύο χαλ-\nκῶν’· ‘τῶν δὲ μύρτων;’ ‘δύο χαλκῶν’· ‘εὐτελής\

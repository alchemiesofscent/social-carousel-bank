  text_original: 'Ἡρακλείδης δὲ ὁ Ποντικὸς ἐν τῷ περὶ Ἡδονῆς 8ΔΕΙΝΙΑΝ

    φησὶ τὸν μυροπώλην διὰ τρυφὴν εἰς ἔρωτας ἐμπεσόντα

    καὶ πολλὰ χρήματα ἀναλώσαντα, ὡς ἔξω τῶν ἐπιθυμιῶν

    ἐγένετο, ὑπὸ λύπης ἐκταραχθέντα ἐκτεμεῖν αὑτοῦ τὰ

    αἰδοῖα, ταῦτα πάντα ποιούσης τῆς ἀκολάστου τρυφῆς.'
  translation: Heraclides Ponticus in his work "On Pleasure" states that Denias the perfumer, through
    indulgence, fell into loves and spent much money, and as he fell out of his desires, distressed by
    sorrow, cut off his genitals, all these actions being caused by unrestrained luxury.
  body_markdown: "Athenaeus Soph., Deipnosophistae (0008: 001)\n“Athenaei Naucratitae deipnosophistarum\
    \ libri xv, 3 vols.”, Ed. Kaibel, G.\nLeipzig: Teubner, 1–2:1887; 3:1890, Repr. 1–2:1965; 3:1966.\n\
    Book 12, Kaibel paragraph 77, line 43\n\nἩρακλείδης δὲ ὁ Ποντικὸς ἐν τῷ περὶ Ἡδονῆς 8ΔΕΙΝΙΑΝ\nφησὶ\
    \ τὸν μυροπώλην διὰ τρυφὴν εἰς ἔρωτας ἐμπεσόντα\nκαὶ πολλὰ χρήματα ἀναλώσαντα, ὡς ἔξω τῶν ἐπιθυμιῶν\n\
    ἐγένετο, ὑπὸ λύπης ἐκταραχθέντα ἐκτεμεῖν αὑτοῦ τὰ\nαἰδοῖα, ταῦτα πάντα ποιούσης τῆς ἀκολάστου τρυφῆς.\
    \ \n\nHeraclides Ponticus in his work \"On Pleasure\" states that Denias the perfumer, through indulgence,\
    \ fell into loves and spent much money, and as he fell out of his desires, distressed by sorrow, cut\
    \ off his genitals, all these actions being caused by unrestrained luxury."
  notes:

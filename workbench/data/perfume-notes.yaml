  text_original: "εἰ γὰρ καὶ ὅτι μάλιστα γιγνώσκω τὰ λαμπρυντικὰ\nτοῦ σώματος σμήγματα καὶ τὰ τῶν τιτθῶν\
    \ διαφυλακτικὰ\nταῖς παρθένοις ἐπὶ πλεῖστον, ἀνήβων τε παιδίων ὄρχεις μι-\nκροὺς διαφυλάττοντα μέχρι\

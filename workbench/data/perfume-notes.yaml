  translation: "Pliny\nCommagene the place\nbook 5, section 66, line 7\n  Iuxta Syria litus occupat, quondam\
    \ terra-\nrum maxuma et plurimis distincta nominibus. namque\nPalaestine vocabatur qua contingit Arabas,\
    \ et Iudaea et\nCoele, dein Phoenice et qua recedit intus Damascena, ac\nmagis etiamnum meridiana\
    \ Babylonia, eadem Mesopotamia\ninter Euphraten et Tigrin quaque transit Taurum Sophene,\ncitra vero\
    \ eam Commagene et ultra Armeniam Adiabene,\nAssyria ante dicta, et ubi Ciliciam attingit Antiochia.\n\
    longitudo eius inter Ciliciam et Arabiam <CCCCLXX> p. est,\nlatitudo a Seleucia Pieria ad oppidum\
    \ in Euphrate Zeugma\n<CLXXV>. qui subtilius dividunt, circumfundi Syria Phoe-\nnicen volunt et esse\
    \ oram maritimam Syriae, cuius pars\n5.67.5\nsit Idumaea et Iudaea, dein Phoenicen, dein Syriam. id\n\
    quod praeiacet mare totum Phoenicium appellatur. ipsa\ngens Phoenicum in magna gloria litterarum inventionis\
    \ et\nsiderum navaliumque ac bellicarum artium.\nAlongside it, Syria occupies the coast—a land once\
    \ the greatest of all, and marked by many different names.\n For it is called Palestine where it borders\
    \ the Arabs, and also Judaea and Coele; then Phoenice,\n and, further inland, Damascene; further still\
    \ to the south, Babylonia, which is the same as Mesopotamia,\n lying between the Euphrates and Tigris;\
    \ and where the Taurus range is crossed, Sophene;\n before that, on this side, Commagene, and beyond\
    \ it Armenia and Adiabene,\n formerly called Assyria; and where it touches Cilicia, Antiochia.\nIts\
    \ length between Cilicia and Arabia is 470 miles,\n its width from Seleucia Pieria to the town of\
    \ Zeugma on the Euphrates is 175.\nThose who distinguish more precisely wish to describe Phoenice\
    \ as encircled by Syria\n and as the coastal region of Syria, of which Idumaea and Judaea form a part,\n\
    \ followed by Phoenice, then Syria.\nThe entire sea lying before it is called the Phoenician Sea.\n\
    \ The Phoenician people themselves are held in great esteem for inventing letters,\n and for their\
    \ knowledge of the stars, navigation, and military arts.\nCommagene Ointment\npliny the elder 10\n\
    \  Et anseri vigil cura Capitolio testata defenso,\nper id tempus canum silentio proditis rebus, quam\
    \ ob cau-\nsam cibaria anserum censores in primis locant. quin et\nfama amoris A<e>gi<i> dilecta forma\
    \ pueri nomine . . . Olenii et\n10.51.5\nGlauces Ptolemaeo regi cithara canentis, quam eodem tem-\n\
    pore et aries amasse proditur. potest et sapientiae videri\nintellectus <i>is esse: ita comes perpetuo\
    \ adhaesisse Lacydi\nphilosopho dicitur, nusquam ab eo, non in publico, non in\nbalineis, non noctu,\
    \ non interdiu, digressus.\n10.52.1\n  Nostri sapientiores, qui eos iecoris bonitate novere.\nfartilibus\
    \ in magnam amplitudinem crescit, exemptum quo-\nque lacte mulso augetur. nec sine causa in quaestione\
    \ est,\nquis tantum bonum invenerit, Scipio Metellus vir consularis\n10.52.5\nan Marcus Seius eadem\
    \ aetate eques Romanus. sed, quod\nconstat, Messalinus Cotta, Messalae oratoris filius, palmas\npedum\
    \ ex <i>is torrere atque patinis cum gallinaceorum cristis\ncondire repperit; tribuetur enim a me\
    \ culinis cuiusque palma\n10.53.1\ncum fide. mirum in hac alite a Morinis usque Romam pe-\ndibus venire.\
    \ fessi proferuntur ad primos; ita ceteri sti-\npatione naturali propellunt eos.\n  Candidorum alterum\
    \ vectigal in pluma. velluntur qui-\n10.53.5\nbusdam locis bis anno, rursus plumigeri vestiuntur.\
    \ mollior\nquae corpori proxima, et e Germania laudatissima. candidi\n10.54.1\nibi, verum minores;\
    \ gantae vocantur. pretium plumae\neorum in libras denarii quini. et inde crimina plerumque\nauxiliorum\
    \ praefectis, a vigili statione ad haec aucupia di-\nmissis cohortibus totis; eoque deliciae processere,\
    \ ut sine\n10.54.5\nhoc instrumento durare iam ne virorum quidem cervices\nposs<i>nt.\n10.55.1\n \
    \ Aliud repperit Syriae pars quae Commagene vocatur,\nadipem eorum in vase aereo cum cinnamo nive\
    \ multa obru-\ntum ac rigore gelid<o> maceratum ad usum praeclari medica-\nminis, quod ab gente dicitur\
    \ Commagenum.\n10.56.1\n  Anseri<ni> generis sunt chenalopeces et, quibus\nlautiores epulas non novit\
    \ Britannia, c<h>enerotes, fere ansere\nminores. decet tetraonas suus nitor absolutaque nigritia,\n\
    in superciliis cocci rubor. alterum eorum genus vulturum\n10.56.5\nmagnitudinem excedit, quorum et\
    \ colorem reddit, nec ulla\nales, excepto struthocamelo, maius corpore inplens pondus,\nin tantum\
    \ aucta, ut in terra quoque inmobilis prehendatur.\ngignunt eos Alpes et septentrionalis regio. in\
    \ vivariis sa-\n10.57.1\nporem perdunt. moriuntur contumacia spiritu revocato.\nproximae <i>is sunt\
    \ quas Hispania aves tardas appellat, Grae-\nodoris taedium extemplo sequitur.\nAnd the vigilance\
    \ of the goose, attested in the defense of the Capitol, stands as proof—during that time, when the\
    \ silence of the dogs betrayed the situation—why the censors place the geese’s rations among the first\
    \ priorities. Indeed, there is even a tale of affection: Aegis was loved for his beauty by the boy\
    \ named ... Olenius and Glaucis, who sang to the cithara for King Ptolemy, and it is said that at\
    \ the same time a ram fell in love with him as well. This may even seem like an indication of intelligence:\
    \ such a goose is said to have constantly accompanied the philosopher Lacydes, never leaving his side—neither\
    \ in public, nor at the baths, nor by night, nor by day.\nOur own sages esteem them for the quality\
    \ of their liver. When they are fattened, they grow to a great size, and even more so when fed with\
    \ sweetened milk. It remains uncertain who first discovered such a delicacy—whether it was Scipio\
    \ Metellus, a man of consular rank, or Marcus Seius, a Roman knight of the same era. But what is established\
    \ is that Messalinus Cotta, son of the orator Messala, discovered the practice of roasting their feet\
    \ and serving them in dishes with the crests of cocks; and I shall faithfully attribute each culinary\
    \ innovation to its inventor.\nIt is astonishing that this bird can travel on foot from the Morini\
    \ all the way to Rome. Those that grow tired are brought to the front, and the rest naturally push\
    \ them along through sheer massed movement.\nAnother source of revenue from white geese is their feathers.\
    \ In some regions they are plucked twice a year, and then grow their feathers back. The feathers closest\
    \ to the body are softer, and those from Germany are considered the finest. The geese there are white,\
    \ but smaller, and are called gantae. Their feathers sell at a rate of five denarii per pound. Because\
    \ of this, many charges have arisen against commanders of auxiliaries, who dismissed entire cohorts\
    \ from their watch posts to go bird hunting; such has been the advance of luxury that even the necks\
    \ of men can no longer endure without this item.\nAnother discovery comes from the region of Syria\
    \ known as Commagene: the fat of these geese is buried in snow along with cinnamon in a bronze vessel\
    \ and left to steep in the freezing cold, producing an excellent medicinal preparation called Commagenum\
    \ after its region.\nOf the goose-kind are the chenalopeces, and those called chenerotes, which are\
    \ somewhat smaller than geese and make for finer feasts—though Britain is unaware of such delicacies.\
    \ The tetrao is admired for its sheen and deep black color, with a crimson flush on its brows. A second\
    \ kind exceeds even the size of a vulture, matching it in color too, and no bird—save the ostrich—surpasses\
    \ it in sheer mass, so greatly has it grown that it may be seized on the ground without resistance.\
    \ They are bred in the Alps and the northern regions. In captivity, they lose their flavor. They die\
    \ in obstinance when their breath is forcibly drawn back.\nNearest to them are the birds which Spain\
    \ calls slow-fliers, and which the Greeks call ōtides—condemned as food: when the marrow is released\
    \ from their bones, an offensive odor instantly follows.\nPliny 29\nbook 29, section 55, line 2\n\
    \  De anserum ovis magnae utilitatis ipsoque ansere\ndicturi hoc in volumine debemus honorem et Commageno,\n\
    clarissimae rei. fit ex adipe anserum – alioqui celeber-\nrimi usus, set ad hoc in Commagene Syriae\
    \ parte – cum\ncinnamo, casia, pipere albo, herba quae Commagene vo-\ncatur, obrutis nive vasis, odore\
    \ iucundo, utilissimum ad\nperfrictiones, convulsiones, caecos aut subitos dolores\nomniaque, quae\
    \ acopis curantur, unguentumque pariter et\nmedicamentum est. fit et in Syria alio modo, avium adipe\n\
    curato ut dicemus, additis erysisceptro, xylobalsamo, phoe-\nnice, item tuso calamo singulorum pondere\
    \ qu<o>d sit adipis,\ni<n> vino bis aut ter subfervefact<o>. fit autem hieme, quo-\nniam aestate non\
    \ glaciat nisi accepta cera. multa prae-\nterea remedia sunt ex ansere, quod miror aeque quam\nin\
    \ capris, namque anser corvusque ab aestate in autum-\nnum morbo conflictari dicuntur.\nWhen we speak\
    \ in this volume about the eggs of geese—which are of great usefulness—and the goose itself, we must\
    \ also give due credit to Commagene, for a most distinguished preparation.\nThis is made from goose\
    \ fat—which is renowned for many uses, but for this one particularly in the region of Commagene in\
    \ Syria—combined with cinnamon, cassia, white pepper, and the herb called Commagenê, all sealed in\
    \ vessels and buried in snow. It has a pleasant scent and is extremely beneficial for rubbings, cramps,\
    \ sudden or hidden pains, and all conditions treated with acopa; it is both a perfume and a medicine.\n\
    It is also made elsewhere in Syria by another method: the bird fat is treated, as will be described,\
    \ and combined with erysisceptrum, balsam wood, date palm, and pounded calamus—each in an amount equal\
    \ to the fat—then heated two or three times in wine until it just boils. This is done in winter, since\
    \ in summer it will not solidify unless wax is added.\nThere are many other remedies derived from\
    \ the goose, which I find as surprising as those from goats—for both goose and raven are said to suffer\
    \ illness from summer through autumn."

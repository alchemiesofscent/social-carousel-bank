    citation_normalized: Galenus Med., De compositione medicamentorum per genera libri vii
  text_original: "κᾂν τῶν\nπλησίον τις ᾖ μεγαλόφρων εἰς δαπάνην φαρμάκων, κᾀκείνῳ\nσυνθήσεις ἐκ τοιούτου\
    \ στύρακος τὸ φάρμακον.\n [Αἱ τῶν μαλακτικῶν φαρμάκων κατὰ γένος\nδιαφοραὶ καὶ δυνάμεις.] Τὰ μὲν οὖν\
    \ οὕτως ἀσθενῆ μαλα-\nκτικὰ καὶ τὰς μικρὰς θεραπεύει φλεγμονάς· τὰ δὲ τούτων\nἀτονώτερα, τὰς ἄνευ\
    \ φλεγμονῆς βραχείας σκληρότητας. τὰ\nδ' ἔτι τούτων ἰσχυρότερα τὰς μείζους, ὥσπερ καὶ τὰ τῆς\nἐγγὺς\
    \ ἡκούσης σκίῤῥου σκληρότητος ἰατικὰ, δραστικώτατά\nἐστιν, ὁποῖον ὑπάρχει τό τε τῶν μυελῶν γένος ἐν\
    \ τῷ\nμᾶλλόν τε καὶ ἧττον ἀλλήλων διαφερόντων, ὡς ἐφεξῆς διαι-\nρήσω, τό τε τῶν βδελλίων ἀμφοῖν, Ἀραβικοῦ\
    \ τε καὶ Σκυ-\nθικοῦ, τό τε τῶν στυράκων. καὶ γὰρ καὶ τούτων δραστικώ-\nτατος ὁ κατὰ τὴν χρόαν ὠχρὸς,\
    \ ὅσπερ καὶ κάλλιστος ἐν Παμ-\nφυλίᾳ γεννᾶται. ὁ δὲ ἐπὶ τὸ φαιότερον ἀποκεχωρηκὼς τοῦδε\nπολλαχόθι\
    \ τε γίνεται καὶ τῇ δυνάμει πολὺ τοῦ κατὰ τὸν\nὠχρὸν ἀπολείπεται. ῥέπει δ' οὖν καὶ οὗτος αὐτὸς ἐν\
    \ τῷ\nχρονίζειν ἐπὶ τὸ χρυσίζον χρῶμα. τούτῳ μὶν οὖν εἰς τὰς\nἀντιδότους χρώμεθα διὰ τὸ σπανίζειν,\
    \ ὥστε αὐτοκράτορί γε\nσκευάζων ὁτιοῦν διὰ στύρακος ἀεὶ τούτῳ χρήσῃ. κᾂν τῶν\nπλησίον τις ᾖ μεγαλόφρων\
    \ εἰς δαπάνην φαρμάκων, κᾀκείνῳ\nσυνθήσεις ἐκ τοιούτου στύρακος τὸ φάρμακον. ἐπὶ τῶν ἄλ-\nλων δὲ τοῦ\
    \ φαιοτέρου τὸν ἄριστον ἐκλέξῃ, τῇ τε ὀσμῇ κρί-\nνων μάλιστα καὶ τῇ χρόᾳ, φαυλότερος γὰρ ὁ μελάντερος.\n\
    ἔστι δὲ τῶν ἰσχυρῶς μαλαττόντων τὰ σκιῤῥούμενα, τὸ κα-\nλούμενον ἀμμωνιακὸν θυμίαμα καὶ μᾶλλον αὐτοῦ\
    \ τὸ λιπα-\nρόν τε καὶ νέον. τούτων δὲ ἧττον μὲν, ἀλλὰ καὶ αὐτὰ δρα-\nστήρια αἴγειόν τε καὶ βόειον.\
    \ ἐν αὐτοῖς δὲ τούτοις τὸ μὲν\nτῶν τράγων καὶ ταύρων ἰσχυρότερα, τὸ δὲ τῶν βοῶν καὶ\nτῶν αἰγῶν ἀσθενέστερα\
    \ μὲν τούτων, οὐκ ἄπρακτα δὲ οὐδὲ\nαὐτά. τὸ δὲ τῶν ἐρίφων τε καὶ μόσχων ἔτι καὶ τούτων\nαὐτῶν ἀσθενέστερα,\
    \ δραστικώτερα δὲ ὅμως ἐστὶ τοῦ χοιρείου."

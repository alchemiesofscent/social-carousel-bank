    citation_raw: Galenus Med., De antidotis libri ii
    citation_normalized: Galenus Med., De antidotis libri ii
  text_original: 'καὶ ἄλλοι δὲ πολλοὶ τῶν γεγραφότων σύνθετα φάρ-

    μακα παρέλιπον εἰπεῖν τὴν σκευασίαν τοῦ ἡδυχρόου κατὰ

    τὴν περὶ τῆς θηριακῆς διήγησιν, ὥστε τις ἰατρὸς ἐν Ῥώμῃ

    τῶν μὴ τεθεαμένων σκευαζόμενον τὸ φάρμακον, ἐκ τῆς

    γραφῆς ἐπ'' αὐτὸ παραγίνεσθαι τολμῶν, ἐζήτει παρὰ τοῖς

    μυροπώλαις ἡδύχροον, οἰόμενος εἶναι βοτάνην, ἤ τι τοιοῦτο

    τῶν ἁπλῶν φαρμάκων.'
  translation: And many other writers have omitted to describe the preparation of the sweet wine in their
    accounts about theriac, so that a doctor in Rome, who had not seen the drug being prepared and dared
    to approach it from the writings, sought sweet wine from the perfumers, thinking it was an herb or
    something similar among the simple drugs.
  body_markdown: "Galenus Med., De antidotis libri ii\nVolume 14, page 51, line 16\n\n         καὶ ἄλλοι\
    \ δὲ πολλοὶ τῶν γεγραφότων σύνθετα φάρ-\nμακα παρέλιπον εἰπεῖν τὴν σκευασίαν τοῦ ἡδυχρόου κατὰ\nτὴν\
    \ περὶ τῆς θηριακῆς διήγησιν, ὥστε τις ἰατρὸς ἐν Ῥώμῃ\nτῶν μὴ τεθεαμένων σκευαζόμενον τὸ φάρμακον,\
    \ ἐκ τῆς\nγραφῆς ἐπ' αὐτὸ παραγίνεσθαι τολμῶν, ἐζήτει παρὰ τοῖς\nμυροπώλαις ἡδύχροον, οἰόμενος εἶναι\
    \ βοτάνην, ἤ τι τοιοῦτο\nτῶν ἁπλῶν φαρμάκων. \n\nAnd many other writers have omitted to describe the\
    \ preparation of the sweet wine in their accounts about theriac, so that a doctor in Rome, who had\
    \ not seen the drug being prepared and dared to approach it from the writings, sought sweet wine from\
    \ the perfumers, thinking it was an herb or something similar among the simple drugs."

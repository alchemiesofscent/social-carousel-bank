    \ foreign fragrant materials: he remarks that some items in his list are grown locally and imported,\
    \ but what he means when he mentions them are ‘not those plants that are grown here, but those that\
    \ are imported with the aromata’.[ ] \nIf, for Celsus, being an import is a condition for being an\
    \ aroma, this would suggest that the list of plants considered aromata was fluid, with disagreements\
    \ among doctors and others concerning what counts and what does not. Disagreement was already suggested\
    \ by the preface of Dioscorides’ work mentioned above, who claimed his predecessors had not mentioned\
    \ ‘all the aromata’. Nevertheless, whatever disagreements there may have been, Celsus’ list largely\
    \ agrees with Dioscorides and Galen (see table 1), suggesting there was a largely stable group of\
    \ materials known as aromata that these authors were familiar with.\n[Insert table 1 about here]\n\
    They criteria by which aromata were distinguished from other kinds of materials are not entirely clear.\
    \ Like the contemporary English word, ‘spice’, it seems the term ‘aroma’ was sensitive to context.\
    \ However, one possibiltiy is that it was due to their unique way of acting on the body. Galen distinguishes\
    \ aromata by ‘their ability to dissolve and disperse into vapor the fluid that has accumulated in\
    \ the body’,[ ] which they can do because ‘they are all subtle and able to dry accompanied by an ability\
    \ to heat’.[ ] Dioscorides, too, says he groups aromata together because they have a common way of\
    \ acting on the body, although he does not explain the mechanism in detail. Both seem less concerned\
    \ than Aristotle to say that we find the smell flowers and perfumes pleasant (and sulphur unpleasant)\
    \ because this promotes our well-being. They do, however, recognize the unique ability of some plants,\
    \ especially aromata, to heal through smell.\nList from Celsus (early first century CE), On medicine\

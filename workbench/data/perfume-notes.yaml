  tags: []
  title: Iustinianus. Digesta Iustiniani 1–50 (The Digest of Justinian.
  summary: Vols. 1–4, ed. T. Mommsen, P. Krüger, A. Watson, 1985).
  source:
    author: ''
    work: Iustinianus. Digesta Iustiniani 1–50 (The Digest of Justinian.
    citation_raw: Iustinianus. Digesta Iustiniani 1–50 (The Digest of Justinian.
    citation_normalized: Iustinianus. Digesta Iustiniani 1–50 (The Digest of Justinian.
  text_original: 'POMPONIUS libro sexto ad Sabinum. In argento potorio utrum id dumtaxat

    sit, in quo bibi possit, an etiam id, quod ad praeparationem bibendi comparatum est, ueluti

    colum niuarium et urceoli, dubitari potest. sed propius est, ut haec quoque insint. Un-

    guentis legatis non tantum ea legata uidentur, quibus unguimur uoluptatis causa, sed et

    ualetudinis, qualia sunt commagena glaucina crina rosa muracolum nardum purum: hoc

    quidem etiam quo elegantiores sint et mundiores, unguuntur feminae. Sed de aquiminario

    Cassius ait consultum se respondisse, cum alteri argentum potorium, alteri escarium lega-

    tum esset, escario cedere.'
  translation: 'Pomponius, in the sixth book on Sabinus: Concerning silver drinking vessels, there is
    room for doubt whether only that which can be drunk from qualifies, or also that which is prepared
    for the act of drinking, such as a snow-filter or small pitchers. But it is more reasonable to include
    these as well.

    When perfumes are bequeathed, not only those used for pleasure are understood to be included, but
    also those for health, such as commagena, glaucina, crina, rosa, muracolum, and pure nardum; indeed,
    women anoint themselves with these not only for refinement but also for cleanliness.

    As for a water vessel (aquiminarium), Cassius says that he was consulted and replied that, when silver
    drinking ware was left to one party and tableware to another, the aquiminarium belonged with the tableware.'
  body_markdown: "Iustinianus. Digesta Iustiniani 1–50 (The Digest of Justinian.\nVols. 1–4, ed. T. Mommsen,\
    \ P. Krüger, A. Watson, 1985).\n(2806: 002)\n\nbook 34, chap 2, par 21, sect 1, line 3\n\n  POMPONIUS\
    \ libro sexto ad Sabinum. In argento potorio utrum id dumtaxat\nsit, in quo bibi possit, an etiam\
    \ id, quod ad praeparationem bibendi comparatum est, ueluti\ncolum niuarium et urceoli, dubitari potest.\
    \ sed propius est, ut haec quoque insint. Un-\nguentis legatis non tantum ea legata uidentur, quibus\
    \ unguimur uoluptatis causa, sed et\nualetudinis, qualia sunt commagena glaucina crina rosa muracolum\
    \ nardum purum: hoc\nquidem etiam quo elegantiores sint et mundiores, unguuntur feminae. Sed de aquiminario\n\
    Cassius ait consultum se respondisse, cum alteri argentum potorium, alteri escarium lega-\ntum esset,\
    \ escario cedere. \n\n(Pomponius, Sixth Book on Sabinus)\n\nPomponius, in the sixth book on Sabinus:\
    \ Concerning silver drinking vessels, there is room for doubt whether only that which can be drunk\
    \ from qualifies, or also that which is prepared for the act of drinking, such as a snow-filter or\
    \ small pitchers. But it is more reasonable to include these as well.\n\nWhen perfumes are bequeathed,\
    \ not only those used for pleasure are understood to be included, but also those for health, such\
    \ as commagena, glaucina, crina, rosa, muracolum, and pure nardum; indeed, women anoint themselves\
    \ with these not only for refinement but also for cleanliness.\n\nAs for a water vessel (aquiminarium),\
    \ Cassius says that he was consulted and replied that, when silver drinking ware was left to one party\
    \ and tableware to another, the aquiminarium belonged with the tableware."

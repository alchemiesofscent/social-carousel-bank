    citation_raw: Galenus Med., De antidotis libri ii
    citation_normalized: Galenus Med., De antidotis libri ii
  text_original: 'οὐδεὶς γοῦν ἐστι τῶν μυροπωλῶν, ὃς

    οὐκ οἶδεν τὰς ἐκ Κρήτης κομιζομένας βοτάνας, ὥσπερ καὶ

    τοὺς καρποὺς αὐτῶν, ἀλλ'' ἐν τοῖς προαστείοις Ῥώμης ἐξ

    αὐτῶν οὐκ ὀλίγας φυομένας παντάπασιν ἀγνοοῦσι, καὶ διὰ

    τοῦτο κατὰ τὸν καιρὸν, ἐν ᾧ τοὺς καρποὺς αὐτῶν ἐκφέ-

    ρουσιν, οὐκ ἐπιτηροῦσιν.'
  translation: Indeed, there is no perfumer who does not know the herbs brought from Crete, just as they
    know their fruits, but they are completely unaware of many such plants growing in the suburbs of Rome,
    and for this reason, they do not pay attention during the season when their fruits are produced.
  body_markdown: "Galenus Med., De antidotis libri ii\nVolume 14, page 30, line 14\n\n               \
    \        οὐδεὶς γοῦν ἐστι τῶν μυροπωλῶν, ὃς\nοὐκ οἶδεν τὰς ἐκ Κρήτης κομιζομένας βοτάνας, ὥσπερ καὶ\n\
    τοὺς καρποὺς αὐτῶν, ἀλλ' ἐν τοῖς προαστείοις Ῥώμης ἐξ\nαὐτῶν οὐκ ὀλίγας φυομένας παντάπασιν ἀγνοοῦσι,\
    \ καὶ διὰ\nτοῦτο κατὰ τὸν καιρὸν, ἐν ᾧ τοὺς καρποὺς αὐτῶν ἐκφέ-  \nρουσιν, οὐκ ἐπιτηροῦσιν. \n\nIndeed,\
    \ there is no perfumer who does not know the herbs brought from Crete, just as they know their fruits,\
    \ but they are completely unaware of many such plants growing in the suburbs of Rome, and for this\
    \ reason, they do not pay attention during the season when their fruits are produced."

    work: 'EXc. De virt. p. 809:'
    citation_raw: 'EXc. De virt. p. 809:'
    citation_normalized: 'EXc. De virt. p. 809:'
  text_original: 'Ἐπεὶ δὲ τρυφαῖς καὶ κώμοις καθημερινοῖς ὁ Νέρων ἐντραφεὶς πράττειν (τε) τὰ τῆς ἀρχῆς
    (ἐφ ̓ ἧς) ἑαυτὸν ἠξίου, ταχὺ τὸ σεμνὸν καὶ μεγαλοπρεπὲς τῆς τῶν Ῥωμαίων ἡγεμονίας εἰς τὸ ἄκοσμόν τε
    καὶ ταπεινὸν μετεβέβληκεν, ἀήθη τινὰ μετιὼν καὶ δαπανηρὸν ἀκολασίας τρόπον, ἐκθέσμοις τε καὶ παρανόμοις
    ἐγχειρῶν δράμασι· λουτρὸν μὲν γὰρ ἦν αὐτῷ ζηλοῦντι τῆς πολυτελείας καὶ ἐκδιαιτήσεως τοῦ Καλιγόλα,
    οὐχ ὕδωρ, ἀλλὰ μύρον, τὸ μὲν θερμαινόμενον, τὸ δὲ ψυχόμενον, καὶ εἰς ἑκατέραν τὴν χρείαν τοῦ λουτροῦ
    παρασκευαζόμενον. Ἐχρῆτο δὲ δικτύοις παρὰ τὰς ἄγρας τῶν ἰχθύων χρυσοῖς, ἐξέλκων τοὺς κόλπους τῶν δικτύων
    καλωδίοις ἐξ ἐρίου πεποιημένοις, ἀστράπτουσι τῇ βαρῇ τῆς κόχλου. Ἐς τοῦτό γε μὴν προϊὼν ἀτοπίας ἐλήλυθεν,
    ὡς παριέναι μὲν εἰς τὴν σκηνὴν, ὑπὸ δὲ τῇ πάντων ὄψει ὀρχεῖσθαί τε καὶ ᾠδάς τινας διεξιέναι, ἀναλαμβάνοντα
    σκευὴν νῦν μὲν κιθαριστῶν, νῦν δὲ τραγῳδίας ὑποκριτῶν.

    Φύλαρχος ἐν τῇ πεντεκαιδεκάτῃ καὶ εἰκοστῇ τῶν Ἱστοριῶν τάδε γράφει· «Λακεδαιμόνιοι εἰς μὲν τὰ φειδίτια
    οὐκ ἤρχοντο κατὰ τὸ πάτριον ἔθος· ὅτε δὲ καὶ παραγένοιντο, μικρὰ συμπεριενεχθεῖσι νόμου χάριν παρεσκευάζετο
    καὶ ἄλλα αὐτοῖς, στρωμναί τε τοῖς μεγέθεσιν οὕτως ἐξησκημέναι πολυτελῶς καὶ τῇ ποικιλίᾳ διαφόρως ὥστε
    τῶν ξένων ἐνίους τῶν παραληφθέντων ὀκνεῖν τὸν ἀγκῶνα ἐπὶ τὰ προσκεφάλαια ἐρείδειν. Οἱ δὲ πρότερον
    ἐπὶ τοῦ κλιντηρίου ψιλοῦ διακαρτεροῦντες τῆς κλίνης παρ ̓ ὅλην τὴν συνουσίαν, ὅτε τὸν ἀγκῶνα ἅπαξ
    ἐρείσειαν, εἰς τὴν προειρημένην τρυφὴν ἦλθον, ποτηρίων τ ̓ ἐκθέσεις πολλῶν καὶ βρωμάτων παντοδαπῶς
    πεποιημένων παραθέσεις, ἔτι δὲ μύρων ἐξηλλαγμένων, ὡς δ ̓ αὕτως οἴνων καὶ τραγημάτων.'
  translation: 'https://www.dfhg-project.org/DFHG/g.php?v=4&p=PA574

    When Nero, having been reared amid daily luxury and revels, deemed himself worthy to handle the affairs
    of rule, the dignity and grandeur of Roman leadership quickly degenerated into the unseemly and base.
    He adopted a strange and extravagant lifestyle of debauchery, engaging in unlawful and lawless performances.
    For in his pursuit of Caligula’s lavishness and refined excess, his bath did not contain water, but
    perfume—one part heated, the other cooled—prepared for each stage of bathing.

    He used golden nets for fishing, drawing them in with cords made of silk, which glittered with purple
    dye. His extravagance went so far that he appeared publicly on stage, dancing and performing songs
    before all, sometimes donning the costume of a lyre-player, other times that of a tragic actor.

    Athenaeus IV, 20, p. 141, F:

    Phylarchus in the twenty-fifth book of his Histories writes as follows:

    “The Spartans no longer attended the common messes according to ancestral custom. And when they did
    appear, a small amount was prepared for them, nominally in observance of the law, but in addition
    they were served other items—bedding so lavishly adorned in size and variety of pattern that some
    of the foreign guests who were invited hesitated to rest their elbow upon the cushions.

    Those who had formerly endured the plain couch throughout the entire banquet, once they reclined their
    elbow, surrendered themselves to the indulgence described—displays of numerous drinking cups, arrangements
    of foods of every kind, and a changing array of perfumes, along with wines and confections in equal
    extravagance.”'

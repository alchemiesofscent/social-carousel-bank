    \ ἀπονιψάμενον,\nἁγνισάμενον, ἁγνεύσαντα, ἡγνευμένον, ὡσιωμένον, καθαρῷ νῷ,\nὑπὸ νεουργῷ στολῇ, ὑπὸ\
    \ νεοπλυνεῖ ἐσθῆτι. προσιέναι θεοῖς, πρόσοδον\nποιεῖσθαι πρὸς τοὺς θεούς, εὔχεσθαι θεοῖς, ἀνατείνειν\

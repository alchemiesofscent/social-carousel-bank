    \ harass them. Maybe it would be better to complain not only to them, but rather to their wholesalers,\
    \ and even more to the root-cutters themselves—that’s what they’re called, even though they import\
    \ from the mountains and into the city not just roots, but also saps, juices, fruits, flowers and\
    \ blossoms. These people are the first of all to adulterate the drugs. \n\nTherefore, whoever wants\
    \ to get their hands on remedies from anywhere easily needs to acquire experience with every material\
    \ derived from plants, and every material derived from both animals and metals, and all those earthy\
    \ bodies distinct from metals which we bring in for medical use, so that one can discern which of\
    \ them are real and which are fake. After that, one needs to train following my book in which I wrote\
    \ about the capacities of simple drugs. For if one turns to what is useful in these notebooks without\
    \ having prepared, while he may go as far as a rational understanding with respect to the method,\

  text_original: 'λίτρα = pound = 12 ounces = 327.5g

    Γο = ounce = 8 drachme = 27.3g'
  translation: 'We have quite a few ancient recipes for cosmetics attributed to Cleopatra. Maybe Cleopatra
    wrote them, or maybe they were marketing gimmicks by booksellers. Ancient marketplaces were not much
    different from today’s. (Here’s a nice book by Claire Holleran on street markets in Rome. More about
    these markets here.)

    Then again, I guess in another way ancient marketplaces were different, because there didn’t seem
    to be as many safety regulations. Don’t prepare any of these things for use on the body. I can say
    from experience that it is not a good idea. I don’t endorse any of the claims made by the compilers,
    either that these are Cleopatra’s recipes (they almost certainly aren’t) or that they do what they
    say they do. They are not safe and these recipes are purely for historical interest.

    (inspired by Laurence Totelin’s reconstruction of Metrodora’s deodorant at concoctinghistory.)

    Cleopatra’s routine

    Measures:

    ⋖ = drachme = 3.4g'

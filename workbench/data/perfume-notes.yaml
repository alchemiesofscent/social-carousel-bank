  text_original: '1. Cleopatra’s Sweet Smelling Soap

    Source: Aëtius of Amida, Medical Books, Book 8, Chapter 6 (408,18-21 Olivieri)


    Ἄλλο σμῆγμα Κλεοπάτρας βασιλίσσης πολυτελὲς εὐῶδες. κόστου σμύρνης τρωγλίτιδος ἴρεως ναρδοστάχυος
    ἀμώμου φύλλου κασσίας σχοίνου ἄνθους ἀνὰ Γο α` μυροβαλάνου λίτρας δ` νίτρου ἀφροῦ λίτρας β` κόψας

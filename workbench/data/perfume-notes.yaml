  body_markdown: 'Source: Cleidemus, Exegetikon (quoted passage); subject: Athenian funeral and purification
    rites


    It is specifically called aponymma among the Athenians in reference to the rites performed in honor
    of the dead and to the purifications of those who have been polluted by death, as Cleidemus also notes
    in his work titled Exegetikon. For when introducing the section on funeral offerings, he writes the
    following:


    “Dig a pit on the west side of the grave; then, facing west beside the pit, pour out water, saying
    these words: ‘This is the aponymma for you, to whom it is due and to whom it is lawful.’ Then again
    pour out perfume.”'

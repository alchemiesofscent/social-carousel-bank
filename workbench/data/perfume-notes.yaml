  translation: '“Another soap, Queen Cleopatra’s, very expensive and fragrant.


    One ounce each of:


    Costus root


    Troglodytic myrrh [sc. from Eastern Africa]


    Iris


    Spikenard


    Nepal cardamom


    Cassia leaves


    Flowers of camel grass


    4 pounds of the perfume-nut


    2 pounds of foam of soda


    Grind, sift and use. Works on the whole body.”*


    *note: it doesn’t'
  body_markdown: '1. Cleopatra’s Sweet Smelling Soap

    Source: Aëtius of Amida, Medical Books, Book 8, Chapter 6 (408,18-21 Olivieri)


    Ἄλλο σμῆγμα Κλεοπάτρας βασιλίσσης πολυτελὲς εὐῶδες. κόστου σμύρνης τρωγλίτιδος ἴρεως ναρδοστάχυος
    ἀμώμου φύλλου κασσίας σχοίνου ἄνθους ἀνὰ Γο α` μυροβαλάνου λίτρας δ` νίτρου ἀφροῦ λίτρας β` κόψας
    σήσας χρῶ· ποιεῖ εἰς ὅλον τὸ σῶμα.


    English Translation


    “Another soap, Queen Cleopatra’s, very expensive and fragrant.


    One ounce each of:


    Costus root


    Troglodytic myrrh [sc. from Eastern Africa]


    Iris


    Spikenard


    Nepal cardamom


    Cassia leaves


    Flowers of camel grass


    4 pounds of the perfume-nut


    2 pounds of foam of soda


    Grind, sift and use. Works on the whole body.”*


    *note: it doesn’t'

  summary: Book 13, Kaibel paragraph 94, line 22
  source:
    author: Athenaeus Soph.
    work: Deipnosophistae
    citation_raw: Athenaeus Soph., Deipnosophistae
    citation_normalized: Athenaeus Soph., Deipnosophistae
  text_original: "καλόν γε τὸ τέλος\nτῆς εὐδαιμονίας τῷ φιλοσόφῳ ἡ μυρεψικὴ τέχνη ἀκό-\nλουθός τε τῇ Σωκράτους\
    \ φιλοσοφίᾳ, ἀνδρὸς τοῦ\nκαὶ τὴν [τοιαύτην] χρῆσιν τῶν μύρων ἀποδοκιμάσαν-\nτος (Xen. conv. 2, 3),\
    \ Σόλωνος δὲ τοῦ νομοθέτου οὐδ'\nἐπιτρέποντος ἀνδρὶ τοιαύτης προίστασθαι τέχνης·\nδιὸ καὶ Φερεκράτης\
    \ ἐν Ἰπνῷ ἢ Παννυχίδι φησίν\n(I 162 K)·\n  κᾆτα μυροπωλεῖν τί παθόντ' ἄνδρ' ἐχρῆν καθήμενον\n  ὑψηλῶς\
    \ ὑπὸ σκιαδείῳ, κατεσκευασμένον\n  συνέδριον τοῖς μειρακίοις ἐλλαλεῖν δι' ἡμέρας;"
  translation: 'Indeed, the art of perfume-making is a beautiful end to the philosopher''s pursuit of
    happiness, and it follows the philosophy of Socrates, a man who disapproved of such use of perfumes
    (Xen. conv. 2, 3), and Solon the lawgiver, who did not allow a man to engage in such an art; hence
    Pherecrates in "The Couch" or "The All-Night Festival" says (I 162 K):

    "What misfortune should compel a man to sit selling perfumes under a sunshade, set up a council for
    the youths to chat throughout the day?"'
  body_markdown: "Athenaeus Soph., Deipnosophistae\nBook 13, Kaibel paragraph 94, line 22\n\n        \
    \                               καλόν γε τὸ τέλος\nτῆς εὐδαιμονίας τῷ φιλοσόφῳ ἡ μυρεψικὴ τέχνη ἀκό-\
    \  \nλουθός τε τῇ Σωκράτους φιλοσοφίᾳ, ἀνδρὸς τοῦ\nκαὶ τὴν [τοιαύτην] χρῆσιν τῶν μύρων ἀποδοκιμάσαν-\n\
    τος (Xen. conv. 2, 3), Σόλωνος δὲ τοῦ νομοθέτου οὐδ'\nἐπιτρέποντος ἀνδρὶ τοιαύτης προίστασθαι τέχνης·\n\
    διὸ καὶ Φερεκράτης ἐν Ἰπνῷ ἢ Παννυχίδι φησίν\n(I 162 K)·\n  κᾆτα μυροπωλεῖν τί παθόντ' ἄνδρ' ἐχρῆν\
    \ καθήμενον\n  ὑψηλῶς ὑπὸ σκιαδείῳ, κατεσκευασμένον\n  συνέδριον τοῖς μειρακίοις ἐλλαλεῖν δι' ἡμέρας;\
    \ \n  \nIndeed, the art of perfume-making is a beautiful end to the philosopher's pursuit of happiness,\
    \ and it follows the philosophy of Socrates, a man who disapproved of such use of perfumes (Xen. conv.\
    \ 2, 3), and Solon the lawgiver, who did not allow a man to engage in such an art; hence Pherecrates\
    \ in \"The Couch\" or \"The All-Night Festival\" says (I 162 K):\n\"What misfortune should compel\
    \ a man to sit selling perfumes under a sunshade, set up a council for the youths to chat throughout\
    \ the day?\"\n\n\nUser"

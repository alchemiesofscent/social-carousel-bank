    citation_normalized: Herodianus Hist., Ab excessu divi Marci
  text_original: 'ἐς δὴ τὸ οἴκημα τὸ

    δεύτερον ἀνακομίσαντες τὴν κλίνην τιθέασιν, ἀρώματά

    τε καὶ θυμιάματα πάντα ὅσα γῆ φέρει, εἴ τέ τινες καρ-

    ποὶ ἢ πόαι χυμοί τε συμβαλλόμενοι πρὸς εὐωδίαν, ἀνα-

    κομίζονται καὶ σωρηδὸν χέονται· οὔτε γὰρ ἔθνος οὔτε

    πόλις τις οὔτε τῶν ἐν ἀξιώσει ἢ τιμῇ ἔστιν ὃς μὴ δῶρα

    ταῦτα ὕστατα πέμπει φιλοτίμως ἐς τιμὴν τοῦ βασιλέως.'
  translation: Then they carried the couch into the second chamber and placed it there, along with all
    the perfumes and incenses the earth produces, whether fruits, herbs, or extracts blended for fragrance—they
    were brought in and heaped up in abundance. For there is neither nation nor city, nor any man of rank
    or honor, who does not eagerly send these final gifts in tribute to the emperor.
  body_markdown: "Herodianus Hist., Ab excessu divi Marci\nBook 4, chapter 2, section 8, line 6\n\n  \
    \                                    ἐς δὴ τὸ οἴκημα τὸ\nδεύτερον ἀνακομίσαντες τὴν κλίνην τιθέασιν,\
    \ ἀρώματά\nτε καὶ θυμιάματα πάντα ὅσα γῆ φέρει, εἴ τέ τινες καρ-\nποὶ ἢ πόαι χυμοί τε συμβαλλόμενοι\
    \ πρὸς εὐωδίαν, ἀνα-\nκομίζονται καὶ σωρηδὸν χέονται· οὔτε γὰρ ἔθνος οὔτε\nπόλις τις οὔτε τῶν ἐν ἀξιώσει\
    \ ἢ τιμῇ ἔστιν ὃς μὴ δῶρα\nταῦτα ὕστατα πέμπει φιλοτίμως ἐς τιμὴν τοῦ βασιλέως. \nThen they carried\
    \ the couch into the second chamber and placed it there, along with all the perfumes and incenses\
    \ the earth produces, whether fruits, herbs, or extracts blended for fragrance—they were brought in\
    \ and heaped up in abundance. For there is neither nation nor city, nor any man of rank or honor,\
    \ who does not eagerly send these final gifts in tribute to the emperor."

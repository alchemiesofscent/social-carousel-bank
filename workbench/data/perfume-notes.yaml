  text_original: 'ὑποδοχὴ δὴ παρεσκευάζετο

    οἵαν μηδενὶ πώποτε βασιλεῖ γενέσθαι φασί· πάσης τε

    γὰρ μούσης ὄργανα πανταχοῦ διακείμενα ποικίλον ἦχον

    εἰργάζετο, ἀρωμάτων τε παντοδαπῶν καὶ θυμιαμάτων

    ἀτμίδες εὐωδίαν παρεῖχον ταῖς εἰσόδοις, δᾳδουχίαις τε

    καὶ ἀνθέων βολαῖς ἐτίμων τὸν βασιλέα.'
  translation: A reception was prepared such as they say no emperor had ever received before. Instruments
    of every kind of music were arranged everywhere, producing a varied sound; and clouds of every sort
    of perfume and incense filled the entrances with fragrance. They honored the emperor with torchlight
    processions and showers of flowers.
  body_markdown: "Herodianus Hist., Ab excessu divi Marci\nBook 4, chapter 8, section 8, line 4\n\n  \
    \                               ὑποδοχὴ δὴ παρεσκευάζετο\nοἵαν μηδενὶ πώποτε βασιλεῖ γενέσθαι φασί·\
    \ πάσης τε\nγὰρ μούσης ὄργανα πανταχοῦ διακείμενα ποικίλον ἦχον\nεἰργάζετο, ἀρωμάτων τε παντοδαπῶν\
    \ καὶ θυμιαμάτων\nἀτμίδες εὐωδίαν παρεῖχον ταῖς εἰσόδοις, δᾳδουχίαις τε\nκαὶ ἀνθέων βολαῖς ἐτίμων\
    \ τὸν βασιλέα. \n\nA reception was prepared such as they say no emperor had ever received before.\
    \ Instruments of every kind of music were arranged everywhere, producing a varied sound; and clouds\
    \ of every sort of perfume and incense filled the entrances with fragrance. They honored the emperor\
    \ with torchlight processions and showers of flowers."

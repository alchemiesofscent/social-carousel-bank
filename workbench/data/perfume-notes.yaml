  text_original: 'ὁ δὲ Σεβῆρος διαβὰς τὴν τῶν ποταμῶν μέσην τήν τε

    [καὶ] Ἀδιαβηνῶν χώραν, ἐπέδραμε καὶ τὴν εὐδαίμονα

    Ἀραβίαν· φέρει γὰρ πόας εὐώδεις, αἷς ἀρώμασι καὶ θυ-

    μιάμασι χρώμεθα.'
  translation: Severus, having crossed the middle region of the rivers and the land of the Adiabeni, also
    made a campaign into prosperous Arabia; for it produces fragrant herbs, which we use in perfumes and
    incense.
  body_markdown: "Herodianus Hist., Ab excessu divi Marci\nBook 3, chapter 9, section 3, line 4\n\nὁ δὲ\
    \ Σεβῆρος διαβὰς τὴν τῶν ποταμῶν μέσην τήν τε\n[καὶ] Ἀδιαβηνῶν χώραν, ἐπέδραμε καὶ τὴν εὐδαίμονα\n\
    Ἀραβίαν· φέρει γὰρ πόας εὐώδεις, αἷς ἀρώμασι καὶ θυ-\nμιάμασι χρώμεθα. \nSeverus, having crossed the\
    \ middle region of the rivers and the land of the Adiabeni, also made a campaign into prosperous Arabia;\
    \ for it produces fragrant herbs, which we use in perfumes and incense."

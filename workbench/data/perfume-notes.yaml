    Roman emperor and rejoiced in the hope of perpetual peace. Antoninus, having crossed the rivers without
    opposition and entered the land of the Parthians as if it were already his own, was greeted everywhere
    with sacrifices offered to him, altars crowned with garlands, and all kinds of perfumes and incenses
    brought forth. He pretended to be pleased by the honors shown him by the barbarians.

- id: egyptian-perfume--eustathius-philol-scr-eccl-commentarii-ad-homeri-iliadem
  record_type: ancient_passage
  source_layer: ancient
  container_id: egyptian-perfume
  source_line_start: 878
  source_line_end: 892
  topics:

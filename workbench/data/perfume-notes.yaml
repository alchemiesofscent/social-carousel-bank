    \ ἄλλας ἰδιότητας μεγάλη πλάνη γίνεται ἐπ' ἐνίων τοῖς μὴ\n1.Pr.8.1\nοὕτω τὴν θέαν ποιησαμένοις. παρὰ\
    \ ταύτην γοῦν τὴν αἰτίαν\nτινὲς τῶν ἀναγραψαμένων ἐπλανήθησαν εἰπόντες τινὰ μήτε\nἄνθη μήτε καυλὸν\
    \ μήτε καρπὸν φέρειν, καθάπερ ἐπὶ τῆς ἀγρώ-\nστεως καὶ βηχίου καὶ πενταφύλλου. ὁ δὲ πολλάκις ἐντετευχὼς\n\
    1.Pr.8.5\nαὐτοῖς καὶ ἐν πολλοῖς τόποις μάλιστα τὴν ἐπίγνωσιν ποιήσεται.\nχρὴ μέντοι εἰδέναι ὅτι ἔνια\
    \ τῶν βοτανικῶν φαρμάκων ἐπὶ\nπολλὰ ἔτη διαμένει, οἷον ἐλλέβορος λευκὸς καὶ μέλας, τὰ δὲ\nλοιπὰ μέχρι\
    \ τριετίας ἐστὶν εὔχρηστα. τὰ μὲν οὖν ἐρνώδη, ὧν\nἐστι στοιχάς, χαμαίδρυς, πόλιον, ἁβρότονον, σέριφον,\
    \ ἀψίνθιον,\n1.Pr.8.10\nὕσσωπον καὶ τὰ ὅμοια τούτοις, συλλέγειν δεῖ ἐγκύμονα τῶν\nσπερμάτων, ἄνθη\
    \ δὲ πρὸ τῆς ἀποπτώσεως αὐτῶν, τοὺς δὲ καρ-\nποὺς πεπείρους ὄντας, καὶ τὰ σπέρματα δὲ ἀρχόμενα ξηραί-\n\
    1.Pr.9.1\nνεσθαι πρὸ τοῦ ἀπορρεῖν· χυλίζειν δὲ τὰς βοτάνας ἀρτιβλάστων\nὄντων τῶν καυλῶν, ὁμοίως καὶ\
    \ τὰ φύλλα, ὀποὺς δὲ καὶ δάκρυα  \nλαμβάνειν τέμνοντας ἐν ἀκμῇ ἔτι τοὺς καυλούς, τὰς δὲ εἰς\nἀπόθεσιν\
    \ ῥίζας καὶ χυλίσματα καὶ φλοιοὺς ἀφαιρεῖν ἀρχομένων\n1.Pr.9.5\nφυλλορροεῖν τῶν βοτανῶν· καὶ τὰς μὲν\
    \ καθαρὰς αὐτόθεν ξη-\nραίνειν ἐν τόποις ἀνοτίστοις, τὰς δὲ μετεχούσας γῆς ἢ πηλοῦ\nπλύνειν ὕδατι.\
    \ ἀποτίθεσθαι δὲ καὶ ἄνθη καὶ ὅσα εὐώδη τυγ-\nχάνει ἐν κιβωτίοις φιλυρίνοις ἀνοτίστοις, ἔστι δ' ὅτε\
    \ καὶ ἐν χάρ-\nταις ἢ φύλλοις χρησίμως περιδεῖται πρὸς συμμονὴν τῶν σπερ-\n1.Pr.9.10\nμάτων. πρὸς\
    \ δὲ τὰ ὑγρὰ φάρμακα ἁρμόσει ὕλη πᾶσα ἐξ\nἀργύρου ἢ ὑάλου ἢ κεράτων γεγενημένη, καὶ ὀστρακίνη δὲ ἡ\
    \ μὴ\nἀραιὰ εὔθετος, ξυλίνων δὲ ὅσα ἐκ πύξου κατασκευάζεται. τὰ\nδὲ χαλκᾶ ἀγγεῖα ἁρμόσει πρὸς τὰ ὀφθαλμικὰ\
    \ ὑγρὰ καὶ ὅσα δι'\nὄξους ἢ πίσσης ὑγρᾶς ἢ κεδρίας σκευάζεται· στέατα δὲ καὶ\n1.Pr.9.15\nμυελοὺς ἐν\
    \ κασσιτερίνοις ἀποτίθεσθαι."

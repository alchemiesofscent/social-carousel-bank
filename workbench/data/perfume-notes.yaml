    work: 'Plutarch. Artox. c. 21:'
    citation_raw: 'Plutarch. Artox. c. 21:'
    citation_normalized: 'Plutarch. Artox. c. 21:'
  text_original: 'Ὁ δ ̓ Ἀνταλκίδας Σπαρτιάτης ἦν, Λέοντος υἱὸς, καὶ σπουδάσας βασιλεῖ διεπράξατο τὰς ἐν
    Ἀσίᾳ πόλεις Ἑλληνίδας ἁπάσας καὶ νήσους, ὅσαι προσκυροῦσιν Ἀσίᾳ, παρεῖναι Λακεδαιμονίους αὐτῷ κεκτῆσθαι
    φόρων ὑποτελεῖς, εἰρήνης γενομένης τοῖς Ἕλλησιν, εἰ δεῖ τὴν τῆς Ἑλλάδος ὕβριν καὶ προδοσίαν εἰρήνην
    καλεῖν, ἧν πόλεμος οὐδεὶς ἀκλεέστερον ἤνεγκε τέλος τοῖς κρατηθεῖσι. Διὸ καὶ τοὺς ἄλλους Σπαρτιάτας
    ἀεὶ βδελυττόμενος ὁ Ἀρτοξέρξης καὶ νομίζων, ὥς φησι Δείνων, ἀνθρώπων ἁπάντων ἀναιδεστάτους εἶναι,
    τὸν Ἀνταλκίδαν ὑπερηγάπησεν εἰς Πέρσας ἀναβάντα. Καὶ ποτε λαβὼν ἕνα τῶν ἀνθινῶν στεφάνων καὶ βάψας
    εἰς μύρον τὸ πολυτελέστατον ἀπὸ δείπνου ἔπεμψε τῷ Ἀνταλκίδᾳ· καὶ πάντες ἐθαύμασαν τὴν φιλοφροσύνην.
    Ἦν δ ̓, ὡς ἔοικεν, οὗτος ἐπιτήδειος ἐντρυφηθῆναι καὶ τοιοῦτον λαβεῖν στέφανον ἐξορχησάμενος ἐν Πίρσαις
    τὸν Λεωνίδαν καὶ τὸν Καλλικρατίδαν.

    Τὸν οὖν Κρῆτα Τιμαγόραν, ἢ τὸν ἐκ Γόρτυνος (scr. Vid. Voisino τὸν οὖν Τ. ἢ τὸν ἐκ Γόρτυνος Κρῆτα),
    ὥς φησι Φανίας ὁ Περιπατητικὸς, Ἔντιμον, ὃς ζήλῳ Θεμιστοκλέους ἀνέβη ὡς βασιλέα, τιμῶν Ἀρταξέρξης,
    σκηνήν τε ἔδωκεν αὐτῷ διαφέρουσαν τὸ κάλλος καὶ τὸ μέγεθος, καὶ κλίνην ἀργυρόποδα, ἔπεμψε δὲ καὶ στρώματα
    πολυτελῆ, καὶ τὸν ὑποστρώσοντα, φάσκων οὐκ ἐπίστασθαι τοὺς Ἕλληνας ὑποστρωννύειν. Καὶ ἐπὶ τὸν συγγενικὸν
    ἄριστον ἐκαλεῖτο ὁ Κρὴς οὗτος, τὸν βασιλέα ψυχαγωγήσας· ὅπερ οὐδενὶ πρότερον τῶν Ἑλλήνων ἐγένετο,
    ἀλλ ̓ οὐδ ̓ ὕστερον. Αὕτη γὰρ ἡ τιμὴ τοῖς συγγενέσι διεφυλάττετο. Τιμαγόρᾳ μὲν γὰρ τῷ Ἀθηναίῳ, τῷ
    προσκυνήσαντι βασιλέα, καὶ μάλιστα τιμηθέντι, τοῦτο οὐχ ὑπῆρξε· τῶν δὲ παρατιθεμένων βασιλεῖ τούτῳ
    τινὰ ἀπὸ τῆς τραπέζης ἀπέστελλε. Ἀνταλκίδᾳ δὲ τῷ Λάκωνι τὸν αὑτοῦ στέφανον εἰς μύρον βάψας ἔπεμψε.
    Τῷ δ ̓ Ἐντίμῳ τοιαῦτα πολλὰ ἐποίει, καὶ ἐπὶ τὸν συγγενικὸν ἄριστον ἐκάλει. Ἐφ ̓ ᾧ οἱ Πέρσαι χαλεπῶς
    ἔφερον, ὡς τῆς τε τιμῆς δημευομένης, καὶ στρατείας ἐπὶ τὴν Ἑλλάδα πάλιν ἐσομένης. Ἔπεμψε δὲ καὶ κλίνην
    αὐτῷ ἀργυρόποδα, καὶ στρωμνὴν, καὶ σκηνὴν οὐρανόροφον ἀνθινὴν, καὶ θρόνον ἀργυροῦν, καὶ ἐπίχρυσον
    σκιάδιον, καὶ φιάλας λιθοκολλήτους χρυσᾶς, καὶ ἀργυρᾶς δὲ μεγάλας ἑκατὸν, καὶ κρατῆρας ἀργυροῦς, καὶ
    παιδίσκας ἑκατὸν, καὶ παῑδας ἑκατὸν, χρυσοὺς τε ἑξακισχιλίους, χωρὶς τῶν εἰς τὰ ἐπιτήδεια καθ ̓ ἡμέραν
    διδομένων.'
  translation: 'Antalcidas was a Spartan, the son of Leon, and having cultivated favor with the [Persian]
    king, he secured the arrangement whereby all the Greek cities in Asia, and the islands that border
    upon Asia, were handed over to the king, while the Spartans retained possession of them as tribute-paying
    subjects—this, at the time when peace was made among the Greeks, if indeed one can call "peace" the
    outrage and betrayal of Greece, a peace which no war ever ended more shamefully for the defeated.

    For this reason, Artaxerxes continually detested the other Spartans and, as Deinon says, considered
    them the most shameless of all men; yet he greatly favored Antalcidas, who had gone up to Persia.
    And once, taking one of the summer garlands and dipping it in the most costly perfume, he sent it
    to Antalcidas after dinner—and everyone marveled at the gesture of goodwill.

    He was, it seems, quite ready to indulge himself, and to receive such a garland after having danced
    out Leonidas and Callicratidas in Pisai.

    Athenaeus I, p. 48, D:

    So the Cretan Timagoras—or rather the man from Gortyn, as Phanias the Peripatetic says—Entimus, who
    journeyed to the king out of admiration for Themistocles, was honored by Artaxerxes. The king gave
    him a tent remarkable in both beauty and size, and a couch with silver feet. He also sent luxurious
    bedclothes and even the servant to make the bed, claiming that the Greeks did not know how to lay
    bedding properly. This Cretan was even invited to the royal family banquet, having delighted the king—something
    that had never before happened to any Greek, nor ever after. For such honors were reserved for the
    king’s relatives.

    Even Timagoras the Athenian, who prostrated himself before the king and was otherwise highly honored,
    did not receive such a privilege; he was only sent some food from the king’s table. As for Antalcidas
    the Spartan, the king sent him his own garland, dipped in perfume. But to Entimus, the king bestowed
    many such honors, and invited him to the royal family banquet. This the Persians resented bitterly,
    seeing it as an infringement upon royal privilege and a sign that another campaign against Greece
    was coming.

    The king sent him, in addition: a silver-footed couch, bedding, a flowered canopy tent with a vaulted
    ceiling, a silver throne, a parasol gilded with gold, libation bowls inlaid with gemstones and made
    of gold, and also a hundred large silver bowls, silver mixing vessels, one hundred maidservants, one
    hundred boys, six thousand gold staters—aside from the daily provisions regularly supplied.'

    Καὶ τὰ τῇ Κλεοπάτρᾳ πρὸς ἀχῶρας γεγραμμένα ἐφεξῆς εἰρήσεται κατὰ τὴν ἐκείνης αὐτῆς λέξιν. πρὸς ἀχῶρας.
    τήλει λεπτῇ ἑφθῇ, μέλανος τεύτλου χυλῷ βεβρεγμένῃ, ἐκκλυζέσθω ἡ κεφαλὴ ἢ τεύτλου ἀφεψήματι ἢ γῇ κιμωλίᾳ
    βεβρεγμένῃ τούτοις ἐκκλυσαμένῃ, καταχριέσθω μυρσίνῃ λείᾳ μετ'' οἰνελαίου, ἄνωθεν δὲ ἐπιτιθέσθω φύλλα
    τεύτλου.'
  translation: '“And in what follows I will quote in her very own words the things Cleopatra wrote against
    dandruff :


    ‘For Dandruff


    Boiled fine fenugreek


    Steeped juice of black beets


    After washing with this preparation, the head is to be washed thoroughly either with a decoction of
    beets or wet cimolian earth. Wash it out using a paste made of myrtle with wine and oil, and place
    leaves of beet on top of the head.’”'

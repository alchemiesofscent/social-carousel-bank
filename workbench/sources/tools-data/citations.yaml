  author: ''
  work: ''
  reference: '** Aëtius, *Iatricorum liber* xii, ch. 55, ll. 37–44.'
  source_class: appendix_context
  usage_type: recipe
  family: Appendix And Semantic Control
  citation_order: 1
  greek: κόψας τὰ ξηρὰ καὶ ἀραιοτέρῳ κοσκίνῳ σήσας βρέχε πάντα τῷ παλαιῷ οἴνῳ, τὸ δὲ βδέλλιον καὶ τὸ λάδανον προβρέχων καὶ λεάνας ἐν θυείᾳ ἐπίβαλε τοῖς βεβρεγμένοις· ἔστω δὲ τὸ ἀγγεῖον μυρεψικὸν κασσιτέρινον καὶ πωμάσας ἐπιμελῶς ἔα ἡμέρας καὶ νύκτας δύο. εἶτα τὴν σταφυλὴν προμεμαρασμένην λαβών, ἵνα μηδὲν σχῇ δρόσου, καὶ καθαρίως ἐκθλίψας καὶ διηθήσας ἐκ τῶν γιγάρτων ἔμβαλε τὸ γλεῦκος εἰς ἕτερον ἀγγεῖον γεγανωμένον τῷ κασσιτέρῳ· ἔστω δὲ μέγα, ὥστε καὶ εἰς τὸ ζέμα τοῦ γλεύκους χώραν ἔχειν ἱκανήν. εἶτα ἐπίβαλε τῷ γλεύκει πάντα τὰ ἐν τῷ παλαιῷ οἴνῳ βεβρεγμένα καὶ τὸ ἔλαιον καὶ σάλευε σπάθῃ μυρεψικῇ δὶς τῆς ἡμέρας· ἐπιμελῶς δὲ ἡ σπάθη ἀπομασσέσθω, ἵνα μὴ τὸ προσκείμενον αὐτῇ ὀξίσαν βλάψῃ τὸ φάρμακον. σκεπέσθω δὲ τὸ σκεῦος πώματι καὶ ἄνωθεν ἱματίοις καὶ κέντρωσιν ἀραιοῖς πλείοσι καὶ περιδείσθω ἐπιμελῶς, ὑποκείσθω δὲ τῷ ἀγγείῳ σπεῖρα ἑδράζουσα. ὅταν δὲ ἡμέραι ιεʹ διέλθωσιν, τὸ ἄμωμον ἀποδιδόσθω κεκομμένον καὶ πάλιν σαλευέσθω ὡς εἴρηται· τριακοστῇ δὲ ἡμέρᾳ ἐπὶ διπλώματος ἕψε καί, ὅταν γʹ ἢ δʹ ζέματα
    λάβῃ, καθελὼν ἀπὸ τοῦ πυρὸς ἐπίβαλε εὐθέως τὸ ὀποβάλσαμον καὶ ἀνακινήσας καὶ σκεπάσας καλῶς ἔα χλιαίνεσθαι. ... καὶ ποιήσας τὸ μύρον κατ' ἰδίαν ἐπίβαλε αὐτῷ τὸ μαλαβάθρινον μύρον, προχλιανθὲν ἐν διπλώματι ἐπὶ θερμοῦ ὕδατος.
  translation: After cutting the dry ingredients and sifting them through a rather open sieve, soak them all in old wine; and after first moistening bdellium and ladanum and grinding them in a mortar, add them to the soaked materials. Let the vessel be a tin perfumer’s vessel, and after carefully stoppering it leave it for two days and nights. Then take grapes that have first been slightly withered so that they have no dew on them, press them cleanly, strain out the pips, and put the must into another vessel tinned with tin; it should be large, so that it has enough room for the must’s boiling up. Then add to the must all the ingredients that have been soaked in the old wine, along with the oil, and stir with a perfumer’s spatula twice a day; and the spatula must be carefully wiped, so that what clings to it, if it turns sour, does not damage the medicine. The container must be covered with a lid and with cloths above, and carefully bound round with several loose stitches; and a supporting
    coil should be placed beneath the vessel. When fifteen days have passed, the amomum is to be added, chopped more finely, and it is to be stirred again as directed. On the thirtieth day boil it in a double vessel; and when it has taken three or four boilings, remove it from the fire and immediately add the opobalsamum, then stir it and cover it well and let it grow warm. ... and after making the perfume separately, add to it the malabathrum perfume, first made lukewarm in a double vessel over hot water.
  context_note: '**Greek** > κόψας τὰ ξηρὰ καὶ ἀραιοτέρῳ κοσκίνῳ σήσας βρέχε πάντα τῷ παλαιῷ οἴνῳ, τὸ δὲ βδέλλιον καὶ τὸ λάδανον προβρέχων καὶ λεάνας ἐν θυείᾳ ἐπίβαλε τοῖς βεβρεγμένοις· ἔστω δὲ τὸ ἀγγεῖον μυρεψικὸν κασσιτέρινον καὶ πωμάσας ἐπιμελῶς ἔα ἡμέρας καὶ νύκτας δύο.'
  raw_source_location: tools-texts-raw.md:## Tin-lined and related perfumer's vessels
  overview_anchor: term-tin-lined-vessels
  reader_anchor: cit-tin-lined-vessels-cit-1
- id: tin-lined-vessels-cit-2
  term_ids:
  - tin-lined-vessels

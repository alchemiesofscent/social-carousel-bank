  greek: οἶσθα δὲ καὶ ὡς ἐπ' ἀγγείου διπλοῦ προϋποβεβλημένου κατὰ τὸ ἕτερον αὐτῶν τὸ μεῖζον ὕδατος ζέοντος, ἔθος ἡμῖν ἐστι θερμαίνειν τὰ μύρα· διαφθείρεται γὰρ ἡ δύναμις αὐτῶν ἑτέρως θερμανθέντων.
  translation: You know too that we are accustomed to heat perfumes on a double vessel, with boiling water placed beforehand in the larger of the two parts; for their potency is destroyed if they are heated in another way.
  context_note: '**Greek** > οἶσθα δὲ καὶ ὡς ἐπ'' ἀγγείου διπλοῦ προϋποβεβλημένου κατὰ τὸ ἕτερον αὐτῶν τὸ μεῖζον ὕδατος ζέοντος, ἔθος ἡμῖν ἐστι θερμαίνειν τὰ μύρα· διαφθείρεται γὰρ ἡ δύναμις αὐτῶν ἑτέρως θερμανθέντων.'

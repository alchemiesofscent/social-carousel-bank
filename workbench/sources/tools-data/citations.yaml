  greek: λαβὼν βῖκον ὑάλινον, χάλασον τὰ ὄντα ἐν τῷ ἄμβικι ἐν αὐτῷ, καὶ πωμάσας τὸν βῖκον ὀστράκῳ γεγανωμένῳ ἰσομέτρῳ τοῦ χείλους τοῦ βίκου, περιφίμου ἀσφαλείᾳ οἵᾳ βούλει … καὶ ἔασον τοῦτο ἐν βολβίτοις καμίνου ἡμέρας μαʹ
  translation: Taking a glass jar, transfer into it what is in the alembic, and, after stoppering the jar with a sealed potsherd fitted to the rim of the jar and luting it securely as you wish … leave it in the furnace’s dung-fuel for forty-one days.
  context_note: In alchemical instructions a βῖκος is a glass vessel incorporated into the apparatus itself.

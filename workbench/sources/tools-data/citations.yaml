  greek: '"...ἕτερον ὀστράκινον ἀγγεῖον ἄωτον λαβὼν μακροτράχηλον..."'
  translation: '"...taking another handle-less earthenware vessel with a long neck..."'
  context_note: Used in a primitive downward-distillation/fumigation setup (Aetius 1.135). Aetius specifies using a handleless vessel (**ἄωτον**) and another with a long neck (**μακροτράχηλον**) buried in the earth to catch infused vapors without catching fire.

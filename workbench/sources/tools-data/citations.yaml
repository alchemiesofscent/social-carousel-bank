  greek: τὰς δὲ εἰς τὰ ὀφθαλμικὰ λίνῳ ἀποδήσας βάλε εἰς βῖκον ὑελοῦν ἔχοντα μέλι, καὶ τὴν ἀρχὴν τοῦ λίνου περιδήσας τῷ στόματι τοῦ βίκου πωμάσας ἀπόθου
  translation: For the portions meant for eye-medicines, after tying them with linen, put them into a glass jar containing honey; then, after fastening the end of the linen to the mouth of the jar and stoppering it, store it.

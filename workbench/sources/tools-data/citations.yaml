  reference: '** Galenus, *De compositione medicamentorum secundum locos* x, Kühn 13.53.14 ff.'
  source_class: primary_technical
  usage_type: unknown
  family: Appendix And Semantic Control
  citation_order: 3
  greek: '... καὶ βάλλοντες εἰς κεραμεοῦν ἀγγεῖον, ἐπιβάλλομεν αὐταῖς ὕδατος γλυκέος ... καὶ θέντες ἐπὶ πυρὸς ἕψομεν. ὅταν δὲ εἰς ἥμισυ καταχθῇ, καθαιροῦμεν καὶ διϋλίζομεν εἰς διπλοῦν ἀγγεῖον μυρεψικόν. καὶ τὰς μὲν ῥίζας ἐκθλίψαντες ῥίπτομεν, εἰς δὲ τὸ ὕδωρ ἐπιβάλλομεν ἁδρομερῶς κεκομμένα ... εἶτ'' ἐπὶ τὸ πῦρ ἐπιθέντες πάλιν ἕψομεν, καὶ ὅταν εἰς ἡμίσειαν καταντήσῃ, πάλιν διϋλίζομεν εἰς ἕτερον ἀγγεῖον μυρεψικὸν μικρόν. ... μεταίρομεν εἰς ἀγγεῖον ὑελοῦν ἢ ἀργυροῦν.'
  translation: '... putting them into a ceramic vessel, we pour sweet water over them ... and setting it on the fire we boil it. When it has been reduced to half, we skim it and strain it into a double perfumer’s vessel. After squeezing out the roots, we throw them away, and into the liquid we put the other ingredients, cut in coarse pieces ... then setting it on the fire again we boil it once more, and when it has come down to half, we again strain it into another small perfumer’s vessel. ... we transfer it into a glass or silver vessel.'
  context_note: '**Greek** > ...'

  greek: πάντα θλάσας καὶ βαλὼν εἰς ἄγγος διπλοῦν μυρεψικὸν, ἐπίβαλλε οἴνου τμωλίτου ξε. ηʹ. ἔα βρέχεσθαι ἐπὶ ἡμέρας γʹ. εἶτ' ἐπίβαλλε ἐλαίου Σαβίνου λίτρας ιστʹ. ἰρίνου λίτραν αʹ. σχινίνου λίτραν αʹ. Συριακοῦ λίτραν αʹ. γλευκίνου λίτραν αʹ. μυρσίνου λίτραν αʹ. δαφνίνου λίτραν αʹ. καὶ θεὶς ἐπὶ τὸ πῦρ ἕψε, ἔπειτα τὸ ὑγρὸν ἐκθλίψας τῶν ἡψημένων, ἐξέρα εἰς ἕτερον ἀγγεῖον καὶ πάλιν ἕψε.
  translation: Crush everything and put it into a double perfumer’s vessel; pour in eight sextarii of Tmolian wine; leave it to soak for three days. Then add sixteen pounds of Sabine oil, one pound of iris oil, one pound of mastic oil, one pound of Syrian oil, one pound of must-oil, one pound of myrtle oil, and one pound of bay oil; and setting it on the fire boil it. Then, after pressing the liquid out from the boiled materials, transfer it to another vessel and boil it again.
  context_note: '**Greek** > πάντα θλάσας καὶ βαλὼν εἰς ἄγγος διπλοῦν μυρεψικὸν, ἐπίβαλλε οἴνου τμωλίτου ξε.'

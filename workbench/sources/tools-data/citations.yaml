  author: ''
  work: ''
  reference: '** Galenus, *De compositione medicamentorum per genera* vii, Kühn 13.1043.17–1044.6.'
  source_class: primary_technical
  usage_type: unknown
  family: Appendix And Semantic Control
  citation_order: 2
  greek: βαλὼν εἰς μικρὸν ἀγγεῖον μυρεψικὸν κασσιτερινὸν, πωμάσας ἐπιμελῶς ἔα ἐπὶ δώδεκα ἡμέρας καὶ δώδεκα νύκτας. συγχρονισάτω δὲ τὸ γλεῦκος καθαρῶς σταφυλῆς ἐκτεθλιμμένης, ἵνα μηδὲν ἔχῃ δρόσου. βαλὼν δὲ τὸ γλεῦκος εἰς μέγα χαλκεῖον, ὥστε καὶ εἰς τὸ ζέμα τοῦ γλεύκους χώραν ἔχειν, ἐπιβάλλειν πάντα ἐν τῷ οἴνῳ βεβρεγμένα καὶ τὸ ἔλαιον καὶ τὸν οἶνον δὶς τῆς ἡμέρας ἐν σπάθῃ μυρεψικῇ σαλευέσθω ἐπὶ ὥραν. ἡ δὲ σπάθη ἀπομασσέσθω ἐπιμελῶς, ἵνα μὴ τὸ προσμεῖναν ἐν αὐτῇ ὀξῦσαν βλάπτῃ τὸ φάρμακον πάλιν καταθείσης τῆς σπάθης. ἐσκευάσθω δὲ τὸ σκεῦος πώματι καὶ ἄνωθεν κεντρῶσι πλείοσι καὶ περιδείσθω ἐπιμελῶς. ὑποκείσθω δὲ τῷ ἀγγείῳ σπείρα. ὅταν δὲ ἡμέραι ιεʹ. διέλθωσι, τὸ ἀμμωνιακὸν καὶ αὐτὸ τὸ ἄμωμον ἀποδιδόσθω, ὁλοσχερέστερον κεκομμένον. λʹ. δὲ ἡμέρας ἐν διπλῷ ἀγγείῳ ἐπ' ἀνθράκων δύο ἢ τρία ζέματα δεῖ ἐνδιδόναι, τῷ μύρῳ ἀποδιδόντας καὶ τὸ ὀποβάλσαμον.
  translation: Put it into a small tin perfumer’s vessel, stopper it carefully, and leave it for twelve days and twelve nights. The must too should be prepared at the same time from grapes cleanly pressed, so that it has no dew in it. Put the must into a large bronze vessel, with enough room for the must to rise in boiling; add all the ingredients that have been soaked in the wine, together with the oil, and let the mixture be stirred with a perfumer’s spatula twice a day for an hour. The spatula must be carefully wiped, so that whatever remains on it, if it turns sour, does not damage the medicine when the spatula is put back again. The vessel must be fitted with a lid and above that with several coverings, and carefully bound around; and a coil-support should be placed beneath the vessel. When fifteen days have passed, the ammoniacum and the amomum are to be added, chopped more completely. On the thirtieth day, in a double vessel over coals, it must be given two or three boilings, while
    the opobalsamum is also added to the perfume.
  context_note: '**Greek** > βαλὼν εἰς μικρὸν ἀγγεῖον μυρεψικὸν κασσιτερινὸν, πωμάσας ἐπιμελῶς ἔα ἐπὶ δώδεκα ἡμέρας καὶ δώδεκα νύκτας.'

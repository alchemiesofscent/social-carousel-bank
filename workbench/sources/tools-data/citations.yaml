  citation_order: 4
  greek: τό γε μὴν ὄνομα τοῦ βίκου παρ' ἡμῖν μὲν πάνυ σύνηθές ἐστι καὶ μόνως οὕτως ὀνομάζεται, παρὰ δὲ τοῖς Ἀττικοῖς ἴσως ἄρακος ἢ λάθυρος ἐκαλεῖτο
  translation: The name βῖκος is very familiar among us and it is called only by this name; among the Attics, however, it was perhaps called ἄρακος or λάθυρος.
  context_note: 'In dietetic and veterinary passages βῖκος is not a vessel but a plant product: a pulse or leguminous seed used as food or fodder.'

  greek: τὰ προειρημένα ἅπαντα παχυμερῶς κόπτεται καὶ βρέχεται ἐπὶ ἡμέρας <γ>, τῇ δὲ ἑξῆς ἕψεται ἐν διπλώματι εἰς τὸ τρίτον, ἔπειτα ἐκθλίβομεν καὶ διηθοῦμεν.
  translation: All the ingredients mentioned above are cut in thick pieces and soaked for three days; on the next day they are boiled in a double vessel down to a third, then we press them out and filter them.
  context_note: '**Greek** > τὰ προειρημένα ἅπαντα παχυμερῶς κόπτεται καὶ βρέχεται ἐπὶ ἡμέρας <γ>, τῇ δὲ ἑξῆς ἕψεται ἐν διπλώματι εἰς τὸ τρίτον, ἔπειτα ἐκθλίβομεν καὶ διηθοῦμεν.'

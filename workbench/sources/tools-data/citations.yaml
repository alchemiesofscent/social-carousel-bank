  usage_type: storage
  family: Containers And Storage
  citation_order: 2
  greek: ὀνομάζομεν δὲ οὕτως, ὅταν ἐν κακκάβῃ θερμὸν ὕδωρ ἐχούσῃ σκεῦος ἕτερον ἐνίσταται μετὰ τῶν τηκτῶν ἔχον καὶ τὴν χαλβάνην, ὑποκαιομένης τῆς κακκάβης.
  translation: “We call it this when another vessel containing the meltable substances and galbanum is set inside a *kakkábē* holding hot water, while the *kakkábē* is heated from below.”
  context_note: In compound pharmacology, **κακκάβη** can name the outer pot that holds hot water while a second container is set inside it.

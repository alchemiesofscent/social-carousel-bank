  greek: καλεῖται δ' οὕτως, ἐπειδὰν προϋποκειμένου λέβητος ὕδωρ ἔχοντος ζέον ἐνιστῆταί τι τούτῳ μικρότερον ἀγγεῖον, εἰς ὃ μέλλει τὸ ἔλαιον ἐγχεῖσθαι.
  translation: It is so called when, with a cauldron set underneath that contains boiling water, a smaller vessel is inserted into it, into which the oil that is to be heated is about to be poured.

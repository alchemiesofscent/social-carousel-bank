  citation_order: 1
  greek: '"...ἄφες τὸ ἔλαιον ἐν τῷ κακκάβῳ ἀγανώτῳ ὄντι, καὶ βαφήσεται..." / "...ἕψε ἐν κακκάβῃ γεγανωμένῃ..."'
  translation: '"...leave the oil in the cauldron, it being untinned, and it will be dyed..." / "...boil it in a tinned cauldron..."'
  context_note: A metal pot used for boiling oil and aromatics. Paul remarkably distinguishes between an **untinned** (*aganotos*) cauldron (used to purposefully tint the oil green via copper oxidation) and a **tinned** (*geganomene*) cauldron (to prevent unwanted metallic reactions).

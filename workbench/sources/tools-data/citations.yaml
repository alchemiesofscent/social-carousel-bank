  greek: «λίθος ἀλαβαστρίτης ὁ καλούμενος ὄνυξ … κεκαυμένος ῥητίνῃ ἢ πίσσῃ διαφορεῖ σκληρίας, στομάχου δὲ ἀλγήματα μετὰ κηρωτῆς παρηγορεῖ· στέλλει δὲ καὶ οὖλα.»
  translation: “The stone called alabastrites, also called onyx, when calcined with resin or pitch disperses hard swellings; with wax salve it soothes pains of the stomach, and it also contracts the gums.”
  context_note: '1.'
  raw_source_location: tools-texts-raw.md:## ἀλάβαστρον

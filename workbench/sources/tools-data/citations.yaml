  greek: τοὺς ἀκρέμονας τῆς αἰγείρου κόψας ἐπιμελῶς, ἔχε ἐν ἀγγείῳ διπλῷ μυρεψικῷ καὶ τούτοις ἐπίβαλλε σάμψυχον, ῥίζαν σικύου κόψας παχυμερῶς καὶ τούτοις ἐπίβαλλε τὸν οἶνον καὶ πάντα ἔα βρέχεσθαι ἐπὶ ἡμέρας θʹ. τῇ δ' ἐπιούσῃ ἐπιβαλὼν τὸ ἔλαιον καὶ ἀνακόψας ἐπιμελῶς ἕψε, πυρὶ χρώμενος μαλακῷ.
  translation: After carefully cutting the poplar catkins, keep them in a double perfumer’s vessel, and add sweet marjoram to them; after cutting the squirting-cucumber root in coarse pieces, add the wine to these, and leave everything to soak for nine days. On the next day, after adding the oil and stirring carefully, boil it, using a gentle fire.
  context_note: '**Greek** > τοὺς ἀκρέμονας τῆς αἰγείρου κόψας ἐπιμελῶς, ἔχε ἐν ἀγγείῳ διπλῷ μυρεψικῷ καὶ τούτοις ἐπίβαλλε σάμψυχον, ῥίζαν σικύου κόψας παχυμερῶς καὶ τούτοις ἐπίβαλλε τὸν οἶνον καὶ πάντα ἔα βρέχεσθαι ἐπὶ ἡμέρας θʹ.'

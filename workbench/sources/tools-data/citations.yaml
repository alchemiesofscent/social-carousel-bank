  greek: Ῥόδων ἐρυθρῶν ὠνυχισμένων καὶ διεψυγμένων νυχθήμερον <α> 𐆄 <γ>, ἐλαίου ὀμφακίνου ξ̸ Ἰταλικὸν <α>· περισφίγξας ἐπιμελῶς τὸν βῖκον, ὡς μὴ διαπνεῖσθαι, ἡλίου ἐν ὑπαίθρῳ ἐπὶ <μ> ἡμέρας
  translation: With three ounces of red roses, trimmed and cooled for a day and a night, and one Italian sextarius of omphacine oil, after carefully binding the jar so that it does not vent, keep it in the open air under the sun for forty days.
  context_note: In perfumery recipes a βῖκος is the jar into which oil and aromatic flowers are put for infusion.

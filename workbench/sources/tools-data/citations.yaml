  greek: «Γινώσκεται γὰρ ὅτι ὁ λίθος ὁ ἀλαβαστρίτης ἐγκέφαλος κέκληται… Λαβὼν οὖν τὸν ἀλαβάστρινον λίθον, ὄπτα νυχθήμερον καὶ ἔχε ἄσβεστον.»

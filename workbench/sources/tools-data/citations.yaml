  greek: τὰ προειρημένα εἰς παχέα κόπτεται καὶ βρέχεται ἐν ἀγγείῳ διπλῷ μυρεψικῷ ἐπὶ ἡμέρας γʹ. τῇ δ' ἐπιούσῃ ἕψεται εἰς τὸ τρίτον, ἔπειτα εἰς κυρτίδα βαλόντες ἐκθλίβομεν τὸ ὑγρὸν εἰς ἕτερον ἀγγεῖον μυρεψικὸν, τὰ δὲ ἀφεψημένα ἀποῤῥίπτομεν.
  translation: The ingredients mentioned above are cut into coarse pieces and soaked in a double perfumer’s vessel for three days. On the following day it is boiled down to a third; then, after putting it into a straining bag, we press the liquid out into another perfumer’s vessel, and the boiled-out solids we throw away.
  context_note: '**Greek** > τὰ προειρημένα εἰς παχέα κόπτεται καὶ βρέχεται ἐν ἀγγείῳ διπλῷ μυρεψικῷ ἐπὶ ἡμέρας γʹ.'

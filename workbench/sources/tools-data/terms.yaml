  review_batch: heat-soaking-and-controlled-processing
  review_priority: 201
  family_status: confirmed
  family_rationale: Confirmed in Heat, Soaking, And Controlled Processing because the term names a controlled heating method rather than a storage vessel or filter.
  editorial_summary_short: A δίπλωμα is the doubled heating arrangement used when delicate oils, waxes, or perfumes must be warmed gently.
  editorial_summary_long: In the recipes, δίπλωμα is the shorthand term for gentle, indirect heating. It is the setup used to melt wax with rose oil or make an existing perfume merely lukewarm, not to subject aromatics to aggressive boiling. Read alongside the fuller descriptions of the doubled perfumer's vessel, it points to water-bath-style process control. The key point is technical function, not reconstructable shape.
  editorial_why_it_matters: This is the clearest sign that ancient perfume work distinguished between direct fire and protected, indirect heat.
